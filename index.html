  id: 21, mod: 'm3', minutes: 60,
  title: 'Future Continuous и Future Perfect (базовое введение)',
  short: 'Future Cont. & Perfect',
  subtitle: 'Процессы и результаты к определённому моменту в будущем. 30 слов о дедлайнах.',
  theory: [
    { title: 'Future Continuous: процесс в будущем', html:
`<div class="formula">will be <span class="plus">+</span> V-ing</div>
<table>
<tr><th></th><th>Форма</th><th>Пример</th></tr>
<tr><td><b>+</b></td><td class="en">will be working</td><td class="en">At 10 a.m. tomorrow I <b>will be flying</b> to Berlin.</td></tr>
<tr><td><b>−</b></td><td class="en">won't be working</td><td class="en">She <b>won't be working</b> next week — she is on holiday.</td></tr>
<tr><td><b>?</b></td><td class="en">Will you be working?</td><td class="en"><b>Will</b> you <b>be using</b> the car tomorrow?</td></tr>
</table>
<h4>Когда использовать</h4>
<ol>
<li><b>Действие в процессе в конкретный момент будущего.</b><br><span class="eng">This time next week I <b>will be lying</b> on the beach. At 9 a.m. tomorrow we <b>will be having</b> a meeting.</span></li>
<li><b>Действие, которое уже запланировано/идёт по ходу событий</b> (не решение, а «так получится»).<br><span class="eng">I<b>'ll be seeing</b> John at the conference, so I can give him the file.</span></li>
<li><b>Вежливый вопрос о планах собеседника.</b><br><span class="eng"><b>Will</b> you <b>be using</b> the printer later? <b>Will</b> you <b>be needing</b> anything else?</span></li>
<li><b>Предположение о настоящем.</b><br><span class="eng">Don’t call him now — he<b>'ll be sleeping</b>.</span></li>
</ol>
<div class="note tip"><span class="nt">Отличие от Future Simple</span><span class="eng">I <b>will work</b> at 10 a.m.</span> = я начну/буду работать (факт, решение).<br>
<span class="eng">I <b>will be working</b> at 10 a.m.</span> = в 10 утра я буду находиться в процессе работы.</div>
<div class="note warn"><span class="nt">Глаголы состояния</span>С Future Continuous, как и с другими Continuous, stative verbs обычно не используются: <span class="neg">I will be knowing</span> → <span class="pos">I will know</span>.</div>` },

    { title: 'Future Perfect: результат к моменту в будущем', html:
`<div class="formula">will have <span class="plus">+</span> V3</div>
<table>
<tr><th></th><th>Форма</th><th>Пример</th></tr>
<tr><td><b>+</b></td><td class="en">will have finished</td><td class="en">By Friday I <b>will have finished</b> the report.</td></tr>
<tr><td><b>−</b></td><td class="en">won't have finished</td><td class="en">They <b>won't have finished</b> by then.</td></tr>
<tr><td><b>?</b></td><td class="en">Will you have finished…?</td><td class="en"><b>Will</b> you <b>have finished</b> by 5 p.m.?</td></tr>
</table>
<h4>Когда использовать</h4>
<ol>
<li><b>Действие завершится ДО определённого момента в будущем.</b><br><span class="eng"><b>By</b> 2030 we <b>will have doubled</b> our revenue. <b>By the time</b> you arrive, I <b>will have left</b>.</span></li>
<li><b>Опыт/результат к будущему моменту.</b><br><span class="eng">In December I <b>will have worked</b> here for ten years.</span></li>
<li><b>Уверенное предположение о завершённом.</b><br><span class="eng">The email <b>will have arrived</b> by now.</span></li>
</ol>
<div class="note rule"><span class="nt">Главный маркер — BY</span>
<b>by</b> + момент: by Friday, by the end of the year, by 2030, by then, by that time, by the time + предложение.<br>
<span class="eng">By the time the client calls, we <b>will have prepared</b> everything.</span></div>
<div class="note warn"><span class="nt">Не путай</span><span class="neg">By Friday I will finish</span> — допустимо в речи, но грамматически точнее <span class="pos">By Friday I <b>will have finished</b></span>: к пятнице действие уже будет завершено.</div>` },

    { title: 'Future Perfect Continuous: длительность к моменту', html:
`<div class="formula">will have been <span class="plus">+</span> V-ing</div>
<div class="eg"><span class="t">In March I <b>will have been working</b> here for five years. By 2030 they <b>will have been developing</b> the product for a decade.</span><span class="r">Акцент на длительности процесса к будущему моменту.</span></div>
<table>
<tr><th>Время</th><th>Акцент</th><th>Пример</th></tr>
<tr><td class="en">Future Simple</td><td>факт</td><td class="en">By June we <b>will finish</b> the project.</td></tr>
<tr><td class="en">Future Continuous</td><td>процесс в момент</td><td class="en">In June we <b>will be finishing</b> the project.</td></tr>
<tr><td class="en">Future Perfect</td><td>результат к моменту</td><td class="en">By June we <b>will have finished</b> the project.</td></tr>
<tr><td class="en">Future Perfect Continuous</td><td>длительность к моменту</td><td class="en">By June we <b>will have been working</b> on it for a year.</td></tr>
</table>
<div class="note tip"><span class="nt">Когда это нужно</span>Future Perfect Continuous встречается редко — в основном в отчётах и резюме: <span class="eng">By the end of this year, I <b>will have been working</b> in finance for 10 years.</span> В деловой переписке чаще используют Future Perfect или Present Perfect.</div>` },

    { title: 'Другие способы говорить о будущем', html:
`<table>
<tr><th>Средство</th><th>Значение</th><th>Пример</th></tr>
<tr><td class="en"><b>will</b></td><td>спонтанное решение, предсказание, обещание</td><td class="en">I’ll send it right now.</td></tr>
<tr><td class="en"><b>be going to</b></td><td>план, намерение, признак</td><td class="en">We are going to launch in June.</td></tr>
<tr><td class="en"><b>Present Continuous</b></td><td>личная договорённость (точное время и место)</td><td class="en">I am meeting the client at 3 tomorrow.</td></tr>
<tr><td class="en"><b>Present Simple</b></td><td>расписание, программа</td><td class="en">The conference starts at 9 a.m. The train leaves at 7:40.</td></tr>
<tr><td class="en"><b>be about to</b></td><td>вот-вот произойдёт</td><td class="en">We are about to sign the contract.</td></tr>
<tr><td class="en"><b>be due to</b></td><td>по плану/расписанию (официально)</td><td class="en">The report is due to be published on Friday. The train is due to arrive at 6.</td></tr>
<tr><td class="en"><b>be to</b></td><td>официальная договорённость, инструкция</td><td class="en">The CEO is to visit our office in May.</td></tr>
<tr><td class="en"><b>be expected to / be likely to</b></td><td>прогноз</td><td class="en">Sales are expected to grow by 10%.</td></tr>
<tr><td class="en"><b>shall</b></td><td>предложение (I/we)</td><td class="en">Shall we start?</td></tr>
</table>
<div class="eg"><span class="t">The results <b>are due to be</b> announced tomorrow. Sales <b>are expected to</b> grow by 10%. We <b>are about to</b> close the deal.</span><span class="r">Это язык деловых новостей и прогнозов.</span></div>
<div class="note warn"><span class="nt">После when, if, as soon as, until, before, after — Present Simple</span><span class="eng">I will call you when I <b>arrive</b>. We’ll start as soon as the client <b>signs</b>.</span></div>` },

    { title: 'Дедлайны и сроки: деловые формулировки', html:
`<table>
<tr><th>Ситуация</th><th>Фраза</th></tr>
<tr><td>Установить срок</td><td class="en">The deadline <b>is</b> Friday. / The report <b>is due</b> on Friday. / The deadline <b>for</b> the report is 15 May.</td></tr>

<tr><td>Продлить</td><td class="en">Could we <b>extend the deadline</b> by a week? / <b>postpone</b> the delivery.</td></tr>
<tr><td>Перенести</td><td class="en">The launch has been <b>put off</b> until June. / <b>rescheduled for</b> Monday.</td></tr>
<tr><td>Крайний срок прошёл</td><td class="en">The deadline <b>has passed</b>. / The offer <b>has expired</b>.</td></tr>
<tr><td>План работ</td><td class="en">the <b>schedule</b>, the <b>timeline</b>, the <b>milestones</b>, the <b>action plan</b></td></tr>
</table>
<h4>Пример делового абзаца</h4>
<div class="eg"><span class="t">By the end of this quarter we <b>will have completed</b> the audit. At this time next month our team <b>will be working</b> on the new project. The final report <b>is due</b> on 30 June, and I am confident that we <b>will meet the deadline</b>. By 2026 the company <b>will have opened</b> three new offices.</span></div>
<div class="note rule"><span class="nt">Формула выбора</span>«В конкретный момент буду делать» → <b>Future Continuous</b>.<br>
«К конкретному моменту уже сделаю» → <b>Future Perfect</b>.<br>
«Просто сделаю» → <b>Future Simple</b>.<br>
«К этому моменту буду делать уже N лет» → <b>Future Perfect Continuous</b>.</div>` }

  id: 22, mod: 'm3', minutes: 65,
  title: 'Основы деловой переписки: структура простого email',
  short: 'Деловой email',
  subtitle: 'Шаблоны приветствия, основной части и прощания + 30 стандартных фраз.',
  theory: [
    { title: 'Анатомия делового письма', html:
`<table>
<tr><th>Блок</th><th>Что в нём</th><th>Пример</th></tr>
<tr><td>1. <b>Subject line</b></td><td>Тема — коротко и конкретно, 5–8 слов</td><td class="en">Invoice 245 — payment confirmation</td></tr>
<tr><td>2. <b>Salutation / Greeting</b></td><td>Приветствие</td><td class="en">Dear Mr Smith, / Dear Anna, / Good morning,</td></tr>
<tr><td>3. <b>Opening</b></td><td>Зачем пишете / реакция на контакт</td><td class="en">I am writing to enquire about… / Thank you for your email of 5 May.</td></tr>
<tr><td>4. <b>Body / Main part</b></td><td>Суть: 1 мысль = 1 абзац</td><td class="en">Please find attached… We would like to inform you that…</td></tr>
<tr><td>5. <b>Closing action</b></td><td>Что нужно от адресата</td><td class="en">Could you please confirm…? I would appreciate a reply by Friday.</td></tr>
<tr><td>6. <b>Sign-off</b></td><td>Прощание</td><td class="en">Kind regards, / Best regards, / Sincerely,</td></tr>
<tr><td>7. <b>Signature</b></td><td>Имя, должность, компания, контакты</td><td class="en">Anna Petrova | Finance Manager | ABC Ltd | +7 495 123 45 67</td></tr>
</table>
<h4>Правила хорошей темы письма</h4>
<ul>
<li>Конкретика: <span class="eng">Meeting rescheduled: 12 May, 3 p.m.</span> — не <span class="neg">Hello</span></li>
<li>Ключевые слова в начале: <span class="eng">Invoice 245 — overdue payment</span></li>
<li>Пометки при необходимости: <span class="eng">URGENT: server downtime</span>, <span class="eng">Action required: sign the contract</span>, <span class="eng">FYI: new price list</span></li>
</ul>
<div class="note warn"><span class="nt">Правило одного действия</span>Если письмо требует действия — напиши об этом в теме: <span class="eng">Action required: approve the budget by Friday</span>.</div>` },

    { title: 'Приветствие и прощание: формальность', html:
`<table>
<tr><th>Ситуация</th><th>Salutation</th><th>Sign-off</th></tr>
<tr><td>Не знаем имени</td><td class="en">Dear Sir or Madam, / To whom it may concern,</td><td class="en">Yours faithfully,</td></tr>
<tr><td>Знаем фамилию</td><td class="en">Dear Mr Smith, / Dear Ms Johnson,</td><td class="en">Yours sincerely,</td></tr>
<tr><td>Знаем человека / неформально</td><td class="en">Dear Anna, / Hi Anna, / Hello Anna,</td><td class="en">Best regards, / Kind regards, / Best,</td></tr>
<tr><td>Группе</td><td class="en">Dear all, / Dear colleagues, / Hi everyone,</td><td class="en">Best regards,</td></tr>
</table>
<div class="note rule"><span class="nt">Британская норма (запомни!)</span>
<b>Dear Sir or Madam → Yours faithfully</b> (не знаем имени)<br>
<b>Dear Mr Smith → Yours sincerely</b> (знаем имя)<br>
В американском английском чаще пишут <b>Sincerely</b> / <b>Best regards</b> в обоих случаях.</div>
<h4>Ms, Mrs, Miss</h4>
<ul>
<li><b>Ms</b> /mɪz/ — нейтрально, не указывает на замужество. <b>Всегда безопасный выбор.</b></li>
<li><b>Mrs</b> — замужняя (используй, только если человек сам так подписывается).</li>
<li><b>Miss</b> — незамужняя (устаревающее).</li>
<li><b>Mr</b> /ˈmɪstə/ — для мужчин.</li>
</ul>
<div class="note warn"><span class="nt">Ошибки</span><span class="neg">Dear Mr Smith. (с точкой)</span> — в BrE после Mr/Ms точка не ставится: <span class="pos">Dear Mr Smith,</span><br>
<span class="neg">Dear Smith,</span> — без титула фамилию не используют.<br>
<span class="neg">Hello Mr Smith!</span> — в деловом письме восклицательный знак неуместен.</div>` },

    { title: '30 стандартных фраз по блокам', html:
`<h4>1. Начало письма (opening)</h4>
<ul>
<li><span class="eng">I am writing to enquire about… / to ask about… / to inform you that… / to confirm… / to follow up on…</span></li>
<li><span class="eng">Thank you for your email of 5 May. / Thank you for getting back to me so quickly.</span></li>
<li><span class="eng">Further to our conversation yesterday, … / Following our phone call, …</span></li>
<li><span class="eng">I am writing in connection with… / with regard to… / concerning…</span></li>
<li><span class="eng">I hope this email finds you well. (вежливое клише)</span></li>
</ul>
<h4>2. Основная часть (body)</h4>
<ul>
<li><span class="eng">Please find attached the report. / Attached you will find the invoice.</span></li>
<li><span class="eng">I would like to inform you that… / Please note that… / I would like to point out that…</span></li>
<li><span class="eng">We are pleased to inform you that… / I regret to inform you that…</span></li>
<li><span class="eng">Could you please send me…? / I would be grateful if you could…</span></li>
<li><span class="eng">We would appreciate it if you could reply by Friday.</span></li>
</ul>
<h4>3. Просьбы и предложения</h4>
<ul>
<li><span class="eng">Would it be possible to…? / Could you possibly…?</span></li>
<li><span class="eng">I would like to suggest… / May I suggest…?</span></li>
<li><span class="eng">Please let me know if you need any further information.</span></li>
<li><span class="eng">Do not hesitate to contact me if you have any questions.</span></li>
</ul>
<h4>4. Завершение (closing)</h4>
<ul>
<li><span class="eng">I look forward to hearing from you. / I look forward to your reply.</span></li>
<li><span class="eng">Thank you in advance for your help. / Thank you for your cooperation.</span></li>
<li><span class="eng">I hope this is acceptable. / Please confirm receipt of this email.</span></li>
</ul>
<div class="note warn"><span class="nt">Ключевая грамматическая ловушка</span><b>I look forward to + V-ing</b> (to здесь предлог, не частица!):<br>
<span class="pos">I look forward to <b>hearing</b> from you.</span> <span class="neg">I look forward to hear from you.</span><br>
<span class="pos">I look forward to <b>meeting</b> you.</span></div>` },

    { title: 'Formal или informal? Как выбрать регистр', html:
`<table>
<tr><th>Неформально</th><th>Формально</th></tr>
<tr><td class="en">I want to tell you…</td><td class="en">I would like to inform you…</td></tr>

<tr><td class="en">Thanks!</td><td class="en">Thank you for your assistance.</td></tr>
<tr><td class="en">See you soon.</td><td class="en">I look forward to hearing from you.</td></tr>
<tr><td class="en">Get back to me.</td><td class="en">Please do not hesitate to contact me.</td></tr>
<tr><td class="en">Can’t do it.</td><td class="en">I am afraid this will not be possible.</td></tr>
<tr><td class="en">What about…?</td><td class="en">Would it be possible to…?</td></tr>
<tr><td class="en">Anyway, …</td><td class="en">In any case, …</td></tr>
</table>
<h4>Признаки формального стиля</h4>
<ul>
<li>Полные формы вместо сокращений: <span class="eng">I <b>am</b> writing</span> (не I’m), <span class="eng">we <b>will</b></span> (не we’ll)</li>
<li>Латинские/французские по происхождению слова: <span class="eng">inform (не tell), purchase (не buy), assist (не help), require (не need), apologise (не say sorry)</span></li>
<li>Пассив вместо актива: <span class="eng">The invoice <b>has been sent</b></span> (не We sent the invoice)</li>
<li>Без восклицательных знаков, эмодзи и сленга</li>
<li>Без «you should», вместо этого — <span class="eng">It would be advisable to…</span></li>
</ul>
<div class="note tip"><span class="nt">Золотая середина</span>Современный бизнес-английский стал проще: <b>Best regards + полные фразы без канцелярита</b> — норма для 90% писем. Строгий формальный стиль нужен для жалоб, юридических вопросов и первого контакта с незнакомым адресатом.</div>` },

<div class="eg"><span class="t"><b>Subject:</b> Enquiry about your marketing services<br><br>Dear Ms Johnson,<br><br>I am writing to enquire about the marketing services your company offers. We are a small IT company based in Berlin and we are looking for a partner to help us with our online advertising.<br><br>Could you please send me your price list and some examples of recent projects? I would also be grateful if you could let me know how soon you would be able to start.<br><br>I look forward to hearing from you.<br><br>Kind regards,<br>Anna Petrova<br>Marketing Manager, TechSoft GmbH</span></div>

<div class="eg"><span class="t"><b>Subject:</b> Invoice 245 — payment overdue<br><br>Dear Mr Brown,<br><br>I am writing in connection with invoice 245 for €5,000, which was due on 15 April.<br><br>According to our records, we have not yet received payment. Could you please check this and let us know when we can expect the transfer?<br><br>If you have already made the payment, please disregard this message.<br><br>Thank you for your cooperation.<br><br>Best regards,<br>Igor Smirnov<br>Accounts Department</span></div>

    { title: 'Шкала вежливости: от прямого к дипломатичному', html:
`<p>Одна и та же просьба может звучать как приказ, как просьба или как очень деликатное обращение. Разница — в модальном глаголе и «смягчителях».</p>
<table>
<tr><th>Уровень</th><th>Форма</th><th>Когда уместно</th></tr>
<tr><td>1. Прямо</td><td class="en"><b>Send</b> me the file. / <b>I want</b> to see the manager.</td><td class="ru">Подчинённым, в экстренной ситуации. С клиентом — <b>нельзя</b>.</td></tr>
<tr><td>2. Нейтрально</td><td class="en"><b>Can</b> you send me the file? / <b>Please send</b> me the file.</td><td class="ru">Коллеги, знакомые клиенты.</td></tr>
<tr><td>3. Вежливо</td><td class="en"><b>Could</b> you send me the file? / <b>Would</b> you send me the file?</td><td class="ru">Стандарт деловой переписки.</td></tr>
<tr><td>4. Очень вежливо</td><td class="en"><b>Would you mind sending</b> me the file? / <b>I would be grateful if you could send</b> me the file.</td><td class="ru">Первый контакт, просьба об одолжении.</td></tr>
<tr><td>5. Дипломатично</td><td class="en"><b>I was wondering if you could possibly send</b> me the file. / <b>Would it be possible to send</b> me the file?</td><td class="ru">Просьба, которая обременительна; отказ возможен.</td></tr>
</table>
<div class="note rule"><span class="nt">Почему could/would вежливее can/will</span>Форма прошедшего времени создаёт <b>дистанцию</b> — а дистанция = вежливость. <span class="eng">Can you…?</span> (близко, прямо) → <span class="eng">Could you…?</span> (дистанция, мягче). То же с will → would.</div>
<div class="note tip"><span class="nt">Май и кан</span><b>May</b> — самое формальное разрешение: <span class="eng">May I come in?</span> <b>Can</b> — разговорное: <span class="eng">Can I ask you something?</span> <b>Could</b> — универсальная вежливая середина.</div>` },

__LESS.push({
  id: 24, mod: 'm3', minutes: 65,
  title: 'Пассивный залог (Passive Voice) в Present и Past Simple',
  short: 'Passive Voice',
  subtitle: 'Как и зачем используется пассив в бизнесе и новостях. 30 глаголов + перефразирование.',
  theory: [
    { title: 'Зачем нужен пассив и как он строится', html:
`<div class="formula">be (в нужном времени) <span class="plus">+</span> V3 (причастие прошедшего времени)</div>
<div class="eg"><span class="t">Active: The manager <b>signed</b> the contract.<br>Passive: The contract <b>was signed</b> (by the manager).</span><span class="r">Объект действия становится подлежащим.</span></div>
<h4>Когда пассив необходим</h4>
<ol>
<li><b>Исполнитель неизвестен или не важен.</b> <span class="eng">The office <b>was cleaned</b> yesterday. My car <b>was stolen</b>.</span></li>
<li><b>Важнее результат, чем автор.</b> <span class="eng">The report <b>has been sent</b>. The product <b>is made</b> in Germany.</span></li>
<li><b>Официальный, безличный стиль</b> — инструкции, контракты, новости. <span class="eng">Payment <b>should be made</b> within 30 days. All visitors <b>must be registered</b>.</span></li>
<li><b>Чтобы не обвинять</b> (дипломатия). <span class="eng">A mistake <b>was made</b>.</span> вместо <span class="neg">You made a mistake.</span></li>
<li><b>Чтобы сохранить тему предложения.</b> <span class="eng">We bought a new company in 2020. It <b>was founded</b> in 1998 and <b>is based</b> in Berlin.</span></li>
</ol>
<div class="note rule"><span class="nt">Как выбрать залог</span>О ком/чём главное в предложении? Если о <b>действии или его объекте</b> → пассив. Если о <b>том, кто действует</b> → актив.</div>
<div class="note warn"><span class="nt">Не злоупотребляй</span>Современный деловой стиль стремится к активу: <span class="pos">We sent the invoice</span> лучше, чем <span class="neg">The invoice was sent by us</span>. Пассив нужен, когда исполнитель действительно не важен.</div>` },

    { title: 'Пассив во всех временах: таблица', html:
`<table>
<tr><th>Время</th><th>Формула</th><th>Пример</th></tr>
<tr><td>Present Simple</td><td class="en">am/is/are + V3</td><td class="en">The goods <b>are delivered</b> every Monday.</td></tr>
<tr><td>Past Simple</td><td class="en">was/were + V3</td><td class="en">The contract <b>was signed</b> in May.</td></tr>
<tr><td>Present Continuous</td><td class="en">am/is/are <b>being</b> + V3</td><td class="en">The office <b>is being cleaned</b> now.</td></tr>
<tr><td>Past Continuous</td><td class="en">was/were <b>being</b> + V3</td><td class="en">The system <b>was being tested</b> at 5 p.m.</td></tr>
<tr><td>Present Perfect</td><td class="en">have/has <b>been</b> + V3</td><td class="en">The invoice <b>has been paid</b>.</td></tr>
<tr><td>Past Perfect</td><td class="en">had <b>been</b> + V3</td><td class="en">The report <b>had been sent</b> before the meeting.</td></tr>
<tr><td>Future Simple</td><td class="en">will <b>be</b> + V3</td><td class="en">The results <b>will be announced</b> tomorrow.</td></tr>
<tr><td>Future Perfect</td><td class="en">will <b>have been</b> + V3</td><td class="en">By June the audit <b>will have been completed</b>.</td></tr>
<tr><td>модальные</td><td class="en">modal + <b>be</b> + V3</td><td class="en">Payment <b>must be made</b> by Friday. It <b>can be done</b>.</td></tr>
<tr><td>инфинитив / -ing</td><td class="en">to be + V3 / being + V3</td><td class="en">The goods need <b>to be checked</b>. I don’t like <b>being interrupted</b>.</td></tr>
</table>
<div class="note rule"><span class="nt">Формула на все случаи</span>Меняется <b>только форма be</b>. Смысловой глагол всегда в V3:<br>
is delivered → was delivered → has been delivered → will be delivered → must be delivered.</div>
<div class="note warn"><span class="nt">Частые ошибки</span><span class="neg">The report sent yesterday.</span> → <span class="pos">The report <b>was</b> sent yesterday.</span><br>
<span class="neg">The house was build in 1990.</span> → <span class="pos">The house was <b>built</b> in 1990.</span><br>
<span class="neg">The invoice has paid.</span> → <span class="pos">The invoice has <b>been</b> paid.</span></div>` },

    { title: 'Present Simple Passive: детально', html:
`<div class="formula">am / is / are <span class="plus">+</span> V3</div>
<table>
<tr><th></th><th>Ед. ч.</th><th>Мн. ч.</th></tr>
<tr><td><b>+</b></td><td class="en">The report <b>is written</b> every month.</td><td class="en">The reports <b>are written</b> every month.</td></tr>
<tr><td><b>−</b></td><td class="en">The report <b>isn't written</b> by hand.</td><td class="en">The reports <b>aren't sent</b> by post.</td></tr>
<tr><td><b>?</b></td><td class="en"><b>Is</b> the report <b>written</b> by hand?</td><td class="en"><b>Are</b> the goods <b>delivered</b> free?</td></tr>
</table>
<h4>Типичные употребления</h4>
<ul>
<li><b>Регулярные процессы:</b> <span class="eng">Our products <b>are made</b> in Italy. The data <b>is checked</b> twice. Invoices <b>are issued</b> monthly.</span></li>
<li><b>Общие факты:</b> <span class="eng">English <b>is spoken</b> all over the world. Oil <b>is exported</b> by sea.</span></li>
<li><b>Инструкции и правила:</b> <span class="eng">The form <b>is filled in</b> by the client. Passwords <b>are changed</b> every 90 days.</span></li>
</ul>
<div class="eg"><span class="t">Every order <b>is checked</b> before shipping. Customers <b>are informed</b> by email. Returns <b>are accepted</b> within 14 days.</span><span class="r">Это типичный абзац из описания бизнес-процесса.</span></div>
<div class="note tip"><span class="nt">Get-passive (разговорный)</span>В неформальной речи вместо be часто используют <b>get</b>: <span class="eng">He <b>got fired</b>. The package <b>got lost</b>. You <b>get paid</b> on Friday.</span> В деловом письме — только be.</div>` },

    { title: 'Past Simple Passive: детально', html:
`<div class="formula">was / were <span class="plus">+</span> V3</div>
<table>
<tr><th></th><th>Ед. ч.</th><th>Мн. ч.</th></tr>
<tr><td><b>+</b></td><td class="en">The company <b>was founded</b> in 1998.</td><td class="en">The offices <b>were opened</b> in 2010.</td></tr>
<tr><td><b>−</b></td><td class="en">The report <b>wasn't sent</b>.</td><td class="en">The goods <b>weren't delivered</b>.</td></tr>
<tr><td><b>?</b></td><td class="en"><b>Was</b> the report <b>sent</b>?</td><td class="en"><b>Were</b> the goods <b>delivered</b>?</td></tr>
</table>
<h4>Где встречается</h4>
<ul>
<li><b>История компаний и продуктов:</b> <span class="eng">Apple <b>was founded</b> in 1976. The first iPhone <b>was released</b> in 2007.</span></li>
<li><b>Новости:</b> <span class="eng">The suspect <b>was arrested</b>. Two people <b>were injured</b>. The factory <b>was closed</b>.</span></li>
<li><b>Отчёты о прошлом:</b> <span class="eng">The contract <b>was signed</b> on 5 May. Payment <b>was received</b> yesterday.</span></li>
</ul>
<h4>by или with?</h4>
<table>
<tr><th>Предлог</th><th>Когда</th><th>Пример</th></tr>
<tr><td class="en"><b>by</b></td><td>кто/что совершил действие (агент)</td><td class="en">The book was written <b>by</b> a student. The order was cancelled <b>by</b> the client.</td></tr>
<tr><td class="en"><b>with</b></td><td>инструмент, материал, чувство</td><td class="en">The room was filled <b>with</b> smoke. The letter was signed <b>with</b> a blue pen.</td></tr>
<tr><td class="en"><b>in</b></td><td>язык, материал</td><td class="en">The report was written <b>in</b> English.</td></tr>
<tr><td class="en"><b>of / from / out of</b></td><td>материал, состав</td><td class="en">The desk is made <b>of</b> wood. Cheese is made <b>from</b> milk.</td></tr>
</table>
<div class="note rule"><span class="nt">Когда by можно (и нужно) опустить</span>Если агент очевиден или не важен — его опускают:<br>
<span class="eng">The letter <b>was sent</b> yesterday.</span> (кем — не важно)<br>
<span class="pos">The Mona Lisa was painted <b>by Leonardo da Vinci</b>.</span> (здесь агент — главная информация, его оставляем)</div>` },

    { title: 'Как превратить актив в пассив: пошагово', html:
`<div class="note rule"><span class="nt">Алгоритм из 4 шагов</span>
1) Найди <b>дополнение</b> (объект) в активе — оно станет подлежащим.<br>
2) Поставь <b>be</b> в то же время, что и активный глагол.<br>
3) Смысловой глагол → <b>V3</b>.<br>
4) Старое подлежащее → <b>by + объектное местоимение</b> (или опусти).</div>
<table>
<tr><th>Active</th><th>Passive</th></tr>
<tr><td class="en">They <b>make</b> cars in Germany.</td><td class="en">Cars <b>are made</b> in Germany.</td></tr>
<tr><td class="en">She <b>sent</b> the email.</td><td class="en">The email <b>was sent</b> (by her).</td></tr>
<tr><td class="en">They <b>have signed</b> the contract.</td><td class="en">The contract <b>has been signed</b>.</td></tr>
<tr><td class="en">We <b>will deliver</b> the goods.</td><td class="en">The goods <b>will be delivered</b>.</td></tr>
<tr><td class="en">You <b>must check</b> the data.</td><td class="en">The data <b>must be checked</b>.</td></tr>
<tr><td class="en">Someone <b>is cleaning</b> the office.</td><td class="en">The office <b>is being cleaned</b>.</td></tr>
</table>
<h4>Глаголы с двумя дополнениями — два варианта пассива</h4>
<div class="eg"><span class="t">Active: They gave <b>me</b> <b>a discount</b>.<br>Passive 1: <b>I</b> was given a discount. (чаще)<br>Passive 2: <b>A discount</b> was given to me.</span><span class="r">То же с tell, show, send, offer, pay, lend: «I was told…», «We were offered…», «She was paid a bonus».</span></div>
<h4>Личные конструкции</h4>
<ul>
<li><span class="eng">He <b>is said to be</b> a good manager.</span> = People say he is…</li>
<li><span class="eng">The company <b>is expected to grow</b>.</span> = People expect the company to grow.</li>
<li><span class="eng">The delivery <b>is believed to have been delayed</b>.</span></li>
</ul>
<div class="note tip"><span class="nt">Глаголы, у которых пассива нет</span>have (в значении «иметь»), like, want, seem, appear, belong, cost, fit, suit, lack, consist of:<br>
<span class="neg">A car is had by me.</span> → <span class="pos">I <b>have</b> a car.</span></div>` }

  title: 'Условные предложения (Conditionals) 2 и 3 типа',

  subtitle: 'Нереальные условия и сожаления о прошлом. 30 фраз для анализа ошибок.',
  theory: [
    { title: 'Second Conditional: нереальное настоящее и будущее', html:
`<div class="formula">If <span class="plus">+</span> Past Simple <span class="plus">,</span> would / wouldn't <span class="plus">+</span> V1</div>
<p>Используем, когда условие <b>нереально, гипотетично или очень маловероятно</b> — но речь о настоящем или будущем.</p>
<div class="eg"><span class="t">If I <b>had</b> more time, I <b>would learn</b> Chinese. (но времени нет)<br>If we <b>lowered</b> the price, we <b>would sell</b> more. (но мы не собираемся)<br>If I <b>were</b> you, I <b>wouldn't sign</b> it.</span><span class="r">Past Simple здесь НЕ про прошлое — это «грамматическая дистанция» от реальности.</span></div>
<h4>Когда использовать</h4>
<ol>
<li><b>Мечты и фантазии:</b> <span class="eng">If I <b>won</b> the lottery, I <b>would buy</b> a house.</span></li>
<li><b>Маловероятные ситуации:</b> <span class="eng">If he <b>asked</b> me, I <b>would help</b>. (сомневаюсь, что попросит)</span></li>
<li><b>Советы:</b> <span class="eng">If I <b>were</b> you, I <b>would</b> talk to the manager.</span></li>
<li><b>Вежливые гипотезы в бизнесе:</b> <span class="eng">It <b>would be</b> great if you <b>could</b> send the file today.</span></li>
</ol>
<div class="note rule"><span class="nt">were вместо was</span>В формальном английском со всеми лицами используется <b>were</b>: <span class="pos">If I <b>were</b> rich…, If she <b>were</b> here…</span><br>
В разговорной речи встречается <b>was</b>: <span class="eng">If I <b>was</b> you…</span> — допустимо, но на экзамене пиши <b>were</b>.</div>
<h4>could / might / would в главной части</h4>
<table>
<tr><th>Модальный</th><th>Оттенок</th><th>Пример</th></tr>
<tr><td class="en"><b>would</b></td><td>уверенный результат</td><td class="en">If we had money, we <b>would</b> expand.</td></tr>
<tr><td class="en"><b>could</b></td><td>возможность/способность</td><td class="en">If I spoke German, I <b>could</b> work in Berlin.</td></tr>
<tr><td class="en"><b>might</b></td><td>вероятность</td><td class="en">If we tried harder, we <b>might</b> succeed.</td></tr>
</table>` },

    { title: 'Third Conditional: нереальное прошлое и сожаления', html:
`<div class="formula">If <span class="plus">+</span> Past Perfect (had + V3) <span class="plus">,</span> would have <span class="plus">+</span> V3</div>
<p>Используем, когда говорим о прошлом, которое <b>уже нельзя изменить</b>: сожаления, критика, анализ ошибок.</p>
<div class="eg"><span class="t">If we <b>had checked</b> the data, we <b>wouldn't have made</b> that mistake.<br>If she <b>had studied</b> harder, she <b>would have passed</b> the exam.<br>If I <b>had known</b> about the meeting, I <b>would have attended</b>.</span><span class="r">Факт: не проверили → сделали ошибку; не учила → не сдала; не знал → не пришёл.</span></div>
<h4>Когда использовать</h4>
<ol>
<li><b>Сожаление:</b> <span class="eng">If I <b>hadn't said</b> that, she <b>wouldn't have been</b> upset.</span></li>
<li><b>Критика / разбор ошибок:</b> <span class="eng">If you <b>had followed</b> the instructions, the system <b>wouldn't have crashed</b>.</span></li>
<li><b>Анализ альтернативных сценариев:</b> <span class="eng">If we <b>had invested</b> in 2019, we <b>would have made</b> a fortune.</span></li>
<li><b>Облегчение:</b> <span class="eng">If the train <b>had been</b> late, we <b>would have missed</b> the flight. (но он не опоздал)</span></li>
</ol>
<h4>Варианты главной части</h4>
<table>
<tr><th>Форма</th><th>Значение</th><th>Пример</th></tr>
<tr><td class="en">would have + V3</td><td>результат</td><td class="en">If you had asked, I <b>would have helped</b>.</td></tr>
<tr><td class="en">could have + V3</td><td>возможность</td><td class="en">We <b>could have won</b> the tender.</td></tr>
<tr><td class="en">might have + V3</td><td>вероятность</td><td class="en">They <b>might have changed</b> their mind.</td></tr>
<tr><td class="en">should have + V3</td><td>упрёк «надо было»</td><td class="en">You <b>should have told</b> me earlier.</td></tr>
</table>
<div class="note warn"><span class="nt">Типичные ошибки</span>
<span class="neg">If I would have known…</span> → <span class="pos">If I <b>had known</b>…</span> (would никогда не стоит в if-части!)<br>
<span class="neg">If we had checked, we wouldn't made…</span> → <span class="pos">…we <b>wouldn't have made</b>…</span><br>
<span class="neg">If I have known…</span> → <span class="pos">If I <b>had known</b>…</span></div>` },

    { title: 'Mixed Conditionals: смешанные типы', html:
`<p>Иногда причина в прошлом, а результат — в настоящем (или наоборот). Тогда части берутся из разных типов.</p>
<table>
<tr><th>Тип смешения</th><th>Формула</th><th>Пример</th></tr>
<tr><td>Прошлое условие → настоящий результат</td><td class="en">If + Past Perfect, would + V1</td><td class="en">If I <b>had studied</b> finance, I <b>would work</b> in a bank now.</td></tr>
<tr><td>Настоящее условие → прошлый результат</td><td class="en">If + Past Simple, would have + V3</td><td class="en">If I <b>were</b> more careful, I <b>wouldn't have made</b> that mistake.</td></tr>
</table>
<div class="eg"><span class="t">If we <b>had signed</b> the contract last year, we <b>would be</b> much richer today.<br>If she <b>spoke</b> English better, she <b>would have got</b> that job.</span><span class="r">Смотри на маркеры времени: now / today → настоящее; last year / yesterday → прошлое.</span></div>
<h4>Сравнительная таблица всех типов</h4>
<table>
<tr><th></th><th>If-clause</th><th>Main clause</th><th>Пример</th></tr>
<tr><td>0</td><td class="en">Present</td><td class="en">Present</td><td class="en">If you heat ice, it melts.</td></tr>
<tr><td>1</td><td class="en">Present</td><td class="en">will + V1</td><td class="en">If it rains, we will stay.</td></tr>
<tr><td>2</td><td class="en">Past</td><td class="en">would + V1</td><td class="en">If it rained now, we would stay.</td></tr>
<tr><td>3</td><td class="en">Past Perfect</td><td class="en">would have + V3</td><td class="en">If it had rained, we would have stayed.</td></tr>
</table>` },

    { title: 'wish / if only: как выразить сожаление', html:
`<table>
<tr><th>Конструкция</th><th>Значение</th><th>Пример</th></tr>
<tr><td class="en"><b>wish / if only</b> + Past Simple</td><td>сожаление о настоящем</td><td class="en">I <b>wish</b> I <b>knew</b> the answer. If only I <b>had</b> more time!</td></tr>
<tr><td class="en"><b>wish / if only</b> + Past Perfect</td><td>сожаление о прошлом</td><td class="en">I <b>wish</b> I <b>had studied</b> harder. If only we <b>hadn't signed</b> it!</td></tr>

<tr><td class="en"><b>wish</b> + could</td><td>сожаление о невозможности</td><td class="en">I <b>wish</b> I <b>could</b> help you.</td></tr>

  id: 27, mod: 'm4', minutes: 60,
  title: 'Сложноподчинённые предложения и слова-связки (Linking Words)',
  short: 'Linking Words',
  subtitle: 'Соединяем простые предложения в сложные: because, although, therefore, however. 30 связок.',
  theory: [
    { title: 'Три типа предложений', html:
`<table>
<tr><th>Тип</th><th>Структура</th><th>Пример</th></tr>
<tr><td><b>Simple</b> (простое)</td><td>одна грамматическая основа</td><td class="en">Sales grew last year.</td></tr>
<tr><td><b>Compound</b> (сложносочинённое)</td><td>две равноправные части + <b>FANBOYS</b></td><td class="en">Sales grew<b>, but</b> costs grew faster.</td></tr>
<tr><td><b>Complex</b> (сложноподчинённое)</td><td>главная + зависимая часть</td><td class="en"><b>Although</b> sales grew, we made a loss.</td></tr>
</table>
<h4>FANBOYS — сочинительные союзы</h4>
<div class="formula"><b>F</b>or · <b>A</b>nd · <b>N</b>or · <b>B</b>ut · <b>O</b>r · <b>Y</b>et · <b>S</b>o</div>
<table>
<tr><th>Союз</th><th>Значение</th><th>Пример</th></tr>
<tr><td class="en"><b>for</b></td><td>ибо (формально, редко)</td><td class="en">He stayed home, <b>for</b> he was ill.</td></tr>
<tr><td class="en"><b>and</b></td><td>и</td><td class="en">We signed the contract <b>and</b> started the project.</td></tr>
<tr><td class="en"><b>nor</b></td><td>ни (с инверсией)</td><td class="en">He didn’t call, <b>nor</b> did he write.</td></tr>
<tr><td class="en"><b>but</b></td><td>но</td><td class="en">The price is high, <b>but</b> the quality is excellent.</td></tr>
<tr><td class="en"><b>or</b></td><td>или</td><td class="en">We can pay now <b>or</b> wait for the invoice.</td></tr>
<tr><td class="en"><b>yet</b></td><td>однако</td><td class="en">It is a simple plan, <b>yet</b> effective.</td></tr>
<tr><td class="en"><b>so</b></td><td>поэтому</td><td class="en">It was late, <b>so</b> we went home.</td></tr>
</table>
<div class="note rule"><span class="nt">Запятая</span>Перед <b>but, so, and, or</b>, соединяющими два <b>полных предложения</b>, ставится запятая:<br>
<span class="eng">The project was difficult<b>,</b> but we finished it.</span><br>
Если союз соединяет однородные члены — запятая не нужна: <span class="eng">We bought pens<b> and</b> paper.</span></div>` },

    { title: 'Причины, следствия и цели', html:
`<h4>Причина (почему?)</h4>
<table>
<tr><th>Средство</th><th>Что после него</th><th>Пример</th></tr>
<tr><td class="en"><b>because</b></td><td>предложение</td><td class="en">We lost the client <b>because</b> we were slow.</td></tr>
<tr><td class="en"><b>since / as</b></td><td>предложение (известная причина, в начале)</td><td class="en"><b>Since</b> demand is growing, we need more staff.</td></tr>
<tr><td class="en"><b>because of / due to / owing to</b></td><td>существительное / -ing</td><td class="en">The delay was <b>due to</b> bad weather.</td></tr>
<tr><td class="en"><b>thanks to</b></td><td>существительное (позитивная причина)</td><td class="en"><b>Thanks to</b> your help, we finished on time.</td></tr>
<tr><td class="en"><b>the reason why</b></td><td>предложение</td><td class="en"><b>The reason why</b> we failed is poor planning.</td></tr>
</table>
<h4>Следствие (что из этого вытекает?)</h4>
<table>
<tr><th>Средство</th><th>Пунктуация</th><th>Пример</th></tr>
<tr><td class="en"><b>so</b></td><td>перед so — запятая</td><td class="en">Costs rose<b>,</b> so we cut the budget.</td></tr>
<tr><td class="en"><b>therefore / consequently / thus / as a result / hence</b></td><td>точка с запятой или новая фраза + запятая</td><td class="en">Costs rose<b>; therefore,</b> we cut the budget.</td></tr>
<tr><td class="en"><b>so … that / such … that</b></td><td>внутри предложения</td><td class="en">The price was <b>so</b> high <b>that</b> nobody bought it.</td></tr>
<tr><td class="en"><b>that is why</b></td><td>после точки</td><td class="en">We have no data. <b>That is why</b> we can’t decide.</td></tr>
</table>
<h4>Цель (зачем?)</h4>
<ul>
<li><span class="eng">We work hard <b>to / in order to / so as to</b> increase profit.</span> (один и тот же субъект)</li>
<li><span class="eng">I called him <b>so that</b> he <b>could</b> help us.</span> (разные субъекты + модальный)</li>
<li><span class="eng"><b>for</b> the purpose of… / <b>with</b> the aim of + -ing</span></li>
</ul>
<div class="note warn"><span class="nt">because vs because of</span><b>because</b> + предложение: <span class="eng">because it <b>rained</b></span><br>
<b>because of</b> + существительное: <span class="eng">because of <b>the rain</b></span><br>
<span class="neg">because of it rained</span> — грубая ошибка.</div>` },

`<table>
<tr><th>Средство</th><th>Что после него</th><th>Пример</th></tr>
<tr><td class="en"><b>although / though / even though</b></td><td><b>предложение</b> (подл. + сказ.)</td><td class="en"><b>Although</b> the price was high, we bought it.</td></tr>
<tr><td class="en"><b>despite / in spite of</b></td><td><b>существительное / -ing / the fact that</b></td><td class="en"><b>Despite</b> the high price, we bought it. <b>Despite</b> working hard, we failed.</td></tr>

<tr><td class="en">may</td><td class="en">might</td><td class="en">«It <b>may</b> rain.» → He said it <b>might</b> rain.</td></tr>
<tr><td class="en">must / have to</td><td class="en">had to</td><td class="en">«I <b>must</b> go.» → She said she <b>had to</b> go.</td></tr>
<tr><td class="en">shall</td><td class="en">would / should</td><td class="en">«I <b>shall</b> return.» → He said he <b>would</b> return.</td></tr>
</table>
<div class="note rule"><span class="nt">Не меняются</span><b>would, could, might, should, ought to, used to</b> остаются как есть:<br>
<span class="eng">«I <b>would</b> help.» → He said he <b>would</b> help.</span></div>
<h4>Когда сдвиг НЕ нужен</h4>
<ol>
<li><b>Вводный глагол в настоящем:</b> <span class="eng">He <b>says</b> he <b>is</b> busy. She <b>tells</b> me she <b>works</b> late.</span></li>
<li><b>Информация всё ещё верна:</b> <span class="eng">He said the Earth <b>goes</b> round the Sun. She said she <b>lives</b> in Berlin.</span></li>
<li><b>Условные 2 и 3 типа:</b> <span class="eng">He said, «If I had money, I would buy it.» → He said that if he <b>had</b> money, he <b>would buy</b> it.</span></li>
</ol>
<div class="note tip"><span class="nt">Что выбирают носители</span>Если факт актуален сейчас, носители часто не сдвигают время: <span class="eng">She said she <b>is</b> coming tomorrow</span> (встреча ещё впереди). Оба варианта считаются корректными.</div>` },

    { title: 'Местоимения и указатели времени/места', html:
`<table>
<tr><th>Прямая речь</th><th>Косвенная речь</th></tr>
<tr><td class="en">I / we</td><td class="en">he / she / they</td></tr>
<tr><td class="en">my / our</td><td class="en">his / her / their</td></tr>
<tr><td class="en">you</td><td class="en">I / he / she / we / they</td></tr>
<tr><td class="en">this / these</td><td class="en">that / those</td></tr>
<tr><td class="en">here</td><td class="en">there</td></tr>
<tr><td class="en">now</td><td class="en">then / at that moment</td></tr>
<tr><td class="en">today</td><td class="en">that day</td></tr>
<tr><td class="en">tonight</td><td class="en">that night</td></tr>
<tr><td class="en">yesterday</td><td class="en">the day before / the previous day</td></tr>
<tr><td class="en">tomorrow</td><td class="en">the next day / the following day</td></tr>
<tr><td class="en">last week / year</td><td class="en">the previous week / the week before</td></tr>
<tr><td class="en">next week / year</td><td class="en">the following week / the next year</td></tr>
<tr><td class="en">ago</td><td class="en">before / earlier</td></tr>
<tr><td class="en">still</td><td class="en">still</td></tr>
</table>
<div class="eg"><span class="t">«I <b>am</b> busy <b>today</b>,» she said. → She said (that) she <b>was</b> busy <b>that day</b>.<br>«I met him <b>here yesterday</b>.» → He said he <b>had met</b> him <b>there the day before</b>.</span></div>
<div class="note warn"><span class="nt">Осторожно</span>Если пересказ происходит в тот же день/в том же месте, указатели можно не менять: <span class="eng">She said she is busy <b>today</b></span> (сегодня ещё не кончилось).</div>` },

    { title: 'Вопросы в косвенной речи', html:
`<h4>1. Общие вопросы (да/нет) → if / whether</h4>
<div class="formula">asked <span class="plus">+ (someone) </span> <span class="plus"> if / whether </span> <span class="plus">+</span> подлежащее <span class="plus">+</span> сказуемое</div>
<div class="eg"><span class="t">«Are you busy?» → He asked <b>if I was</b> busy.<br>«Did you finish?» → She asked <b>whether I had finished</b>.<br>«Can you help me?» → He asked <b>if I could help</b> him.</span><span class="r">Порядок слов становится <b>прямым</b>: никаких do/does/did!</span></div>
<h4>2. Специальные вопросы (wh-) → то же вопросительное слово</h4>
<div class="eg"><span class="t">«Where do you live?» → She asked me <b>where I lived</b>.<br>«Why are you late?» → He asked <b>why I was</b> late.<br>«When will you send it?» → They asked <b>when I would send</b> it.</span></div>
<div class="note warn"><span class="nt">Две грубейшие ошибки</span>
<span class="neg">He asked where do I live.</span> → <span class="pos">He asked <b>where I lived</b>.</span><br>
<span class="neg">She asked did I finish.</span> → <span class="pos">She asked <b>if I had finished</b>.</span><br>
В косвенном вопросе нет вспомогательных do/does/did и нет обратного порядка слов.</div>
<h4>Глаголы для введения вопросов</h4>
<p><span class="eng">ask, wonder, want to know, enquire, would like to know</span></p>
<div class="eg"><span class="t">He <b>wondered</b> whether we could help. I <b>wanted to know</b> when the meeting would start.</span></div>
<h4>What about…? / Let’s… / Why don’t you…?</h4>
<table>
<tr><th>Прямая</th><th>Косвенная</th></tr>
<tr><td class="en">«What about a meeting?»</td><td class="en">He <b>suggested having</b> a meeting.</td></tr>
<tr><td class="en">«Let’s start.»</td><td class="en">She <b>suggested starting</b>. / She said, «Let’s start.» → She <b>suggested that we (should) start</b>.</td></tr>
<tr><td class="en">«Why don’t you call him?»</td><td class="en">He <b>advised me to call</b> him.</td></tr>
</table>` },

    { title: 'Приказы, просьбы, советы: to + инфинитив', html:
`<div class="formula">Глагол <span class="plus">+</span> (кому) <span class="plus">+</span> (not) to <span class="plus">+</span> V1</div>
<table>
<tr><th>Прямая речь</th><th>Косвенная речь</th></tr>
<tr><td class="en">«Close the door.»</td><td class="en">He <b>told me to close</b> the door.</td></tr>
<tr><td class="en">«Don’t touch it!»</td><td class="en">She <b>warned me not to touch</b> it.</td></tr>
<tr><td class="en">«Could you help me?»</td><td class="en">He <b>asked me to help</b> him.</td></tr>
<tr><td class="en">«You should see a doctor.»</td><td class="en">She <b>advised me to see</b> a doctor.</td></tr>
<tr><td class="en">«I’ll help you.»</td><td class="en">He <b>offered to help</b> me.</td></tr>
<tr><td class="en">«I’m sorry I’m late.»</td><td class="en">She <b>apologised for being</b> late.</td></tr>
<tr><td class="en">«You stole the money!»</td><td class="en">He <b>accused me of stealing</b> the money.</td></tr>
<tr><td class="en">«I didn’t do it.»</td><td class="en">She <b>denied doing / having done</b> it.</td></tr>
</table>
<h4>Паттерны глаголов речи — выучить!</h4>
<table>
<tr><th>Паттерн</th><th>Глаголы</th><th>Пример</th></tr>
<tr><td class="en">+ to inf</td><td>promise, offer, refuse, agree, decide, threaten, claim, demand</td><td class="en">He <b>promised to send</b> it. She <b>refused to sign</b>.</td></tr>
<tr><td class="en">+ V-ing</td><td>suggest, recommend, admit, deny, mention</td><td class="en">He <b>suggested meeting</b> on Friday. She <b>admitted making</b> a mistake.</td></tr>
<tr><td class="en">+ предлог + V-ing</td><td>apologise <b>for</b>, accuse <b>of</b>, insist <b>on</b>, thank <b>for</b>, blame <b>for</b>, suspect <b>of</b></td><td class="en">He <b>apologised for being</b> late. She <b>insisted on paying</b>.</td></tr>
<tr><td class="en">+ кому + to inf</td><td>tell, ask, advise, warn, invite, remind, order, persuade, encourage</td><td class="en">She <b>reminded me to call</b> him.</td></tr>
<tr><td class="en">+ that (+ should)</td><td>suggest, recommend, insist, demand, propose, request</td><td class="en">He <b>suggested that we (should) start</b>.</td></tr>
</table>
<div class="note warn"><span class="nt">suggest / recommend — ловушка</span><span class="neg">He suggested me to go.</span> — <b>нельзя!</b><br>
<span class="pos">He <b>suggested going</b>.</span> / <span class="pos">He <b>suggested that I (should) go</b>.</span> / <span class="pos">He <b>suggested going to</b> me.</span> (неудачно) → лучше: <span class="pos">He <b>suggested that we go</b>.</span><br>
То же с <b>recommend, propose, insist</b>.</div>` },

    { title: '30 глаголов говорения для делового пересказа', html:
`<table>
<tr><th>Оттенок</th><th>Глаголы</th></tr>

<h4>Пример пересказа встречи</h4>
<div class="eg"><span class="t">During the meeting, the CEO <b>announced</b> that the company <b>would open</b> two new offices. She <b>explained</b> that the decision <b>had been made</b> after a long analysis and <b>pointed out</b> that costs <b>would rise</b> by 10%. The finance director <b>added</b> that they <b>had already found</b> investors. When a colleague <b>asked</b> whether salaries <b>would increase</b>, she <b>admitted</b> that it <b>was</b> possible but <b>refused to give</b> exact figures. Finally, she <b>suggested holding</b> another meeting in a month and <b>promised to send</b> a summary by email.</span></div>
<div class="note tip"><span class="nt">Как тренировать</span>После каждой реальной встречи/звонка мысленно перескажи 5 ключевых моментов по-английски, используя разные глаголы речи. Это самый быстрый способ автоматизировать backshift.</div>` }

  short: 'Фразовые глаголы 1',

  theory: [
    { title: 'Что такое фразовый глагол и как он устроен', html:
`<div class="formula">Глагол <span class="plus">+</span> частица (наречие / предлог) <span class="plus">=</span> новое значение</div>
<div class="eg"><span class="t">set + up = <b>set up</b> (основать) • look + into = <b>look into</b> (изучить) • turn + down = <b>turn down</b> (отклонить)</span><span class="r">Значение целого часто нельзя угадать из частей — его надо учить.</span></div>
<h4>Два типа фразовых глаголов</h4>
<table>
<tr><th>Тип</th><th>Правило</th><th>Пример</th></tr>
<tr><td><b>Разделяемые</b> (separable)</td><td>Существительное можно поставить <b>до или после</b> частицы</td><td class="en">set up <b>the company</b> = set <b>the company</b> up</td></tr>
<tr><td><b>Неразделяемые</b> (inseparable)</td><td>Существительное только <b>после</b> частицы</td><td class="en">look into <b>the problem</b> (<span class="neg">look the problem into</span>)</td></tr>
</table>
<div class="note rule"><span class="nt">Правило местоимения — обязательно к запоминанию</span>Если дополнение — <b>местоимение</b> (it, them, him, her, us, me), в разделяемых фразовых глаголах оно ставится <b>только между</b> глаголом и частицей:<br>
<span class="pos">set <b>it</b> up • turn <b>it</b> down • fill <b>them</b> in • put <b>it</b> off</span><br>
<span class="neg">set up it • turn down it • fill in them</span></div>
<h4>Формальный или неформальный?</h4>
<table>
<tr><th>Фразовый (нейтрально-разговорный)</th><th>Формальный эквивалент</th></tr>
<tr><td class="en">set up</td><td class="en">establish, found</td></tr>
<tr><td class="en">carry out</td><td class="en">conduct, perform</td></tr>
<tr><td class="en">look into</td><td class="en">investigate, examine</td></tr>
<tr><td class="en">find out</td><td class="en">discover, ascertain</td></tr>
<tr><td class="en">put off</td><td class="en">postpone</td></tr>
<tr><td class="en">call off</td><td class="en">cancel</td></tr>
<tr><td class="en">turn down</td><td class="en">reject, decline</td></tr>
<tr><td class="en">fill in / out</td><td class="en">complete</td></tr>
<tr><td class="en">draw up</td><td class="en">prepare, draft</td></tr>
<tr><td class="en">go over</td><td class="en">review</td></tr>
</table>
<div class="note tip"><span class="nt">Где что уместно</span>В <b>устной</b> речи и внутренней переписке фразовые глаголы звучат естественно и живо. В <b>контрактах, официальных отчётах и письмах незнакомым людям</b> лучше формальные эквиваленты.<br>
<span class="eng">Email коллеге: «Let’s <b>go over</b> the report.» • Отчёт для совета директоров: «The board <b>reviewed</b> the report.»</span></div>` },

    { title: 'Топ-15 фразовых глаголов (часть 1)', html:
`<table>
<tr><th>Фразовый глагол</th><th>Значение</th><th>Пример</th></tr>
<tr><td class="en"><b>set up</b></td><td>основать, создать, настроить</td><td class="en">They <b>set up</b> a company in 2015. Please <b>set up</b> the projector.</td></tr>
<tr><td class="en"><b>carry out</b></td><td>проводить, выполнять</td><td class="en">We <b>carried out</b> a survey. She <b>carried out</b> the instructions.</td></tr>
<tr><td class="en"><b>look into</b></td><td>изучить, разобраться</td><td class="en">I’ll <b>look into</b> the problem and call you back.</td></tr>
<tr><td class="en"><b>find out</b></td><td>выяснить, узнать</td><td class="en">We need to <b>find out</b> what went wrong.</td></tr>
<tr><td class="en"><b>put off</b></td><td>отложить</td><td class="en">They <b>put off</b> the meeting until Monday.</td></tr>
<tr><td class="en"><b>call off</b></td><td>отменить</td><td class="en">The negotiations were <b>called off</b>.</td></tr>
<tr><td class="en"><b>turn down</b></td><td>отклонить, отказать</td><td class="en">He <b>turned down</b> our offer.</td></tr>
<tr><td class="en"><b>fill in / fill out</b></td><td>заполнить (форму)</td><td class="en">Please <b>fill in</b> the application form.</td></tr>
<tr><td class="en"><b>draw up</b></td><td>составить (документ)</td><td class="en">The lawyer <b>drew up</b> the contract.</td></tr>
<tr><td class="en"><b>go over</b></td><td>просмотреть, проверить</td><td class="en">Let’s <b>go over</b> the figures one more time.</td></tr>
<tr><td class="en"><b>take over</b></td><td>принять управление, поглотить</td><td class="en">A bigger company <b>took over</b> our supplier.</td></tr>
<tr><td class="en"><b>run into</b></td><td>столкнуться (с проблемой); встретить случайно</td><td class="en">We <b>ran into</b> some problems with delivery.</td></tr>
<tr><td class="en"><b>come up with</b></td><td>придумать, предложить</td><td class="en">She <b>came up with</b> a brilliant idea.</td></tr>
<tr><td class="en"><b>cut back on</b></td><td>сократить (расходы)</td><td class="en">We must <b>cut back on</b> travel expenses.</td></tr>
<tr><td class="en"><b>keep up with</b></td><td>успевать за, не отставать</td><td class="en">It’s hard to <b>keep up with</b> the market changes.</td></tr>
</table>
<div class="note warn"><span class="nt">Не разделяй эти</span><b>look into, run into, come up with, keep up with, get over</b> — неразделяемые. Только: <span class="pos">look into <b>it</b></span>, <span class="neg">look it into</span>.</div>` },

    { title: 'Разделяемые и неразделяемые: тренировка', html:
`<table>
<tr><th>Разделяемые (можно it/them в середину)</th><th>Неразделяемые</th></tr>
<tr><td class="en">set up (a company / it)<br>turn down (an offer / it)<br>put off (the meeting / it)<br>call off (the deal / it)<br>fill in (the form / it)<br>draw up (a contract / it)<br>take over (a firm / it)<br>hand in (a report / it)<br>bring up (a question / it)<br>work out (a plan / it)<br>find out (the truth / it)*<br>carry out — <b>неразделяемый</b>!</td><td class="en">look into (the problem)<br>run into (difficulties)<br>come up with (an idea)<br>keep up with (the changes)<br>get on with (the work)<br>deal with (a complaint)<br>go over (the report)<br>cut back on (expenses)</td></tr>
</table>
<p class="small muted">* <b>find out</b> обычно неразделяемый, когда за ним идёт придаточное: <span class="eng">find out <b>what happened</b></span>. С существительным возможно и так, и так, но чаще <span class="eng">find out the truth</span>.</p>
<div class="note rule"><span class="nt">Проверка местоимением</span>Подставь <b>it</b>:<br>
<span class="pos">Set <b>it</b> up. Turn <b>it</b> down. Put <b>it</b> off.</span> — разделяемые.<br>
<span class="pos">Look into <b>it</b>. Deal with <b>it</b>. Keep up with <b>it</b>.</span> — неразделяемые.</div>
<h4>Три значения одной частицы</h4>
<table>
<tr><th>Частица</th><th>Общий смысл</th><th>Примеры</th></tr>
<tr><td class="en"><b>up</b></td><td>завершённость, до конца</td><td class="en">finish up, use up, draw up, fill up, sum up</td></tr>
<tr><td class="en"><b>off</b></td><td>прекращение, отделение</td><td class="en">call off, put off, write off, cut off, lay off</td></tr>
<tr><td class="en"><b>out</b></td><td>результат, обнаружение</td><td class="en">find out, work out, carry out, figure out, sort out</td></tr>
<tr><td class="en"><b>over</b></td><td>повтор, обзор</td><td class="en">go over, take over, think over, get over</td></tr>
<tr><td class="en"><b>back</b></td><td>возврат</td><td class="en">call back, pay back, cut back, fall back on</td></tr>
<tr><td class="en"><b>through</b></td><td>до конца, сквозь</td><td class="en">go through, get through, carry through</td></tr>
</table>
<div class="note tip"><span class="nt">Как учить эффективно</span>1) Учи <b>не список, а контекст</b>: сразу с существительным (<span class="eng">set up a company, carry out a survey, meet a deadline</span>).<br>
2) Группируй по <b>темам</b> (документы, встречи, деньги).<br>
3) Группируй по <b>частице</b> — это помогает догадываться о значении новых.<br>
4) Составляй <b>3 своих предложения</b> на каждый глагол.<br>
5) Повторяй в карточках приложения — интервалы сделают своё дело.</div>` },

    { title: 'Фразовые глаголы в реальных ситуациях', html:
`<h4>Начало бизнеса</h4>
<div class="eg"><span class="t">She <b>set up</b> her own consultancy in 2019. They had to <b>draw up</b> a business plan and <b>find out</b> what customers really wanted. Two years later a large corporation <b>took over</b> the company.</span></div>

<div class="eg"><span class="t">Let’s <b>go over</b> the agenda before we start. Please don’t <b>bring up</b> the budget issue yet — we’ll discuss it later. If nobody objects, we can <b>call off</b> the second meeting and <b>put off</b> the decision until Friday.</span></div>
<h4>Финансы</h4>
<div class="eg"><span class="t">We need to <b>cut back on</b> office expenses and <b>pay back</b> the loan by December. The auditors will <b>go over</b> all the invoices and <b>check up on</b> our accounts.</span></div>

<b>Key message.</b> The European division can return to a 15% operating margin within 12 months by consolidating warehousing and renegotiating three supplier contracts.<br><br>
<b>Key findings.</b><br>
• Revenue grew 9% year-on-year, but operating margin fell from 16% to 11%.<br>
• Logistics costs account for 42% of the increase, driven by four under-used warehouses.<br>
• Two suppliers charge 18–22% above market benchmarks.<br>
• Customer retention remains strong at 91%, so demand is not the issue.<br><br>
<b>Recommendations.</b> (1) Close two warehouses and centralise distribution in Berlin; (2) re-tender the two overpriced contracts; (3) introduce monthly margin reporting.<br><br>
<b>Impact.</b> Estimated annual savings of $2.4m, payback within nine months. We propose a steering committee in week 1 and full implementation by Q4.</span></div>

<tr><td class="en"><b>Q</b>uestion</td><td>Вопрос, который возникает</td><td class="en">How can we restore profitability without sacrificing growth?</td></tr>
<tr><td class="en"><b>A</b>nswer</td><td>Наш ответ</td><td class="en">By consolidating warehousing and re-tendering two supplier contracts.</td></tr>
</table>
<h4>MECE: аргументы не пересекаются и покрывают всё</h4>
<p><b>Mutually Exclusive, Collectively Exhaustive</b> — группы аргументов не дублируют друг друга и вместе исчерпывают тему. Проверка: «Есть ли пересечения? Что-то упущено?»</p>
<div class="note tip"><span class="nt">Правило трёх</span>Три аргумента запоминаются лучше пяти. Если получается семь — сгруппируй их в три блока.</div>
<h4>Логика связок внутри пирамиды</h4>
<ul>
<li><b>вертикальная</b>: каждый уровень отвечает на вопрос, который возникает у читателя после предыдущего;</li>
<li><b>горизонтальная</b>: аргументы одного уровня связаны либо <b>индуктивно</b> (три факта → один вывод), либо <b>дедуктивно</b> (большая посылка → малая → вывод).</li>
</ul>` },

`<h4>Findings — что мы обнаружили</h4>

</table>
<div class="note rule"><span class="nt">Формула хорошей рекомендации</span><b>Глагол действия</b> + <b>что именно</b> + <b>кто</b> + <b>когда</b> + <b>ожидаемый эффект</b>.<br>
<span class="eng"><b>Close</b> the Warsaw and Prague warehouses <b>(action)</b> by Q3 2026 <b>(when)</b>, with the Operations Director accountable <b>(who)</b>, saving an estimated $1.4m a year <b>(impact)</b>.</span></div>
<h4>Грамматика рекомендаций</h4>
<ul>
<li><b>recommend / suggest + V-ing:</b> <span class="eng">We recommend <b>closing</b> two warehouses.</span></li>

<li><b>It is essential that + bare infinitive (subjunctive):</b> <span class="eng">It is essential that the data <b>be</b> verified.</span></li>
</ul>` },

<li><b>Короткие предложения.</b> 15–20 слов максимум. Одно предложение — одна мысль.</li>

<tr><td class="en"><b>4. Bargaining</b></td><td>торг, обмен уступками</td><td class="en"><b>If you</b> increase the order, <b>we could</b> offer 8%. <b>We could meet you halfway.</b> What would you say to…?</td></tr>
<tr><td class="en"><b>5. Handling objections</b></td><td>снять возражения</td><td class="en"><b>I see your point, but…</b> That's a fair concern; <b>however</b>, … Let me put it another way…</td></tr>
<tr><td class="en"><b>6. Closing</b></td><td>зафиксировать договорённости</td><td class="en"><b>Let me summarise what we've agreed.</b> <b>Shall we call it a deal?</b> I'll send the minutes by email.</td></tr>
</table>
<div class="note rule"><span class="nt">Позиция против интереса</span><b>Позиция</b> — «нам нужна скидка 20%». <b>Интерес</b> — «нам нужно уложиться в бюджет квартала». Профессионал работает с интересами: выясняет их вопросами и предлагает варианты, которые их закрывают.</div>
<h4>Вопросы, которые раскрывают интересы</h4>
<ul>
<li><span class="eng">What matters most to you in this deal?</span></li>
<li><span class="eng">What would make this work for you?</span></li>
<li><span class="eng">Help me understand why that is important.</span></li>
<li><span class="eng">What are your constraints?</span></li>
<li><span class="eng">If we could solve X, would you be ready to move forward?</span></li>
</ul>` },

    { title: 'Торг и уступки: грамматика обмена', html:
`<p>Основа торга — <b>условные предложения</b>: никогда не давай уступку «просто так», всегда привязывай её к ответному шагу.</p>
<div class="formula">If you <span class="plus">+</span> Present Simple <span class="plus">,</span> we <span class="plus"> would/could </span> <span class="plus">+</span> V1</div>
<div class="eg"><span class="t"><b>If you</b> increased the order to 500 units, <b>we could</b> offer an 8% discount.<br><b>We would be prepared to</b> extend the warranty <b>provided that</b> you signed a two-year contract.<br><b>In return for</b> a larger volume, <b>we could</b> offer free delivery.</span></div>
<h4>Формулы уступок</h4>
<table>
<tr><th>Функция</th><th>Фразы</th></tr>
<tr><td>предложить обмен</td><td class="en">We could … <b>if you would</b> … / <b>In exchange for</b> …, we could … / <b>On condition that</b> …</td></tr>
<tr><td>сойтись посередине</td><td class="en"><b>Let's meet halfway.</b> / <b>Let's split the difference.</b> / Could we <b>meet in the middle</b>?</td></tr>
<tr><td>согласиться</td><td class="en"><b>We can accept that.</b> / That works for us. / <b>We're happy to go along with that.</b></td></tr>
<tr><td>отклонить мягко</td><td class="en"><b>I'm afraid that's not possible.</b> / That's <b>beyond our limit</b>. / We <b>couldn't go below</b> that.</td></tr>
<tr><td>выиграть время</td><td class="en"><b>Let me come back to you on that.</b> / I'd need to <b>check with</b> my board. / Can I <b>take that away</b> and think it over?</td></tr>
<tr><td>усилить давление</td><td class="en">This offer <b>is on the table</b> until Friday. / We have <b>other interested parties</b>. / That's <b>our best and final offer</b>.</td></tr>
</table>
<div class="note warn"><span class="nt">Язык торга — всегда вежливый</span>Даже жёсткие вещи говорят мягко: <span class="neg">That's impossible. You're wrong.</span> → <span class="pos"><b>I'm afraid</b> that wouldn't work for us. <b>I see your point, but</b> our costs don't allow it.</span></div>
<h4>Цифры в торге</h4>
<ul>
<li><span class="eng">Could you <b>come down to</b> $45 per unit?</span> — снизить до</li>
<li><span class="eng">We could <b>go as low as</b> $47, but not below.</span></li>
<li><span class="eng">That's <b>a 12% increase on</b> last year's price.</span></li>
<li><span class="eng">We'd need to see <b>a volume commitment of</b> 1,000 units.</span></li>
</ul>` },

    { title: 'Возражения, тупик и выход из него', html:
`<h4>Схема работы с возражением: acknowledge → clarify → respond → confirm</h4>
<div class="eg"><span class="t">Client: «Your price is too high.»<br>You: «<b>I understand</b> that budget is a concern (acknowledge). <b>Could I ask</b> which part feels high — the licence or the support (clarify)? Actually, our price <b>includes</b> two years of support, which our competitors charge separately (respond). <b>Does that change the picture</b> (confirm)?»</span></div>
<h4>Полезные фразы</h4>
<table>
<tr><th>Функция</th><th>Фразы</th></tr>
<tr><td>признать возражение</td><td class="en">That's a fair point. / I understand your concern. / You're right to raise that.</td></tr>
<tr><td>переформулировать</td><td class="en"><b>Let me put it another way.</b> / What I mean is… / In other words…</td></tr>
<tr><td>частично согласиться</td><td class="en"><b>I agree up to a point, but…</b> / That's true to some extent, however…</td></tr>
<tr><td>не согласиться вежливо</td><td class="en"><b>I'm not sure I can go along with that.</b> / With respect, the data suggests otherwise.</td></tr>
<tr><td>тупик</td><td class="en"><b>We seem to have reached a deadlock / an impasse.</b> / We're going round in circles.</td></tr>
<tr><td>выход из тупика</td><td class="en"><b>Let's put that aside for now</b> and come back to it. / <b>Shall we take a break</b>? / Could we <b>park</b> this issue? / Let's <b>focus on what we do agree on</b>.</td></tr>
</table>
<div class="note tip"><span class="nt">Приём «park it»</span>Если вопрос блокирует переговоры, его «паркут»: <span class="eng">Let's <b>park</b> the penalty clause and agree the delivery schedule first.</span> Это сохраняет динамику и не выглядит как уступка.</div>
<h4>Если другая сторона давит</h4>
<ul>
<li><span class="eng"><b>I'm not comfortable with</b> that deadline.</span></li>
<li><span class="eng"><b>That would be difficult for us to accept.</b></span></li>
<li><span class="eng"><b>Could we revisit</b> that point later?</span></li>
<li><span class="eng"><b>I'd rather not</b> commit to that today.</span></li>
</ul>` },

    { title: 'Техники убеждения', html:
`<h4>1. Три основы влияния (Аристотель → современный питч)</h4>
<table>
<tr><th>Основа</th><th>Что это</th><th>Как звучит</th></tr>
<tr><td class="en"><b>Logos</b> (логика)</td><td>цифры, факты, расчёты</td><td class="en">The payback period is nine months, so the project is self-financing.</td></tr>
<tr><td class="en"><b>Ethos</b> (доверие)</td><td>опыт, репутация, кейсы</td><td class="en">We have delivered 40 similar projects for clients such as X and Y.</td></tr>
<tr><td class="en"><b>Pathos</b> (эмоция)</td><td>картина будущего, риск потери</td><td class="en">Imagine what your team could do with 300 hours a year back.</td></tr>
</table>
<h4>2. Framing (рамка подачи)</h4>
<ul>
<li><b>Выигрыш вместо потери:</b> <span class="eng">You <b>save</b> $40k a year</span> лучше, чем <span class="neg">You stop losing $40k</span>.</li>
<li><b>Цена в контексте:</b> <span class="eng">It costs less than <b>one</b> new hire.</span> / <span class="eng">That's <b>just</b> $3 per employee per day.</span></li>
<li><b>Ежемесячно, а не ежегодно:</b> <span class="eng">$250 a month</span> звучит мягче, чем <span class="eng">$3,000 a year</span>.</li>
</ul>
<h4>3. Anchoring (якорь)</h4>
<p>Первая названная цифра становится «якорем», вокруг которого идёт торг. Кто заякорил — тот задал рамку. Ответ на чужой якорь: <span class="eng">«That's considerably higher than we anticipated. <b>Our budget for this is</b> $40k.»</span></p>
<h4>4. Social proof и авторитет</h4>
<ul>
<li><span class="eng">Nine out of ten clients in your sector chose this option.</span></li>
<li><span class="eng">Our solution is used by three of the top five banks in Europe.</span></li>
<li><span class="eng">The auditors confirmed that the figures are in line with IFRS.</span></li>
</ul>
<h4>5. Правило трёх и структура аргумента</h4>
<p>Три аргумента — оптимум. Каждый аргумент по схеме <b>Claim → Evidence → So what?</b>: утверждение → доказательство → почему это важно слушателю.</p>
<div class="eg"><span class="t"><b>Claim:</b> Automation will cut processing time.<br><b>Evidence:</b> In our pilot, processing fell from 45 to 12 minutes per invoice.<br><b>So what:</b> That frees up 300 hours a year — the equivalent of two full-time employees.</span></div>
<h4>6. Тактические приёмы в речи</h4>
<ul>
<li><b>Пауза после ключевого предложения</b> — даёт собеседнику заполнить тишину (и часто согласиться).</li>
<li><b>Mirroring</b> — повтор последних слов собеседника: «— It's too expensive. — <b>Too expensive?</b>»</li>
<li><b>Labelling</b> — называние эмоции: «<b>It sounds like</b> timing is the main issue for you.»</li>
<li><b>Вопросы «How» и «What»</b> вместо «Why»: <span class="eng"><b>How</b> am I supposed to do that?</span> (мягкое давление)</li>
<li><b>Illusion of choice:</b> <span class="eng">Would you prefer to start in March or April?</span> (оба варианта — ваши)</li>
</ul>
<div class="note warn"><span class="nt">Чего избегать</span>Агрессия, ультиматумы без выхода, блеф о цифрах, «take it or leave it» в начале, обесценивание собеседника (<span class="neg">That's a silly idea</span>). Доверие восстанавливается годами.</div>` },

    { title: 'Закрытие переговоров и фиксация договорённостей', html:
`<h4>Сигналы готовности закрыть сделку</h4>
<p><span class="eng">So, if we can agree on the delivery date, are you ready to move forward? / What would need to happen for you to say yes today? / Is there anything else holding you back?</span></p>
<h4>Формулы закрытия</h4>
<ul>
<li><b>Summary close:</b> <span class="eng">Let me summarise: 500 units at $45, delivery in April, payment in 30 days. <b>Shall we go ahead?</b></span></li>
<li><b>Alternative close:</b> <span class="eng">Would you prefer the standard package or the premium one?</span></li>
<li><b>Assumptive close:</b> <span class="eng"><b>I'll get the paperwork started</b>, and we can sign on Thursday.</span></li>
<li><b>Direct close:</b> <span class="eng"><b>Can we agree on that?</b> / <b>Do we have a deal?</b></span></li>
</ul>
<h4>Фиксация договорённостей (письменно)</h4>
<div class="eg"><span class="t"><b>As agreed</b>, we will supply 500 units at $45 each, with delivery to your Berlin warehouse by 15 April. Payment terms are 30 days from the invoice date. <b>Please confirm by reply</b>, and we will issue the contract this week.<br><br><b>To recap:</b><br>• Volume: 500 units<br>• Price: $45 per unit, net 30<br>• Delivery: Berlin, by 15 April<br>• Warranty: 24 months<br>• Next step: contract for signature by Friday</span></div>
<div class="note rule"><span class="nt">Минуты (minutes) после встречи</span>Отправь письмо в течение 24 часов со структурой: <b>что решили → кто делает → к какому сроку → следующий шаг</b>. Формула: <span class="eng">Thank you for your time today. <b>To summarise our discussion</b>, we agreed the following… <b>Please let me know if</b> I have missed anything.</span></div>` }

let saveT = null;

/* дневная активность / серия */
function bumpToday(n){
  const t = dstr(Date.now());
  if (!S.stats.today || S.stats.today.date !== t) S.stats.today = { date:t, n:0 };
  S.stats.today.n += (n||1);
}
function todayAnswers(){
  return (S.stats.today && S.stats.today.date === dstr(Date.now())) ? S.stats.today.n : 0;
}
function touch(){
  const t = dstr(Date.now());
  S.streak.days = S.streak.days || {};
  S.streak.days[t] = 1;
  const last = S.streak.last;
  if (last !== t) {
    const y = dstr(Date.now() - 864e5);
    S.streak.cur = (last === y) ? (S.streak.cur||0) + 1 : 1;
    S.streak.last = t;
    S.streak.best = Math.max(S.streak.best||0, S.streak.cur);
  }
}

const MODULES = window.MODULES || [];
const LESSONS = [];
MODULES.forEach((m, mi) => { m.index = mi + 1; m.lessons.forEach(l => { l.moduleId = m.id; l.moduleTitle = m.title; l.moduleIndex = mi+1; LESSONS.push(l); }); });
const LBY = {}; LESSONS.forEach(l => LBY[l.id] = l);
const lessonById = id => LBY[id] || null;
const TOTAL_LESSONS = LESSONS.length;

function lessonState(id){ return S.lessons[id] || (S.lessons[id] = { ex:{}, test:null, ts:null, opened:null }); }
function exCount(l){ return (l.exercises||[]).length; }
function exPassed(l){ const st = S.lessons[l.id]; if(!st) return 0; return Object.values(st.ex||{}).filter(e => e && e.passed).length; }
function lessonProgress(l){
  const total = exCount(l); if (!total) return 0;
  return pct(exPassed(l), total);
}
function lessonDone(l){ return lessonProgress(l) === 100; }
function lessonStatus(l){
  const st = S.lessons[l.id];
  if (!st) return 'new';
  if (lessonDone(l)) return 'done';
  if (exPassed(l) > 0 || Object.keys(st.ex||{}).length) return 'started';
  return 'new';
}
function moduleProgress(m){
  const t = m.lessons.length; if(!t) return 0;
  const sum = m.lessons.reduce((a,l) => a + lessonProgress(l), 0);
  return Math.round(sum / t);
}
function courseProgress(){
  if (!TOTAL_LESSONS) return 0;
  const sum = LESSONS.reduce((a,l) => a + lessonProgress(l), 0);
  return Math.round(sum / TOTAL_LESSONS);
}
function nextLesson(){
  for (const l of LESSONS) if (!lessonDone(l)) return l;
  return LESSONS[LESSONS.length-1];
}
const VOCAB_TOTAL = LESSONS.reduce((a,l) => a + (l.vocab||[]).length, 0);
function vocabKey(lid, w){ return lid + '::' + w.toLowerCase(); }
function vocabState(lid, w){ const k = vocabKey(lid,w); return S.vocab[k] || (S.vocab[k] = { box:0, due:0, ok:0, no:0, ts:null }); }
function vocabLearned(){ return Object.values(S.vocab).filter(v => v.box >= 3).length; }
function vocabMastered(){ return Object.values(S.vocab).filter(v => v.box >= 5).length; }
function vocabDue(){
  const now = Date.now(); let n = 0;
  LESSONS.forEach(l => (l.vocab||[]).forEach(w => {
    const st = S.vocab[vocabKey(l.id, w[0])];
    if (st && st.box > 0 && st.due <= now) n++;
  }));
  return n;
}
function newWordsCount(){
  let n = 0;
  LESSONS.forEach(l => (l.vocab||[]).forEach(w => { const st = S.vocab[vocabKey(l.id,w[0])]; if (!st || !st.box) n++; }));
  return n;
}

const Speech = (() => {
  let voices = [];
  function load(){ try { voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : []; } catch(e){ voices = []; } }
  if (window.speechSynthesis) { load(); window.speechSynthesis.onvoiceschanged = load; }
  return {
    get supported(){ return !!(window.speechSynthesis && window.SpeechSynthesisUtterance); },
    say(text, opts){
      if (!this.supported || !S.speech) return false;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = (opts && opts.lang) || S.accent || 'en-US';
        u.rate = (opts && opts.rate) || 0.92;
        const want = u.lang;
        const v = voices.find(v => v.lang === want) || voices.find(v => v.lang && v.lang.slice(0,2) === want.slice(0,2));
        if (v) u.voice = v;
        window.speechSynthesis.speak(u);
        return true;
      } catch(e){ return false; }
    },
    stop(){ try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){} }
  };
})();
function speakBtn(text, extra){
  return '<button class="speak" type="button" data-say="'+esc(text)+'" title="Прослушать" aria-label="Прослушать">'+ic('speaker')+'</button>';
}
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('[data-say]');
  if (!b) return;
  e.preventDefault();
  if (!Speech.supported) return toast('Озвучка недоступна в этом браузере', 'no');
  if (!S.speech) return toast('Озвучка выключена в настройках', 'no');
  $$('.speak.speaking').forEach(x => x.classList.remove('speaking'));
  b.classList.add('speaking');
  const rate = b.dataset.rate ? parseFloat(b.dataset.rate) : 0.92;
  Speech.say(b.dataset.say, { rate });
  setTimeout(() => b.classList.remove('speaking'), 1600);
});

/* 4. Интервальное повторение ( Leitner, 6 коробок )                   */
/* ------------------------------------------------------------------ */
const BOX_DAYS = [0, 0, 1, 3, 7, 16, 35];
function srRate(lid, word, grade){ // grade: 'again' | 'hard' | 'good' | 'easy'
  const st = vocabState(lid, word);
  const now = Date.now();
  let box = st.box || 0;
  if (grade === 'again') { box = 1; st.due = now + 60e3; st.no = (st.no||0)+1; }
  else if (grade === 'hard') { box = Math.max(1, box); st.due = now + (BOX_DAYS[box]||1)*864e5*0.4; st.ok=(st.ok||0)+1; }
  else if (grade === 'good') { box = Math.min(6, box + 1); st.due = now + (BOX_DAYS[box]||1)*864e5; st.ok=(st.ok||0)+1; }
  else { box = Math.min(6, box + 2); st.due = now + (BOX_DAYS[box]||1)*864e5; st.ok=(st.ok||0)+1; }
  st.box = box; st.ts = now;
  save();
  return box;
}
function srBoxOf(lid, word){ const st = S.vocab[vocabKey(lid,word)]; return st ? (st.box||0) : 0; }
function dueCards(limitLessonId){
  const now = Date.now(), out = [];
  LESSONS.forEach(l => {
    if (limitLessonId && l.id !== limitLessonId) return;
    (l.vocab||[]).forEach(w => {
      const st = S.vocab[vocabKey(l.id, w[0])];
      if (!st) return;
      if (st.box === 0) out.push({ l, w, st, prio: 2 });
      else if (st.due <= now) out.push({ l, w, st, prio: st.box <= 2 ? 1 : 0 });
    });
  });
  out.sort((a,b) => (a.prio - b.prio) || (a.st.due - b.st.due));
  return out;
}
function newCards(limitLessonId, max){
  const out = [];
  LESSONS.forEach(l => {
    if (limitLessonId && l.id !== limitLessonId) return;
    (l.vocab||[]).forEach(w => {
      const st = S.vocab[vocabKey(l.id, w[0])];
      if (!st || !st.box) out.push({ l, w });
    });
  });
  return out.slice(0, max || out.length);
}
