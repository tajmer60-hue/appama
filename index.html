<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English from Zero → International Finance — 35 уроков</title>
<meta name="description" content="Офлайн-приложение для изучения английского с нуля: 5 модулей, 35 уроков, грамматика, 30 слов на урок, тренажёры и тесты.">
<style>/* =========================================================
   English Zero → Finance. Стили приложения (light/dark)
   ========================================================= */
:root{
  --bg:#f5f6f9; --bg2:#eceef4; --surface:#ffffff; --surface2:#f8f9fc;
  --text:#161a24; --text2:#5b6474; --text3:#8b93a3;
  --border:#e2e5ed; --border2:#eef0f5;
  --primary:#3358d4; --primary-soft:#e8edfd; --primary-ink:#1d3a9e;
  --accent:#0d9488; --accent-soft:#dff5f2;
  --success:#15803d; --success-soft:#dcf3e4;
  --warn:#b45309; --warn-soft:#fdeed7;
  --danger:#be123c; --danger-soft:#fde4ea;
  --gold:#a16207;
  --shadow:0 1px 2px rgba(20,25,45,.06),0 8px 24px -12px rgba(20,25,45,.18);
  --shadow-lg:0 24px 60px -24px rgba(20,25,45,.35);
  --r:14px; --r-sm:10px; --r-lg:20px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --eng:Georgia,"Iowan Old Style","Times New Roman",serif;
  --sidebar-w:296px;
}
html[data-theme="dark"]{
  --bg:#0e1117; --bg2:#0a0d13; --surface:#161b25; --surface2:#1b212c;
  --text:#e8ebf2; --text2:#a4adbd; --text3:#7b8598;
  --border:#262d3a; --border2:#20262f;
  --primary:#7f9cf5; --primary-soft:#1d2742; --primary-ink:#c3d2ff;
  --accent:#2dd4bf; --accent-soft:#12312e;
  --success:#4ade80; --success-soft:#132f1e;
  --warn:#fbbf24; --warn-soft:#33270d;
  --danger:#fb7185; --danger-soft:#361721;
  --gold:#fcd34d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
a{color:var(--primary);text-decoration:none}
button{font-family:inherit}
::selection{background:var(--primary);color:#fff}
h1,h2,h3,h4{line-height:1.25;margin:0 0 .5em;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 .8em}
code,kbd{font-family:var(--mono);font-size:.92em;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:1px 5px}
kbd{font-size:.8em;box-shadow:0 1px 0 var(--border)}
hr{border:0;border-top:1px solid var(--border);margin:1.4em 0}
.eng{font-family:var(--eng)}
.ru{color:var(--text2)}
.muted{color:var(--text2)}
.small{font-size:.86rem}
.center{text-align:center}
.nowrap{white-space:nowrap}
.hidden{display:none!important}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--sidebar-w);flex:0 0 var(--sidebar-w);position:sticky;top:0;height:100vh;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;z-index:40;
}
#main{flex:1 1 auto;min-width:0;padding:22px 26px 90px;max-width:1180px;margin:0 auto;width:100%}
#scrim{position:fixed;inset:0;background:rgba(8,10,16,.5);z-index:35;backdrop-filter:blur(2px)}

/* ---------- sidebar ---------- */
.sb-head{padding:16px 16px 12px;border-bottom:1px solid var(--border2);display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--primary),#7a4ff0);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto;box-shadow:var(--shadow)}
.sb-title{font-weight:800;font-size:.98rem;letter-spacing:-.02em;line-height:1.2}
.sb-sub{font-size:.72rem;color:var(--text3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.sb-nav{padding:10px;overflow-y:auto;flex:1 1 auto;scrollbar-width:thin}
.sb-sec{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);font-weight:700;padding:12px 10px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--text2);
  cursor:pointer;font-size:.9rem;font-weight:500;border:0;background:none;width:100%;text-align:left;transition:.14s;
}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:700}
html[data-theme="dark"] .nav-item.active{color:var(--primary)}
.nav-item .ic{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item .grow{flex:1}
.nav-item .pill{font-size:.7rem;background:var(--surface2);border:1px solid var(--border);padding:0 6px;border-radius:20px;color:var(--text3);font-weight:700}
.nav-item.active .pill{background:var(--surface);color:var(--primary)}
.nav-mod{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.86rem;color:var(--text)}
.nav-mod:hover{background:var(--surface2)}
.nav-mod .chev{transition:.2s;color:var(--text3)}
.nav-mod.open .chev{transform:rotate(90deg)}
.nav-mod .num{width:22px;height:22px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:.7rem;color:var(--text2);flex:0 0 22px}
.nav-lessons{padding:2px 0 6px 20px;display:flex;flex-direction:column;gap:1px}
.nav-lesson{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;font-size:.83rem;color:var(--text2);border:0;background:none;text-align:left;width:100%}
.nav-lesson:hover{background:var(--surface2);color:var(--text)}
.nav-lesson.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
html[data-theme="dark"] .nav-lesson.active{color:var(--primary)}
.nav-lesson .st{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--border);display:grid;place-items:center;font-size:9px}
.nav-lesson.done .st{background:var(--success);border-color:var(--success);color:#fff}
.nav-lesson.started .st{background:var(--warn-soft);border-color:var(--warn)}
.nav-lesson .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot{border-top:1px solid var(--border2);padding:10px;display:flex;flex-direction:column;gap:8px}
.sb-streak{display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:8px 10px}
.sb-streak b{font-size:1rem}
.mini-bar{height:6px;background:var(--bg2);border-radius:20px;overflow:hidden;flex:1}
.mini-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:20px}

/* ---------- generic components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:11px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:650;font-size:.92rem;
  cursor:pointer;transition:.15s;white-space:nowrap;box-shadow:0 1px 1px rgba(16,20,35,.04);
}
.btn:hover{border-color:var(--text3);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--surface2);color:var(--text);border-color:transparent}
.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
html[data-theme="dark"] .btn.soft{color:var(--primary)}
.btn.danger{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:9px}
.btn.lg{padding:13px 22px;font-size:1rem;border-radius:13px}
.btn.icon{padding:8px;width:36px;height:36px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);font-size:.76rem;font-weight:700;color:var(--text2)}
.chip.ok{background:var(--success-soft);border-color:transparent;color:var(--success)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.info{background:var(--primary-soft);border-color:transparent;color:var(--primary-ink)}
html[data-theme="dark"] .chip.info{color:var(--primary)}
.chip.gold{background:var(--warn-soft);border-color:transparent;color:var(--gold)}
.badge{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text3)}
.progress{height:8px;background:var(--bg2);border-radius:20px;overflow:hidden;border:1px solid var(--border2)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:20px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.progress.thin{height:5px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-size:1.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .l{font-size:.78rem;color:var(--text3);font-weight:600}
input[type=text],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:var(--surface);
  color:var(--text);font-size:.95rem;font-family:inherit;transition:.15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
label.fld{display:block;font-size:.8rem;font-weight:700;color:var(--text2);margin-bottom:5px}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-size:.9rem;user-select:none}
.switch input{position:absolute;opacity:0;pointer-events:none}
.switch .track{width:40px;height:23px;border-radius:20px;background:var(--bg2);border:1px solid var(--border);position:relative;transition:.18s;flex:0 0 40px}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);transition:.18s}
.switch input:checked + .track{background:var(--primary);border-color:var(--primary)}
.switch input:checked + .track::after{transform:translateX(17px)}

/* ---------- home ---------- */
.hero{
  background:linear-gradient(120deg,var(--primary),#6d43e0 55%,var(--accent));
  color:#fff;border-radius:var(--r-lg);padding:26px 28px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)
}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.13)}
.hero::before{content:"";position:absolute;right:90px;bottom:-120px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:1.75rem;margin-bottom:.2em}
.hero p{opacity:.92;max-width:60ch;margin-bottom:1.1em}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:2}
.hero .btn{background:rgba(255,255,255,.95);border-color:transparent;color:#1b2450}
.hero .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.35)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.26)}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:18px;position:relative;z-index:2}
.hero-stats .v{font-size:1.5rem;font-weight:800}
.hero-stats .l{font-size:.74rem;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sec-h{display:flex;align-items:flex-end;gap:12px;margin:30px 0 12px}
.sec-h h2{font-size:1.16rem;margin:0}
.sec-h .spacer{flex:1}
.mod-card{padding:16px 18px;display:flex;flex-direction:column;gap:9px;position:relative;overflow:hidden;transition:.16s;cursor:pointer}
.mod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mod-card .mt{font-weight:800;font-size:1.02rem}
.mod-card .md{font-size:.85rem;color:var(--text2)}
.mod-num{position:absolute;right:8px;top:-14px;font-size:5rem;font-weight:900;color:var(--bg2);line-height:1;pointer-events:none;letter-spacing:-.06em}
html[data-theme="dark"] .mod-num{color:var(--surface2)}
.lesson-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border2);cursor:pointer;transition:.13s}
.lesson-row:last-child{border-bottom:0}
.lesson-row:hover{background:var(--surface2)}
.lesson-row .n{width:30px;height:30px;flex:0 0 30px;border-radius:9px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--text2)}
.lesson-row.done .n{background:var(--success);border-color:var(--success);color:#fff}
.lesson-row.started .n{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.lesson-row .lt{font-weight:650;font-size:.93rem}
.lesson-row .ls{font-size:.78rem;color:var(--text3)}
.lesson-row .lp{width:90px;flex:0 0 90px}
.due-card{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft);border:1px solid transparent}
.due-card b{color:var(--accent)}
html[data-theme="dark"] .due-card b{color:var(--accent)}

/* ---------- lesson ---------- */
.l-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.l-head .num{width:52px;height:52px;flex:0 0 52px;border-radius:15px;background:linear-gradient(135deg,var(--primary),#7a4ff0);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.15rem;box-shadow:var(--shadow)}
.l-head h1{font-size:1.42rem;margin-bottom:2px}
.l-head .crumbs{font-size:.78rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:13px;border:1px solid var(--border2);overflow-x:auto;margin-bottom:16px}
.tab{padding:8px 15px;border-radius:10px;border:0;background:none;cursor:pointer;font-weight:650;font-size:.88rem;color:var(--text2);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.14s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow);font-weight:750}
html[data-theme="dark"] .tab.active{color:var(--primary)}
.tab .cnt{font-size:.7rem;background:var(--bg2);border-radius:20px;padding:0 6px;color:var(--text3);font-weight:800}
.tab.active .cnt{background:var(--primary-soft);color:var(--primary)}

/* theory */
.theory{margin-bottom:14px}
.theory .th{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;user-select:none}
.theory .th h3{margin:0;font-size:1rem}
.theory .th .k{font-size:.7rem;font-weight:800;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:2px 7px}
.theory .tb{padding:0 18px 6px;border-top:1px solid var(--border2);font-size:.96rem}
.theory .tb p{margin:.85em 0}
.theory h4{margin:1.4em 0 .5em;font-size:.95rem}
.theory ul,.theory ol{margin:.5em 0 1em;padding-left:1.3em}
.theory li{margin:.28em 0}
.theory li::marker{color:var(--primary)}
.theory b,.theory strong{font-weight:750}
.theory .formula{
  font-family:var(--eng);background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--primary);
  border-radius:10px;padding:11px 14px;margin:.9em 0;font-size:1.02rem
}
.theory .formula .plus{color:var(--text3);padding:0 5px}
.theory .eg{background:var(--accent-soft);border-radius:10px;padding:10px 14px;margin:.8em 0;font-family:var(--eng);font-size:1rem}
.theory .eg .t{color:var(--text)}
.theory .eg .r{font-family:inherit;color:var(--text2);font-size:.86rem;display:block;margin-top:2px;font-style:italic}
.theory .note{border-radius:10px;padding:11px 14px;margin:.9em 0;font-size:.92rem;border:1px solid var(--border)}
.theory .note.tip{background:var(--primary-soft);border-color:transparent}
.theory .note.warn{background:var(--warn-soft);border-color:transparent}
.theory .note.rule{background:var(--success-soft);border-color:transparent}
.theory .note .nt{font-weight:800;display:block;margin-bottom:3px;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em}
.theory .note.tip .nt{color:var(--primary-ink)} .theory .note.warn .nt{color:var(--warn)} .theory .note.rule .nt{color:var(--success)}
html[data-theme="dark"] .theory .note.tip .nt{color:var(--primary)}
.theory table{width:100%;border-collapse:collapse;margin:.9em 0;font-size:.92rem}
.theory th,.theory td{border:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top}
.theory th{background:var(--surface2);font-weight:750;font-size:.84rem}
.theory td.en{font-family:var(--eng)}
.theory .neg{color:var(--danger);font-weight:700}
.theory .pos{color:var(--success);font-weight:700}

/* ---------- vocab ---------- */
.v-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--border2);border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;cursor:pointer;font-weight:650;font-size:.84rem;color:var(--text2);white-space:nowrap}
.seg button.active{background:var(--surface);color:var(--primary-ink);box-shadow:var(--shadow)}
html[data-theme="dark"] .seg button.active{color:var(--primary)}
table.vocab{width:100%;border-collapse:separate;border-spacing:0;font-size:.93rem}
table.vocab th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:9px 12px;border-bottom:1px solid var(--border);z-index:2}
table.vocab td{padding:9px 12px;border-bottom:1px solid var(--border2);vertical-align:middle}
table.vocab tr:hover td{background:var(--surface2)}
table.vocab td.w{font-family:var(--eng);font-weight:600;font-size:1rem;white-space:nowrap}
table.vocab td.tr{color:var(--text2);white-space:nowrap}
table.vocab td.ex{font-family:var(--eng);color:var(--text2);font-size:.88rem}
.speak{border:0;background:var(--surface2);width:28px;height:28px;border-radius:8px;cursor:pointer;display:grid;place-items:center;color:var(--text2);flex:0 0 28px;transition:.14s}
.speak:hover{background:var(--primary-soft);color:var(--primary)}
.speak.speaking{background:var(--primary);color:#fff}
.sr-badge{width:9px;height:9px;border-radius:50%;background:var(--border);display:inline-block}
.sr-badge[data-b="1"]{background:var(--danger)}
.sr-badge[data-b="2"]{background:var(--warn)}
.sr-badge[data-b="3"]{background:#3b82f6}
.sr-badge[data-b="4"]{background:var(--accent)}
.sr-badge[data-b="5"]{background:var(--success)}

/* flashcards */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0}
.fc{
  width:100%;max-width:560px;min-height:290px;perspective:1400px;cursor:pointer;
}
.fc-inner{position:relative;width:100%;height:100%;min-height:290px;transition:transform .5s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;text-align:center
}
.fc-back{transform:rotateY(180deg);background:var(--surface2)}
.fc-word{font-family:var(--eng);font-size:2.1rem;font-weight:700;letter-spacing:-.02em}
.fc-tr{font-size:1.35rem;color:var(--text2)}
.fc-ex{font-family:var(--eng);font-size:.98rem;color:var(--text2);border-top:1px solid var(--border);padding-top:12px;margin-top:6px;max-width:44ch}
.fc-hint{font-size:.78rem;color:var(--text3);font-weight:600}
.fc-rate{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.fc-rate .btn{min-width:110px}
.fc-count{font-size:.84rem;color:var(--text3);font-weight:700}

/* ---------- exercises ---------- */
.ex-head{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.ex-type{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:7px}
.ex-item{padding:16px;border:1px solid var(--border2);border-radius:var(--r-sm);margin-bottom:10px;background:var(--surface2);transition:.16s}
.ex-item.correct{background:var(--success-soft);border-color:transparent}
.ex-item.wrong{background:var(--danger-soft);border-color:transparent}
.ex-q{font-family:var(--eng);font-size:1.06rem;margin-bottom:11px;line-height:1.65}
.ex-q .ru-part{font-family:inherit;color:var(--text2);font-size:.9rem;display:block;margin-top:5px}
.ex-q b.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--primary);color:var(--primary);font-weight:700;text-align:center;padding:0 4px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--border);border-radius:11px;
  background:var(--surface);cursor:pointer;font-size:.96rem;text-align:left;width:100%;transition:.13s;font-family:inherit;color:var(--text)
}
.opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.opt .key{width:22px;height:22px;flex:0 0 22px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);display:grid;place-items:center;font-size:.72rem;font-weight:800;color:var(--text3)}
.opt .otext{font-family:var(--eng)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--success);background:var(--success-soft)}
.opt.right .key{background:var(--success);color:#fff;border-color:var(--success)}
.opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.opt.bad .key{background:var(--danger);color:#fff;border-color:var(--danger)}
.opt:disabled{cursor:default;opacity:.92}
.ex-ans{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.ex-ans input[type=text]{flex:1 1 220px;font-family:var(--eng);font-size:1rem}
.fb{margin-top:10px;padding:10px 13px;border-radius:10px;font-size:.9rem;border:1px solid transparent}
.fb.ok{background:var(--success-soft);color:var(--success)}
.fb.no{background:var(--danger-soft);color:var(--danger)}
.fb b{font-weight:800}
.fb .corr{font-family:var(--eng);font-weight:700;color:var(--text);display:block;margin-top:3px}
.fb .why{display:block;margin-top:5px;color:var(--text2);font-size:.87rem}
.wo-bank,.wo-line{display:flex;gap:7px;flex-wrap:wrap;min-height:44px;padding:8px;border-radius:11px;border:1px dashed var(--border);margin-bottom:8px;background:var(--surface)}
.wo-line{border-style:solid;background:var(--surface2)}
.tok{padding:7px 13px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-family:var(--eng);font-size:.96rem;transition:.12s;user-select:none}
.tok:hover{border-color:var(--primary);color:var(--primary)}
.tok.used{opacity:.28;pointer-events:none}
.tok.placed{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-ink)}
html[data-theme="dark"] .tok.placed{color:var(--primary)}
.match-row{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.match-l{flex:0 0 42%;font-family:var(--eng);font-weight:600;padding:9px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.match-r{flex:1}
.match-row.ok .match-l{border-color:var(--success);background:var(--success-soft)}
.match-row.no .match-l{border-color:var(--danger);background:var(--danger-soft)}
.tf-row{display:flex;gap:8px}
.ex-foot{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--border2)}
.ex-score{font-weight:800;font-size:1rem}
.ex-result{padding:16px;border-radius:var(--r);text-align:center;margin-top:14px}
.ex-result.pass{background:var(--success-soft)}
.ex-result.fail{background:var(--warn-soft)}
.ex-result .big{font-size:2rem;font-weight:900;letter-spacing:-.03em}
.cloze-text{font-family:var(--eng);font-size:1.04rem;line-height:2}
.cloze-text select{width:auto;display:inline-block;padding:3px 8px;font-size:.94rem;font-family:var(--eng);margin:0 2px}
.bank{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.bank .chip{font-family:var(--eng)}

/* vocab quiz */
.vq-opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px;border:1px solid var(--border);border-radius:13px;background:var(--surface);cursor:pointer;font-size:.95rem;text-align:center;transition:.14s;min-height:96px;justify-content:center}
.vq-opt:hover:not(:disabled){border-color:var(--primary);background:var(--primary-soft)}
.vq-opt.right{border-color:var(--success);background:var(--success-soft)}
.vq-opt.bad{border-color:var(--danger);background:var(--danger-soft)}
.vq-word{font-family:var(--eng);font-size:1.9rem;font-weight:700;margin:10px 0 4px}

/* ---------- tests ---------- */
.test-hero{text-align:center;padding:26px 20px}
.test-hero .big{font-size:3.4rem;font-weight:900;letter-spacing:-.04em;line-height:1}
.score-ring{width:132px;height:132px;margin:0 auto 10px}
.qnav{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}
.qnav button{width:32px;height:32px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.8rem;font-weight:700;color:var(--text2)}
.qnav button.cur{border-color:var(--primary);background:var(--primary);color:#fff}
.qnav button.ok{background:var(--success-soft);border-color:var(--success);color:var(--success)}
.qnav button.no{background:var(--danger-soft);border-color:var(--danger);color:var(--danger)}
.mistake{padding:12px 14px;border-left:3px solid var(--danger);background:var(--surface2);border-radius:0 10px 10px 0;margin-bottom:9px;font-size:.92rem}
.mistake .q{font-family:var(--eng)}
.mistake .a{color:var(--danger)} .mistake .c{color:var(--success);font-family:var(--eng);font-weight:700}

/* ---------- grammar book ---------- */
.gb-item{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--border2);cursor:pointer;font-size:.9rem}
.gb-item:hover{background:var(--surface2)}
mark{background:#ffe9a8;color:#111;border-radius:3px;padding:0 2px}
html[data-theme="dark"] mark{background:#7a5c00;color:#fff}

/* ---------- modal / toast ---------- */
.modal-bd{position:fixed;inset:0;background:rgba(8,10,16,.55);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{margin-top:0}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.9rem;font-weight:600;box-shadow:var(--shadow-lg);animation:tin .25s ease}
.toast.ok{background:var(--success);color:#fff}
.toast.no{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.banner{padding:11px 15px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.88rem;font-weight:600;margin-bottom:14px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.empty{padding:50px 20px;text-align:center;color:var(--text3)}
.empty .big{font-size:2.4rem;margin-bottom:8px}

/* ---------- responsive ---------- */
#menu-btn{display:none}
@media (max-width:1000px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-102%);transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
  #sidebar.open{transform:none}
  #main{padding:14px 14px 80px}
  #menu-btn{display:inline-flex}
  .g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
  .hero{padding:20px}
  .hero h1{font-size:1.35rem}
  .l-head .num{width:42px;height:42px;flex:0 0 42px;font-size:1rem}
  .l-head h1{font-size:1.16rem}
  .lesson-row .lp{display:none}
  .match-row{flex-direction:column;align-items:stretch}
  .match-l{flex:none}
  table.vocab td.ex{display:none}
  table.vocab th.c-ex{display:none}
}
@media print{
  #sidebar,#toasts,.tabs,.btn,#scrim{display:none!important}
  body{background:#fff}
  #main{padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc}
}
.ex-item.answered{background:var(--surface);border-color:var(--primary);opacity:.9}

/* ---------- размеры иконок (глобально) ---------- */
.ic{width:18px;height:18px;flex:0 0 18px}
.btn .ic{width:17px;height:17px}
.btn.sm .ic{width:15px;height:15px}
.btn.icon .ic{width:19px;height:19px}
.chip .ic{width:13px;height:13px}
.speak .ic{width:15px;height:15px}
.chev-i{width:16px;height:16px}
.nav-mod .chev .ic{width:14px;height:14px}
.gb-item .ic{width:15px;height:15px}
.banner .ic{width:17px;height:17px}
.empty .big .ic{width:42px;height:42px}
#menu-btn .ic{width:20px;height:20px}
.sb-streak .ic{width:16px;height:16px}
.ex-type + h3 ~ .chip .ic{width:12px;height:12px}

#menu-fab{position:fixed;left:14px;bottom:14px;z-index:60;display:none;box-shadow:var(--shadow-lg)}
@media (max-width:860px){ #menu-fab{display:inline-flex} body.sb-open #menu-fab{display:none} }
@media print{ #menu-fab{display:none!important} }
</style>

<body>
<div id="app">
  <aside id="sidebar" aria-label="Навигация"></aside>
  <div id="scrim" hidden></div>
  <main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<script>/* ==== data/00_head.js ==== */
/* Каркас данных курса */
var __MOD = [];
var __LESS = [];


/* ==== data/m1a.js ==== */
/* ================= МОДУЛЬ 1 · Уроки 1–2 ================= */
__MOD.push({
  id: 'm1',
  title: 'Абсолютный фундамент и структура предложения',
  short: 'Фундамент',
  subtitle: 'Здесь мы учимся строить простые, но грамматически безупречные предложения: четыре времени группы Simple/Continuous, артикли, местоимения, исчисляемость и предлоги.'
});

__LESS.push({
  id: 1, mod: 'm1', minutes: 60,
  title: 'Основы Present Simple и структура простого предложения',
  short: 'Present Simple: структура',
  subtitle: 'Учим порядок слов, 30 базовых глаголов и строим утверждения, отрицания и вопросы.',
  theory: [
    { title: 'Как устроено английское предложение', html:
`<p>В английском <b>порядок слов фиксированный</b>. Он не «свободный», как в русском: перестановка слов меняет смысл или делает фразу ошибочной.</p>
<div class="formula">Подлежащее <span class="plus">+</span> Сказуемое <span class="plus">+</span> Дополнение <span class="plus">+</span> Обстоятельство<br>
<span style="font-size:.85em;color:var(--text2)">КТО? <span class="plus">→</span> ЧТО ДЕЛАЕТ? <span class="plus">→</span> С КЕМ/ЧЕМ? <span class="plus">→</span> ГДЕ? КОГДА? КАК?</span></div>
<div class="eg"><span class="t">I read reports in the office every morning.</span><span class="r">Я читаю отчёты в офисе каждое утро.</span></div>
<ul>
<li>Нельзя выпустить подлежащее: <span class="neg">Read reports.</span> → <span class="pos">I read reports.</span></li>
<li>Нельзя поставить дополнение перед глаголом: <span class="neg">I reports read.</span></li>
<li>Место и время идут <b>в конце</b>, причём место — раньше времени: <span class="pos">in the office every morning</span>.</li>
<li>Нельзя поставить два дополнения подряд: <span class="neg">I like you your idea.</span> → <span class="pos">I like your idea.</span></li>
</ul>
<div class="note tip"><span class="nt">Запомни</span>Порядок обстоятельств: <b>как? → где? → когда?</b><br><span class="eng">She works <b>hard</b> <b>at the bank</b> <b>every day</b>.</span></div>` },

    { title: 'Present Simple: когда использовать', html:
`<p>Present Simple — это <b>«вообще»</b>, а не «сейчас». Время описывает то, что верно всегда, регулярно или по расписанию.</p>
<table>
<tr><th>Случай</th><th>Пример</th></tr>
<tr><td>Регулярные действия, привычки, рутина</td><td class="en">I <b>work</b> in a bank. She <b>checks</b> email every morning.</td></tr>
<tr><td>Факты и общие истины</td><td class="en">Water <b>boils</b> at 100°C. The sun <b>rises</b> in the east.</td></tr>
<tr><td>Постоянные состояния</td><td class="en">He <b>lives</b> in Moscow. They <b>know</b> the answer.</td></tr>
<tr><td>Расписания (транспорт, программы, встречи)</td><td class="en">The train <b>leaves</b> at 8 a.m. The meeting <b>starts</b> at 10.</td></tr>
<tr><td>Мнения, чувства, предпочтения</td><td class="en">I <b>think</b> it is a good plan. She <b>likes</b> coffee.</td></tr>
</table>
<div class="note warn"><span class="nt">Частая ошибка</span>«Сейчас я работаю» — это НЕ Present Simple, а Present Continuous: <span class="eng">I <b>am working</b> now</span> (урок 2). Present Simple = <span class="eng">I <b>work</b></span> = «я работаю вообще / регулярно».</div>` },

    { title: 'Три формы: утверждение, отрицание, вопрос', html:
`<table>
<tr><th></th><th>I / you / we / they</th><th>he / she / it</th></tr>
<tr><td><b>+</b> Утверждение</td><td class="en">I <b>work</b>. We <b>live</b> here.</td><td class="en">He <b>works</b>. She <b>lives</b> here.</td></tr>
<tr><td><b>−</b> Отрицание</td><td class="en">I <b>do not (don't) work</b>.</td><td class="en">He <b>does not (doesn't) work</b>.</td></tr>
<tr><td><b>?</b> Вопрос</td><td class="en"><b>Do</b> you <b>work</b>?</td><td class="en"><b>Does</b> he <b>work</b>?</td></tr>
<tr><td>Краткий ответ</td><td class="en">Yes, I do. / No, I don't.</td><td class="en">Yes, he does. / No, he doesn't.</td></tr>
</table>
<p>Для отрицаний и вопросов нужен <b>вспомогательный глагол do / does</b>. Сам смысловой глагол при этом возвращается в начальную форму.</p>
<div class="eg"><span class="t">She <b>doesn't live</b> in Paris. — <b>Does</b> she <b>live</b> in Paris?</span><span class="r">Она не живёт в Париже. — Она живёт в Париже?</span></div>
<div class="note rule"><span class="nt">Правило «одна -s»</span>В предложении окончание <b>-s</b> встречается только один раз: либо на смысловом глаголе (утверждение), либо на <b>does</b> (вопрос/отрицание).<br>
<span class="pos">Does she work?</span> &nbsp;•&nbsp; <span class="neg">Does she works?</span></div>
<h4>Вопросы с вопросительным словом</h4>
<div class="formula">Вопросительное слово <span class="plus">+</span> do/does <span class="plus">+</span> подлежащее <span class="plus">+</span> глагол</div>
<div class="eg"><span class="t"><b>Where do</b> you <b>live</b>? <b>What does</b> he <b>do</b>? <b>When does</b> the meeting <b>start</b>?</span><span class="r">Где ты живёшь? Чем он занимается? Когда начинается встреча?</span></div>` },

    { title: 'Окончание -s / -es: три правила', html:
`<p>Окончание добавляется <b>только</b> в 3-м лице единственного числа (he, she, it) в утверждении.</p>
<table>
<tr><th>Правило</th><th>Примеры</th></tr>
<tr><td>Обычно просто <b>-s</b></td><td class="en">work → works, read → reads, play → plays, buy → buys</td></tr>
<tr><td>После <b>-o, -s, -x, -ch, -sh</b> → <b>-es</b></td><td class="en">go → goes, do → does, watch → watches, finish → finishes, fix → fixes, pass → passes</td></tr>
<tr><td>Согласная + <b>y</b> → <b>-ies</b></td><td class="en">study → studies, try → tries, carry → carries, fly → flies</td></tr>
<tr><td>Гласная + <b>y</b> → просто <b>-s</b></td><td class="en">play → plays, buy → buys, enjoy → enjoys, say → says</td></tr>
</table>
<div class="note warn"><span class="nt">Особые формы</span><b>have → has</b> (не «haves»). Модальные <b>can, must, should</b> никогда не берут -s: <span class="eng">She can swim</span> (не «cans»).</div>
<h4>Как произносить -s</h4>
<ul>
<li><b>/ɪz/</b> после шипящих и свистящих: watch<span style="color:var(--primary)">es</span> /wɒtʃɪz/, finish<span style="color:var(--primary)">es</span>, pass<span style="color:var(--primary)">es</span></li>
<li><b>/s/</b> после глухих: work<span style="color:var(--primary)">s</span> /wɜːks/, help<span style="color:var(--primary)">s</span>, like<span style="color:var(--primary)">s</span></li>
<li><b>/z/</b> после звонких и гласных: live<span style="color:var(--primary)">s</span> /lɪvz/, play<span style="color:var(--primary)">s</span>, read<span style="color:var(--primary)">s</span></li>
</ul>` },

    { title: 'do / does: вспомогательный глагол', html:
`<p>В русском вопросе мы просто меняем интонацию: «Ты работаешь?». В английском нужен <b>помощник</b> — do/does. Он берёт на себя грамматическую нагрузку, а смысловой глагол остаётся «голым».</p>
<div class="formula">They <b>work</b>. <span class="plus">→</span> <b>Do</b> they <b>work</b>? <span class="plus">→</span> They <b>don't work</b>.<br>
He <b>works</b>. <span class="plus">→</span> <b>Does</b> he <b>work</b>? <span class="plus">→</span> He <b>doesn't work</b>.</div>
<h4>Отрицательные слова вместо not</h4>
<ul>
<li><b>never</b> — никогда: <span class="eng">I <b>never</b> drink coffee at night.</span> (уже отрицание — <span class="neg">don't never</span> нельзя)</li>
<li><b>hardly ever / rarely / seldom</b> — почти никогда, редко</li>
<li><b>nothing, nobody</b> — ничего, никто: <span class="eng">He <b>knows nothing</b> about it.</span></li>
</ul>
<div class="note rule"><span class="nt">Важно</span>В английском <b>одно отрицание</b> в предложении: <span class="pos">I don't know anything.</span> <span class="neg">I don't know nothing.</span></div>
<h4>Утвердительная форма do/does</h4>
<p>Do/does используются и в утверждении — для усиления: <span class="eng">I <b>do</b> like this plan!</span> = «Мне правда нравится этот план!»</p>` },

    { title: 'Слова-маркеры Present Simple', html:
`<p>Маркеры — это «сигнальные слова», по которым носитель сразу понимает время. Их нужно знать наизусть.</p>
<table>
<tr><th>Маркер</th><th>Перевод</th><th>Пример</th></tr>
<tr><td class="en">always</td><td>всегда</td><td class="en">She always checks the figures.</td></tr>
<tr><td class="en">usually</td><td>обычно</td><td class="en">I usually take the bus.</td></tr>
<tr><td class="en">often</td><td>часто</td><td class="en">They often work late.</td></tr>
<tr><td class="en">sometimes</td><td>иногда</td><td class="en">Sometimes he travels abroad.</td></tr>
<tr><td class="en">rarely / seldom</td><td>редко</td><td class="en">We rarely see him.</td></tr>
<tr><td class="en">never</td><td>никогда</td><td class="en">I never lie to clients.</td></tr>
<tr><td class="en">every day / week / month / year</td><td>каждый день / неделю…</td><td class="en">The team meets every Monday.</td></tr>
<tr><td class="en">on Mondays, at weekends</td><td>по понедельникам, по выходным</td><td class="en">On Fridays we send reports.</td></tr>
<tr><td class="en">once / twice / three times a week</td><td>раз / два / три раза в неделю</td><td class="en">She calls clients twice a day.</td></tr>
</table>

__LESS.push({
  id: 2, mod: 'm1', minutes: 60,
  title: 'Present Continuous и его отличие от Present Simple',
  short: 'Present Continuous',
  subtitle: 'Процессы «прямо сейчас», 30 слов-маркеров и выбор между двумя временами.',
  theory: [
    { title: 'Формула Present Continuous', html:
`<p>Present Continuous (Present Progressive) описывает <b>действие в процессе</b>: оно началось, ещё не закончилось и происходит в момент речи (или в текущий период).</p>
<div class="formula">am / is / are <span class="plus">+</span> глагол-ing</div>
<table>
<tr><th></th><th>Форма</th><th>Пример</th></tr>
<tr><td><b>+</b></td><td class="en">I <b>am working</b>. / He <b>is working</b>. / We <b>are working</b>.</td><td>Я работаю (сейчас).</td></tr>
<tr><td><b>−</b></td><td class="en">I <b>'m not working</b>. / She <b>isn't working</b>. / They <b>aren't working</b>.</td><td>Я не работаю (сейчас).</td></tr>
<tr><td><b>?</b></td><td class="en"><b>Are</b> you <b>working</b>? <b>Is</b> he <b>working</b>?</td><td>Ты работаешь (сейчас)?</td></tr>
</table>
<p>Связка <b>am/is/are</b> — обязательна. Без неё предложение разваливается:</p>
<div class="eg"><span class="t"><span class="neg">She working now.</span> → <span class="pos">She <b>is</b> working now.</span></span></div>
<h4>Короткие формы (так говорят в жизни)</h4>
<div class="eg"><span class="t">I'm / he's / she's / it's / we're / they're / you're &nbsp;•&nbsp; isn't / aren't</span><span class="r">I'm writing a report. They aren't listening.</span></div>
<div class="note tip"><span class="nt">Запомни</span>В вопросе be «выпрыгивает» вперёд: <span class="eng">You are waiting → <b>Are</b> you waiting?</span></div>` },

    { title: 'Правила образования -ing', html:
`<table>
<tr><th>Правило</th><th>Примеры</th></tr>
<tr><td>Обычно просто <b>-ing</b></td><td class="en">work → working, read → reading, play → playing, open → opening</td></tr>
<tr><td>Немая <b>-e</b> на конце выпадает</td><td class="en">write → writing, make → making, come → coming, take → taking</td></tr>
<tr><td>Одна гласная + одна согласная под ударением → согласная удваивается</td><td class="en">run → running, sit → sitting, get → getting, begin → beginning, put → putting</td></tr>
<tr><td><b>-ie</b> → <b>-ying</b></td><td class="en">die → dying, lie → lying, tie → tying</td></tr>
<tr><td>Без удвоения, если две гласные подряд или нет ударения</td><td class="en">read → reading, meet → meeting, work → working, visit → visiting, open → opening</td></tr>
</table>
<div class="note warn"><span class="nt">Частые ошибки</span>
<span class="neg">writting, makeing, runing, stoping</span> → <span class="pos">writing, making, running, stopping</span>.<br>
Удвоение только при схеме «одна гласная + одна согласная под ударением».</div>` },

    { title: 'Когда использовать Present Continuous', html:
`<ol>
<li><b>Прямо сейчас, в момент речи.</b><br><span class="eng">Look! It <b>is raining</b>. I <b>am writing</b> an email.</span></li>
<li><b>Временная ситуация в текущий период</b> (не обязательно в эту секунду).<br><span class="eng">This month we <b>are working</b> on a new project. He <b>is studying</b> for his exam these days.</span></li>
<li><b>Раздражающее регулярное действие</b> — с <b>always</b>.<br><span class="eng">You <b>are always checking</b> your phone!</span></li>
<li><b>Изменения и тенденции.</b><br><span class="eng">Prices <b>are rising</b>. The market <b>is growing</b>. Our team <b>is getting</b> bigger.</span></li>
<li><b>Личные договорённости о будущем</b> (точный план).<br><span class="eng">I <b>am meeting</b> the client tomorrow at 3.</span> Подробно — в уроке 4.</li>
</ol>
<div class="note rule"><span class="nt">Главный тест</span>Можно ли спросить «что ты делаешь <b>прямо сейчас</b>?» — если да, это Continuous.</div>` },

    { title: 'Present Simple vs Present Continuous', html:
`<table>
<tr><th></th><th>Present Simple</th><th>Present Continuous</th></tr>
<tr><td>Смысл</td><td>вообще, всегда, регулярно</td><td>сейчас, в процессе, временно</td></tr>
<tr><td>Формула</td><td class="en">V / V<b>s</b></td><td class="en">am/is/are + V<b>ing</b></td></tr>
<tr><td>Маркеры</td><td class="en">always, usually, every day, often</td><td class="en">now, at the moment, today, Look!</td></tr>
<tr><td>Пример</td><td class="en">I <b>work</b> in a bank. (моя постоянная работа)</td><td class="en">I <b>am working</b> on a report now. (в данный момент)</td></tr>
<tr><td>Пример</td><td class="en">She <b>drinks</b> coffee. (привычка)</td><td class="en">She <b>is drinking</b> coffee. (прямо сейчас)</td></tr>
<tr><td>Пример</td><td class="en">It <b>rains</b> a lot here. (климат)</td><td class="en">It <b>is raining</b>. (посмотри в окно)</td></tr>
</table>
<div class="eg"><span class="t">He usually <b>drives</b> to work, but today he <b>is taking</b> the bus.</span><span class="r">Обычно он ездит на машине, но сегодня едет на автобусе — классическая пара времён в одном предложении.</span></div>
<div class="note tip"><span class="nt">Алгоритм выбора</span>1) Есть ли маркер «сейчас» (now, at the moment, today)? → Continuous.<br>2) Есть ли маркер регулярности (always, every day, usually)? → Simple.<br>3) Это постоянный факт о человеке/компании? → Simple.<br>4) Это временная ситуация или изменение? → Continuous.</div>` },

    { title: 'Глаголы состояния: с Continuous не используются', html:
`<p>Некоторые глаголы описывают не действие, а <b>состояние</b>: мысли, чувства, владение, восприятие. В Continuous они, как правило, не стоят — даже если речь о «сейчас».</p>
<table>
<tr><th>Группа</th><th>Глаголы</th></tr>
<tr><td>Мышление</td><td class="en">know, understand, believe, think (=полагать), remember, forget, mean, recognise</td></tr>
<tr><td>Чувства</td><td class="en">like, love, hate, prefer, want, need, wish</td></tr>
<tr><td>Владение</td><td class="en">have (=иметь), own, possess, belong, include, contain</td></tr>
<tr><td>Восприятие</td><td class="en">see, hear, smell, taste, sound, seem, appear</td></tr>
<tr><td>Прочее</td><td class="en">be, cost, weigh, consist of, depend on</td></tr>
</table>
<div class="eg"><span class="t"><span class="neg">I am knowing the answer.</span> → <span class="pos">I <b>know</b> the answer.</span></span><span class="r">Знание — состояние, оно не «происходит».</span></div>
<div class="eg"><span class="t"><span class="neg">She is wanting a coffee.</span> → <span class="pos">She <b>wants</b> a coffee.</span></span></div>
<h4>Когда значение меняется — Continuous возможен</h4>
<ul>
<li><b>think</b>: «полагать» → Simple; «обдумывать» → Continuous. <span class="eng">I <b>think</b> he is right.</span> / <span class="eng">I <b>am thinking</b> about your offer.</span></li>
<li><b>have</b>: «иметь» → Simple; «есть / принимать душ / проводить» → Continuous. <span class="eng">I <b>have</b> a car.</span> / <span class="eng">I <b>am having</b> lunch.</span></li>
<li><b>see</b>: «видеть» → Simple; «встречаться» → Continuous. <span class="eng">I <b>see</b> a mistake.</span> / <span class="eng">I <b>am seeing</b> the client at 4.</span></li>
<li><b>taste / smell</b>: «иметь вкус/запах» → Simple; «пробовать / нюхать» → Continuous.</li>
</ul>` },

    { title: '30 слов-маркеров Present Continuous', html:
`<p>Маркеры ниже — во вкладке «Слова» с примерами. Выучи их: по маркеру время определяется за секунду.</p>
<ul>
<li><b>момент речи:</b> <span class="eng">now, right now, at the moment, at present, currently, just now, Look!, Listen!</span></li>
<li><b>текущий период:</b> <span class="eng">today, tonight, this week, this month, this year, this morning, these days, for now, for the time being, temporarily</span></li>
<li><b>длительность:</b> <span class="eng">all day, all morning, all week, still, while, as, meanwhile</span></li>

  title: 'Future Simple и конструкции с «to be going to»',

  subtitle: 'Спонтанные решения, планы и предсказания. 30 маркеров будущего времени.',
  theory: [
    { title: 'will: формула и четыре главных значения', html:
`<div class="formula">will <span class="plus">+</span> V1 &nbsp;&nbsp;|&nbsp;&nbsp; will not = won't &nbsp;&nbsp;|&nbsp;&nbsp; Will + подлежащее + V1?</div>
<p>Форма <b>одинакова для всех лиц</b> — никакого -s: <span class="eng">I will go, he will go, they will go</span>.</p>
<table>
<tr><th>Значение</th><th>Пример</th></tr>
<tr><td><b>1. Спонтанное решение</b> (принято в момент речи)</td><td class="en">The phone is ringing — I<b>'ll answer</b> it.<br>It's cold. I<b>'ll close</b> the window.</td></tr>
<tr><td><b>2. Предсказание</b> на основе мнения (часто с I think, probably)</td><td class="en">I think the market <b>will grow</b>.<br>Prices <b>will probably rise</b> next year.</td></tr>
<tr><td><b>3. Обещание, предложение, просьба</b></td><td class="en">I<b>'ll send</b> you the report by 5 p.m.<br><b>Will</b> you <b>help</b> me with this task?</td></tr>
<tr><td><b>4. Факт будущего</b> (то, что произойдёт независимо от нас)</td><td class="en">The CEO <b>will be</b> 50 next month.<br>Tomorrow <b>will be</b> a difficult day.</td></tr>
</table>
<div class="note tip"><span class="nt">Короткие формы</span>В речи почти всегда сокращают: <b>I'll, you'll, he'll, she'll, we'll, they'll</b>, отрицание — <b>won't</b> /wəʊnt/.</div>` },

    { title: 'be going to: планы и очевидные предсказания', html:
`<div class="formula">am / is / are <span class="plus"> going to </span> <span class="plus">+</span> V1</div>
<table>
<tr><th>Значение</th><th>Пример</th></tr>
<tr><td><b>1. План / намерение</b>, решённое ДО момента речи</td><td class="en">We <b>are going to open</b> a new office next year.<br>I<b>'m going to study</b> finance.</td></tr>
<tr><td><b>2. Предсказание по очевидным признакам</b> (мы это видим сейчас)</td><td class="en">Look at those clouds — it <b>is going to rain</b>.<br>The company <b>is going to lose</b> money: the charts show it.</td></tr>
</table>
<div class="eg"><span class="t">— We<b>'re going to launch</b> the product in June. (план, уже решили)<br>— OK, I<b>'ll prepare</b> the presentation. (решение принято только что)</span><span class="r">Идеальная пара: going to = план, will = реакция на него.</span></div>
<div class="note warn"><span class="nt">Не смешивай</span><span class="neg">I go to study</span>, <span class="neg">I am going study</span>, <span class="neg">I will going to</span> — всё это ошибки.<br>Правильно: <span class="pos">I am going to study</span> / <span class="pos">I will study</span>.</div>
<h4>Неформальный вариант gonna</h4>
<p>В речи и переписке в чатах: <span class="eng">I'm <b>gonna</b> call him.</span> В деловом письме так писать <b>нельзя</b> — только going to.</p>` },

    { title: 'will или be going to? Алгоритм выбора', html:
`<table>
<tr><th>Ситуация</th><th>Что выбрать</th></tr>
<tr><td>Решил только что, в момент разговора</td><td class="en"><b>will</b>: I'll do it right now.</td></tr>
<tr><td>План/намерение существовал заранее</td><td class="en"><b>going to</b>: I'm going to visit Berlin in May.</td></tr>
<tr><td>Личное мнение о будущем (I think / probably)</td><td class="en"><b>will</b>: I think sales will rise.</td></tr>
<tr><td>Есть видимые признаки сейчас</td><td class="en"><b>going to</b>: He is going to fall!</td></tr>
<tr><td>Обещание, предложение помощи</td><td class="en"><b>will</b>: I'll help you.</td></tr>
<tr><td>Факт будущего</td><td class="en"><b>will</b>: The meeting will start at 10.</td></tr>
</table>
<div class="note rule"><span class="nt">Короткое правило</span><b>will</b> = «решаю/думаю сейчас». <b>going to</b> = «уже задумал/уже видно».</div>
<h4>Другие способы говорить о будущем</h4>
<ul>
<li><b>Present Continuous</b> — личная договорённость с точным временем: <span class="eng">I <b>am meeting</b> the client tomorrow at 3.</span></li>
<li><b>Present Simple</b> — расписания: <span class="eng">The train <b>leaves</b> at 8 a.m. tomorrow.</span></li>
<li><b>might / may</b> — неуверенность: <span class="eng">We <b>might sign</b> the deal next week.</span></li>
</ul>` },

    { title: 'Вопросы, отрицания, shall и вежливые формы', html:
`<table>
<tr><th></th><th>will</th><th>be going to</th></tr>
<tr><td><b>+</b></td><td class="en">She will (she'll) call you.</td><td class="en">She is going to call you.</td></tr>
<tr><td><b>−</b></td><td class="en">She will not (won't) call you.</td><td class="en">She isn't going to call you.</td></tr>
<tr><td><b>?</b></td><td class="en">Will she call you?</td><td class="en">Is she going to call you?</td></tr>
<tr><td>Краткий ответ</td><td class="en">Yes, she will. / No, she won't.</td><td class="en">Yes, she is. / No, she isn't.</td></tr>
<tr><td>Вопрос с словом</td><td class="en">When will she call?</td><td class="en">When is she going to call?</td></tr>
</table>
<h4>shall</h4>
<p>В современном английском <b>shall</b> сохранился в двух ситуациях — с <b>I</b> и <b>we</b> в вопросах-предложениях:</p>

<h4>Вежливые просьбы с will/would</h4>

<div class="formula">Главная часть (will) <span class="plus">+</span> придаточная (Present Simple)</div>
<div class="eg"><span class="t">I <b>will call</b> you when I <b>arrive</b>. <span class="muted">(не «when I will arrive»)</span></span><span class="r">Я позвоню тебе, когда приеду.</span></div>

`<p>В русском артиклей нет, поэтому эта тема кажется «нелогичной». На самом деле логика очень простая. Артикль отвечает на вопрос: <b>«собеседник понимает, о каком именно предмете речь?»</b></p>
<table>
<tr><th>Ситуация</th><th>Артикль</th><th>Пример</th></tr>

<div class="eg"><span class="t">I saw <b>a</b> man. <b>The</b> man was wearing <b>a</b> blue suit. <b>The</b> suit was expensive.</span><span class="r">Классическая цепочка: первое упоминание — a, повторное — the.</span></div>

`<p>В русском «я / меня / мой / себе» — это разные слова. В английском это <b>пять рядов</b> одной системы. Выучи таблицу целиком — и половина ошибок исчезнет.</p>
<table>
<tr><th>Кто? (подлежащее)</th><th>Кого? (дополнение)</th><th>Чей? (прилаг.)</th><th>Чей? (местоим.)</th><th>Себя (возвр.)</th></tr>
<tr><td class="en"><b>I</b></td><td class="en">me</td><td class="en">my</td><td class="en">mine</td><td class="en">myself</td></tr>
<tr><td class="en"><b>you</b></td><td class="en">you</td><td class="en">your</td><td class="en">yours</td><td class="en">yourself / yourselves</td></tr>
<tr><td class="en"><b>he</b></td><td class="en">him</td><td class="en">his</td><td class="en">his</td><td class="en">himself</td></tr>
<tr><td class="en"><b>she</b></td><td class="en">her</td><td class="en">her</td><td class="en">hers</td><td class="en">herself</td></tr>
<tr><td class="en"><b>it</b></td><td class="en">it</td><td class="en">its</td><td class="en">—</td><td class="en">itself</td></tr>
<tr><td class="en"><b>we</b></td><td class="en">us</td><td class="en">our</td><td class="en">ours</td><td class="en">ourselves</td></tr>
<tr><td class="en"><b>they</b></td><td class="en">them</td><td class="en">their</td><td class="en">theirs</td><td class="en">themselves</td></tr>
</table>
<div class="note rule"><span class="nt">Как выбрать ряд</span>1) Стоит <b>перед существительным</b> (чей? + предмет) → <b>my, your, his, her, its, our, their</b>: <span class="eng">This is <b>my</b> report.</span><br>
2) Стоит <b>без существительного</b> (заменяет «мой + предмет») → <b>mine, yours, his, hers, ours, theirs</b>: <span class="eng">This report is <b>mine</b>.</span><br>
3) После глагола или предлога (кого? кому?) → <b>me, you, him, her, it, us, them</b>: <span class="eng">Call <b>me</b>. Give it to <b>them</b>. Between you and <b>me</b>.</span></div>` },

<h4>Порядок в паре «я и кто-то»</h4>

    { title: 'Притяжательный падеж ’s и of', html:
`<p>Чтобы сказать «чей-то», есть два способа: <b>’s</b> (для людей, организаций, времени) и <b>of</b> (для предметов и абстракций).</p>

    { title: 'Возвратные местоимения: myself, himself…', html:

<tr><td class="en">mine / yours / his…</td><td class="en">This car is <b>mine</b>.</td><td>Когда существительное уже понятно из контекста</td></tr>

<p class="small muted">* <b>data</b> формально множественное (the data are), но в бизнес-английском почти всегда используется как единственное: <b>the data is</b>. <b>fruit</b> — неисчисляемое, но «виды фруктов» → fruits.</p>

`<div class="formula"><b>Past Simple</b> = действие осталось в прошлом, время <b>закончилось</b> и <b>названо</b>.<br><b>Present Perfect</b> = действие в прошлом, но есть <b>мост в настоящее</b>: результат, опыт или незакрытый период.</div>
<table>
<tr><th>Past Simple</th><th>Present Perfect</th></tr>
<tr><td class="en">I <b>lost</b> my keys yesterday. <span class="ru-part">(факт прошлого; может, уже нашёл)</span></td><td class="en">I <b>have lost</b> my keys. <span class="ru-part">(сейчас я без ключей!)</span></td></tr>
<tr><td class="en">She <b>lived</b> in Paris for 5 years. <span class="ru-part">(сейчас уже не живёт)</span></td><td class="en">She <b>has lived</b> in Paris for 5 years. <span class="ru-part">(и сейчас живёт)</span></td></tr>
<tr><td class="en">He <b>worked</b> at a bank. <span class="ru-part">(раньше, уже не там)</span></td><td class="en">He <b>has worked</b> at a bank for 10 years. <span class="ru-part">(и работает)</span></td></tr>
<tr><td class="en"><b>Did</b> you <b>see</b> the report?</td><td class="en"><b>Have</b> you <b>seen</b> the report?</td></tr>

</table>
<div class="note rule"><span class="nt">Формула выбора</span>Есть <b>конкретное законченное время</b> (yesterday, ago, in 2010, last week, when)? → <b>Past Simple</b>.<br>Нет времени, или период ещё не закрыт (today, this week, ever, already, since, for)? → <b>Present Perfect</b>.</div>` },

    { title: '30 маркеров: кто к какому времени', html:
`<div class="grid g2" style="gap:10px">
<div class="note tip" style="margin:0"><span class="nt">Present Perfect</span><span class="eng">already, yet, just, ever, never, recently, lately, so far, up to now, since, for, today, this week, this month, this year, this morning*, in the last few years, over the past decade, how long…?</span></div>
<div class="note warn" style="margin:0"><span class="nt">Past Simple</span><span class="eng">yesterday, last night / week / month / year, … ago, in 2010, in the 1990s, then, at that moment, the other day, when I was young, on Monday, in May, this morning* (если утро уже прошло)</span></div>
</div>
<p class="small muted">* <b>this morning</b> — двояко: утром (когда день ещё идёт) → Perfect; вечером, вспоминая утро → Past Simple.</p>
<table>
<tr><th>Пара</th><th>Пример</th></tr>

<tr><td class="en">ago ↔ recently</td><td class="en">two days <b>ago</b> (Past) ↔ <b>recently</b> (Perfect)</td></tr>

<div class="eg"><span class="t">I have known her <b>since</b> 2018. = I have known her <b>for</b> seven years.</span><span class="r">Один и тот же факт, две точки отсчёта.</span></div>
<h4>Как пересчитать</h4>

<h4>Новости против рассказа</h4>

`<p>В американском английском Past Simple часто используется там, где британский требует Present Perfect — особенно с <b>just, already, yet</b>.</p>
<table>
<tr><th>BrE</th><th>AmE</th></tr>
<tr><td class="en">I<b>'ve just</b> seen him.</td><td class="en">I <b>just</b> saw him.</td></tr>
<tr><td class="en">Have you eaten <b>yet</b>?</td><td class="en">Did you eat <b>yet</b>?</td></tr>
<tr><td class="en">She<b>'s already</b> left.</td><td class="en">She <b>already</b> left.</td></tr>
</table>
<p>Для экзаменов и деловой переписки безопаснее <b>британская норма</b> — её мы и тренируем.</p>
<h4>Случаи, где легко ошибиться</h4>

  theory: [
    { title: 'Шкала частоты: от 100% до 0%', html:
`<table>
<tr><th>%</th><th>Наречие</th><th>Перевод</th><th>Пример</th></tr>
<tr><td>100</td><td class="en"><b>always</b></td><td>всегда</td><td class="en">I always check my email in the morning.</td></tr>
<tr><td>90</td><td class="en"><b>usually / normally</b></td><td>обычно</td><td class="en">She usually arrives at 9.</td></tr>
<tr><td>70</td><td class="en"><b>often / frequently</b></td><td>часто</td><td class="en">We often work overtime.</td></tr>
<tr><td>50</td><td class="en"><b>sometimes / occasionally</b></td><td>иногда</td><td class="en">Sometimes I take a taxi.</td></tr>
<tr><td>30</td><td class="en"><b>from time to time / now and then</b></td><td>время от времени</td><td class="en">He calls us from time to time.</td></tr>
<tr><td>10</td><td class="en"><b>rarely / seldom / hardly ever</b></td><td>редко, почти никогда</td><td class="en">They rarely miss a deadline.</td></tr>
<tr><td>0</td><td class="en"><b>never</b></td><td>никогда</td><td class="en">I never sign documents without reading them.</td></tr>
</table>
<p>Ещё useful: <span class="eng">generally, mostly, regularly, constantly, all the time, once in a while, twice a year</span>.</p>
<div class="note warn"><span class="nt">never уже отрицание</span><span class="neg">I don’t never smoke.</span> → <span class="pos">I <b>never</b> smoke.</span> / <span class="pos">I <b>don’t</b> smoke.</span></div>` },

    { title: 'Главное правило места в предложении', html:
`<div class="formula">Перед <b>смысловым</b> глаголом, но <b>после</b> глагола be / модального / вспомогательного.</div>
<table>
<tr><th>Случай</th><th>Позиция</th><th>Пример</th></tr>
<tr><td>Смысловой глагол</td><td><b>перед</b> ним</td><td class="en">She <b>always checks</b> the reports. We <b>often meet</b> clients.</td></tr>
<tr><td>Глагол <b>be</b></td><td><b>после</b> него</td><td class="en">He <b>is always</b> late. They <b>are usually</b> busy.</td></tr>
<tr><td>Модальный / вспомогательный</td><td><b>между</b> ним и смысловым</td><td class="en">I <b>can never</b> understand this. We <b>have already</b> finished. She <b>will probably</b> agree.</td></tr>
<tr><td>В вопросе</td><td>после подлежащего</td><td class="en">Do you <b>often</b> travel? How <b>usually</b> do you…? → How do you <b>usually</b>…?</td></tr>
</table>
<div class="note warn"><span class="nt">Частые ошибки</span>
<span class="neg">She checks always the reports.</span> → <span class="pos">She <b>always checks</b> the reports.</span><br>
<span class="neg">He always is late.</span> → <span class="pos">He <b>is always</b> late.</span><br>
<span class="neg">I go usually by bus.</span> → <span class="pos">I <b>usually go</b> by bus.</span></div>
<h4>Наречия, которые любят край предложения</h4>
<p><b>sometimes, usually, normally, often, occasionally</b> могут стоять и в начале, и в конце — для акцента:</p>
<div class="eg"><span class="t"><b>Sometimes</b> I work from home. I work from home <b>sometimes</b>. I <b>sometimes</b> work from home.</span><span class="r">Все три варианта верны.</span></div>
<p><b>always, never, rarely, seldom</b> в начале предложения требуют <b>инверсии</b> (формальный стиль):</p>
<div class="eg"><span class="t"><b>Never have</b> I seen such results. <b>Rarely does</b> he make mistakes.</span><span class="r">Очень эффектно в публичных выступлениях.</span></div>` },

    { title: 'Порядок слов: полная схема предложения', html:
`<div class="formula">Подлежащее <span class="plus">+</span> (наречие) <span class="plus">+</span> сказуемое <span class="plus">+</span> дополнение <span class="plus">+</span> место <span class="plus">+</span> время <span class="plus">+</span> (цель)</div>
<div class="eg"><span class="t">She <b>usually</b> sends <b>the report</b> <b>to the client</b> <b>by email</b> <b>on Friday morning</b>.</span><span class="r">Подлежащее → наречие → глагол → что → кому → как → когда.</span></div>
<h4>Жёсткие правила</h4>
<ol>
<li><b>Подлежащее и сказуемое неразлучны.</b> Между ними можно поставить только наречие частоты/степени.<br><span class="neg">My colleague yesterday called.</span> → <span class="pos">My colleague called yesterday.</span></li>
<li><b>Порядок обстоятельств: КАК → ГДЕ → КОГДА.</b><br><span class="eng">He works <b>hard</b> (как) <b>at the office</b> (где) <b>every day</b> (когда).</span></li>
<li><b>Косвенное дополнение раньше прямого</b> (без предлога): <span class="eng">She gave <b>me</b> <b>the report</b>.</span> Если прямой объект первым — нужен to: <span class="eng">She gave the report <b>to me</b>.</span></li>
<li><b>Вопросительное слово — всегда первым.</b> <span class="eng">Where do you work?</span></li>
<li><b>Отрицание — через вспомогательный глагол.</b> <span class="eng">I don’t work. She doesn’t work.</span></li>
<li><b>Нет двойных отрицаний.</b> <span class="neg">I don’t know nothing.</span> → <span class="pos">I don’t know anything.</span></li>

<h4>Порядок в вопросе</h4>
<div class="formula">(Вопросительное слово) <span class="plus">+</span> вспомогательный <span class="plus">+</span> подлежащее <span class="plus">+</span> (наречие) <span class="plus">+</span> смысловой глагол <span class="plus">+</span> остальное</div>
<div class="eg"><span class="t">How <b>often do</b> you travel? Where <b>does</b> she <b>usually</b> work? When <b>will</b> they <b>probably</b> arrive?</span><span class="r">Наречие стоит после подлежащего, а не после вспомогательного.</span></div>` },

`<p>Наречия образа действия отвечают на вопрос «как?» и обычно образуются от прилагательных с помощью <b>-ly</b>.</p>

<div class="note warn"><span class="nt">Прилагательное или наречие?</span>После <b>be, seem, look, feel, sound, taste, smell, become, get</b> — <b>прилагательное</b>: <span class="eng">He <b>is</b> careful. The plan <b>looks</b> good. I <b>feel</b> bad.</span><br>

  id: 15, mod: 'm2', minutes: 55,
  title: 'Past Continuous: действие в процессе в прошлом',
  short: 'Past Continuous',
  subtitle: 'Фоновые процессы в определённый момент прошлого + 30 глаголов действия.',
  theory: [
    { title: 'Формула Past Continuous', html:
`<div class="formula">was / were <span class="plus">+</span> V-ing</div>
<table>
<tr><th></th><th>I / he / she / it</th><th>you / we / they</th></tr>
<tr><td><b>+</b></td><td class="en">I <b>was working</b>. She <b>was writing</b> a report.</td><td class="en">We <b>were working</b>. They <b>were waiting</b>.</td></tr>
<tr><td><b>−</b></td><td class="en">I <b>wasn't working</b>. He <b>wasn't listening</b>.</td><td class="en">They <b>weren't working</b>.</td></tr>
<tr><td><b>?</b></td><td class="en"><b>Was</b> she <b>working</b>?</td><td class="en"><b>Were</b> you <b>working</b>?</td></tr>
</table>
<p>Правила образования <b>-ing</b> те же, что и в Present Continuous (урок 2): write → writing, run → running, die → dying.</p>
<div class="note warn"><span class="nt">Ошибка</span><span class="neg">He working at 5 p.m. yesterday.</span> / <span class="neg">He was work.</span><br>
<span class="pos">He <b>was working</b> at 5 p.m. yesterday.</span> — нужны и was, и -ing.</div>` },

    { title: 'Когда использовать Past Continuous', html:
`<ol>
<li><b>Действие в процессе в конкретный момент прошлого.</b><br><span class="eng">At 5 p.m. yesterday I <b>was writing</b> the report.</span> (в 5 часов я был в процессе)</li>
<li><b>Фоновое действие, прерванное другим.</b><br><span class="eng">I <b>was having</b> lunch when the client <b>called</b>.</span></li>
<li><b>Два параллельных действия.</b><br><span class="eng">While she <b>was presenting</b>, he <b>was taking</b> notes.</span></li>
<li><b>Длительное действие с for / all day / the whole evening.</b><br><span class="eng">They <b>were negotiating</b> <b>all day</b>.</span></li>
<li><b>Атмосфера, описание сцены в рассказе.</b><br><span class="eng">The sun <b>was shining</b>, people <b>were walking</b>, and the market <b>was growing</b>.</span></li>
<li><b>Вежливые просьбы и «мягкие» намерения.</b><br><span class="eng">I <b>was wondering</b> if you could help me. I <b>was hoping</b> we could discuss the budget.</span></li>
<li><b>Раздражающее регулярное действие (с always).</b><br><span class="eng">He <b>was always interrupting</b> me.</span></li>
</ol>
<div class="note rule"><span class="nt">Смысл одной картинкой</span><b>Past Continuous</b> = «процесс, внутри которого мы находимся». <b>Past Simple</b> = «точка, факт, завершённое событие».</div>
<h4>Маркеры времени</h4>
<p><span class="eng">at 5 o'clock yesterday, at that moment, at midnight, all day / all morning / all week, the whole evening, from 2 till 5, while, when, as, during the meeting</span></p>` },

    { title: 'Глаголы состояния: с Past Continuous не используются', html:
`<p>Как и в Present Continuous, <b>stative verbs</b> не принимают форму Continuous — даже в прошлом.</p>
<div class="eg"><span class="t"><span class="neg">I was knowing the answer.</span> → <span class="pos">I <b>knew</b> the answer.</span></span><span class="r">know, want, understand, like, hate, believe, remember, belong, own, cost, seem, mean — только Simple.</span></div>
<table>
<tr><th>Неправильно</th><th>Правильно</th></tr>
<tr><td class="en neg">She was wanting a coffee.</td><td class="en pos">She <b>wanted</b> a coffee.</td></tr>
<tr><td class="en neg">We were believing him.</td><td class="en pos">We <b>believed</b> him.</td></tr>
<tr><td class="en neg">The project was costing too much.</td><td class="en pos">The project <b>cost</b> too much.</td></tr>
<tr><td class="en neg">I was understanding the task.</td><td class="en pos">I <b>understood</b> the task.</td></tr>
</table>
<div class="note tip"><span class="nt">Исключения с изменением смысла</span><b>think</b> (обдумывать), <b>have</b> (есть/проводить), <b>see</b> (встречаться), <b>taste</b> (пробовать) — в «действенном» значении Continuous возможен: <span class="eng">I <b>was thinking</b> about your offer. We <b>were having</b> lunch when he came.</span></div>` },

    { title: 'Past Continuous против Past Simple: разница в смысле', html:
`<table>
<tr><th>Past Continuous</th><th>Past Simple</th></tr>
<tr><td class="en">I <b>was reading</b> the report at 6 p.m.<br><span class="ru-part">В 6 часов я был в процессе чтения (неизвестно, дочитал ли).</span></td><td class="en">I <b>read</b> the report at 6 p.m.<br><span class="ru-part">В 6 я начал/совершил это действие как факт.</span></td></tr>
<tr><td class="en">She <b>was working</b> when I called.<br><span class="ru-part">Она работала (процесс) в момент звонка.</span></td><td class="en">She <b>worked</b> when I called.<br><span class="ru-part">Звучит странно; обычно: She answered when I called.</span></td></tr>
<tr><td class="en">It <b>was raining</b> all day.<br><span class="ru-part">Дождь шёл весь день (процесс).</span></td><td class="en">It <b>rained</b> yesterday.<br><span class="ru-part">Факт: вчера был дождь.</span></td></tr>
</table>
<h4>Классическая схема: фон + событие</h4>
<div class="formula">Past Continuous (длинное фоновое) <span class="plus"> when </span> Past Simple (короткое событие)</div>
<div class="eg"><span class="t">We <b>were discussing</b> the budget <b>when</b> the CEO <b>came</b> in.</span><span class="r">Мы обсуждали бюджет (процесс), когда вошёл генеральный директор (событие).</span></div>
<div class="formula">While <span class="plus">+</span> Past Continuous <span class="plus">,</span> Past Simple</div>
<div class="eg"><span class="t"><b>While</b> I <b>was travelling</b>, I <b>met</b> an interesting client.</span><span class="r">Во время поездки (фон) я встретил клиента (событие).</span></div>
<div class="note tip"><span class="nt">Подробно</span>Разница between Past Simple и Past Continuous — отдельная большая тема. Она разобрана в следующем уроке (16).</div>` },

    { title: 'Past Continuous в деловой речи', html:
`<p>Это время делает речь вежливее и точнее: оно показывает процесс, а не результат.</p>
<h4>Вежливые формулы</h4>
<ul>
<li><span class="eng">I <b>was wondering</b> if you could send me the file.</span> — «Я хотел бы поинтересоваться…» (очень вежливо)</li>
<li><span class="eng">I <b>was hoping</b> we could discuss my salary.</span> — «Я надеялся, что мы могли бы…»</li>
<li><span class="eng"><b>Were</b> you <b>looking for</b> me?</span> — «Вы меня искали?»</li>
<li><span class="eng">Sorry I missed your call, I <b>was having</b> a meeting.</span> — объяснение причины</li>
</ul>
<h4>Отчёты о процессах</h4>
<ul>
<li><span class="eng">At that time we <b>were negotiating</b> with two suppliers.</span></li>
<li><span class="eng">While the market <b>was falling</b>, our sales <b>were growing</b>.</span></li>

__LESS.push({
  id: 16, mod: 'm2', minutes: 55,
  title: 'Сравнение Past Simple и Past Continuous',
  short: 'Past Simple vs Continuous',
  subtitle: 'Завершённое действие и длительный процесс. 30 слов-связок: when, while, as.',
  theory: [
    { title: 'Главная разница: точка против линии', html:
`<div class="formula"><b>Past Simple</b> = точка, факт, завершённое событие (линия закончилась).<br><b>Past Continuous</b> = линия, процесс, «внутри» которого что-то происходит.</div>
<table>
<tr><th>Past Simple</th><th>Past Continuous</th></tr>
<tr><td class="en">I <b>read</b> the report. <span class="ru-part">(прочитал — факт)</span></td><td class="en">I <b>was reading</b> the report. <span class="ru-part">(был в процессе)</span></td></tr>
<tr><td class="en">She <b>called</b> me. <span class="ru-part">(позвонила)</span></td><td class="en">She <b>was calling</b> me when I left. <span class="ru-part">(звонила в тот момент)</span></td></tr>
<tr><td class="en">It <b>rained</b>. <span class="ru-part">(был дождь)</span></td><td class="en">It <b>was raining</b>. <span class="ru-part">(дождь шёл)</span></td></tr>
<tr><td class="en">They <b>worked</b> all day. <span class="ru-part">(факт о дне)</span></td><td class="en">They <b>were working</b> all day. <span class="ru-part">(акцент на процессе, длительности)</span></td></tr>
</table>
<div class="note rule"><span class="nt">Главный вопрос</span>Важно ли, <b>что случилось</b> (факт, результат)? → Past Simple.<br>Важно ли, <b>что происходило</b> (процесс, фон, длительность)? → Past Continuous.</div>` },

    { title: 'when, while, as — три слова-связки', html:
`<table>
<tr><th>Союз</th><th>Схема</th><th>Пример</th></tr>
<tr><td class="en"><b>when</b></td><td class="en">Past Continuous + <b>when</b> + Past Simple</td><td class="en">I <b>was working</b> <b>when</b> he <b>called</b>.</td></tr>
<tr><td class="en"><b>when</b></td><td class="en">Past Simple + <b>when</b> + Past Simple</td><td class="en">I <b>opened</b> the file <b>when</b> he <b>came</b>.</td></tr>
<tr><td class="en"><b>while</b></td><td class="en"><b>While</b> + Past Continuous, Past Simple</td><td class="en"><b>While</b> I <b>was sleeping</b>, the phone <b>rang</b>.</td></tr>
<tr><td class="en"><b>while</b></td><td class="en"><b>While</b> + Past Continuous, Past Continuous</td><td class="en"><b>While</b> she <b>was presenting</b>, he <b>was taking</b> notes.</td></tr>
<tr><td class="en"><b>as</b></td><td class="en"><b>As</b> + Past Continuous, Past Simple</td><td class="en"><b>As</b> I <b>was leaving</b>, I <b>saw</b> the director.</td></tr>
</table>
<div class="note rule"><span class="nt">Правило союзов</span>После <b>while</b> и <b>as</b> почти всегда идёт <b>Continuous</b> (они описывают процесс).<br>
После <b>when</b> обычно идёт <b>Past Simple</b> (короткое событие), но не всегда.</div>
<h4>Запятая</h4>
<p>Если придаточное с while/as/when стоит <b>в начале</b>, нужна запятая: <span class="eng">While I was working<b>,</b> the lights went out.</span> Если в конце — запятая не нужна: <span class="eng">The lights went out <b>while</b> I was working.</span></p>
<div class="eg"><span class="t">— What <b>were</b> you <b>doing</b> when the alarm <b>went</b> off? — I <b>was having</b> a meeting.</span><span class="r">Классический диалог на эту тему.</span></div>` },

    { title: 'Четыре типовые схемы', html:
`<table>
<tr><th>Схема</th><th>Формула</th><th>Пример</th></tr>
<tr><td>1. Прерванное действие</td><td class="en">Past Continuous + <b>when</b> + Past Simple</td><td class="en">We <b>were negotiating</b> <b>when</b> the client <b>changed</b> the price.</td></tr>
<tr><td>2. Два параллельных процесса</td><td class="en"><b>While</b> + Past Continuous, Past Continuous</td><td class="en"><b>While</b> the market <b>was falling</b>, our sales <b>were growing</b>.</td></tr>
<tr><td>3. Последовательность событий</td><td class="en">Past Simple + <b>then</b> + Past Simple</td><td class="en">He <b>came</b> in, <b>said</b> hello and <b>left</b>.</td></tr>
<tr><td>4. Фон + главное событие</td><td class="en">Past Continuous … , Past Simple</td><td class="en">The sun <b>was shining</b>, birds <b>were singing</b>, and suddenly the phone <b>rang</b>.</td></tr>
</table>
<div class="note warn"><span class="nt">Последовательность = только Past Simple</span>Если действия шли <b>одно за другим</b> (не одновременно), Continuous не нужен:<br>
<span class="pos">I <b>arrived</b> at the office, <b>opened</b> my laptop and <b>checked</b> the email.</span><br>
<span class="neg">I was arriving, was opening and was checking…</span></div>
<h4>Слова-сигналы для каждой схемы</h4>
<ul>
<li>Прерывание: <span class="eng">when, suddenly, all of a sudden, at that moment</span></li>
<li>Параллельность: <span class="eng">while, as, at the same time, meanwhile</span></li>
<li>Последовательность: <span class="eng">then, after that, first, next, finally, and</span></li>
<li>Длительность: <span class="eng">all day, all morning, for two hours, the whole week</span></li>
</ul>` },

    { title: 'Другие связки: before, after, until, as soon as, during', html:
`<table>
<tr><th>Союз / предлог</th><th>Что за ним</th><th>Пример</th></tr>
<tr><td class="en"><b>before</b></td><td>Past Simple</td><td class="en">She finished the report <b>before</b> the meeting <b>started</b>.</td></tr>
<tr><td class="en"><b>after</b></td><td>Past Simple</td><td class="en"><b>After</b> he <b>left</b>, we called the client.</td></tr>
<tr><td class="en"><b>until / till</b></td><td>Past Simple (граница)</td><td class="en">We worked <b>until</b> the manager <b>arrived</b>.</td></tr>
<tr><td class="en"><b>as soon as</b></td><td>Past Simple</td><td class="en"><b>As soon as</b> I <b>got</b> the email, I <b>called</b> him.</td></tr>
<tr><td class="en"><b>during</b></td><td>+ существительное</td><td class="en"><b>During</b> the meeting, my phone <b>rang</b>.</td></tr>
<tr><td class="en"><b>while</b></td><td>+ Continuous (или -ing)</td><td class="en"><b>While</b> I was reading, he was writing.</td></tr>
<tr><td class="en"><b>by the time</b></td><td>Past Simple</td><td class="en"><b>By the time</b> we arrived, the meeting <b>had started</b>.</td></tr>
</table>
<div class="note warn"><span class="nt">during vs while</span><b>during</b> + существительное: <span class="eng">during <b>the meeting</b></span>.<br>
<b>while</b> + подлежащее и сказуемое: <span class="eng">while <b>we were having</b> the meeting</span>.<br>
<span class="neg">during we were meeting</span> — ошибка.</div>
<div class="note tip"><span class="nt">Сокращение с while</span>Если подлежащее совпадает, его и be можно опустить: <span class="eng">While <b>(I was)</b> travelling, I met many interesting people.</span> → <span class="eng">While travelling, I met…</span></div>` },

    { title: 'Смысловые нюансы: почему выбор времени важен', html:
`<p>Иногда обе формы грамматически возможны, но смысл разный.</p>
<table>
<tr><th>Предложение</th><th>Смысл</th></tr>
<tr><td class="en">He <b>worked</b> at a bank.</td><td>Он работал в банке (факт биографии, возможно, уже не работает).</td></tr>
<tr><td class="en">He <b>was working</b> at a bank when we met.</td><td>Он работал там в тот период (фон для другого события).</td></tr>
<tr><td class="en">I <b>read</b> three reports yesterday.</td><td>Я прочитал три отчёта (результат, все три прочитаны).</td></tr>
<tr><td class="en">I <b>was reading</b> reports all day.</td><td>Я весь день читал отчёты (процесс; сколько прочитал — неизвестно).</td></tr>
<tr><td class="en">She <b>was always complaining</b>.</td><td>Она вечно жаловалась (раздражение говорящего).</td></tr>
<tr><td class="en">She always <b>complained</b>.</td><td>Она всегда жаловалась (нейтральный факт).</td></tr>
</table>
<div class="note rule"><span class="nt">Итоговый алгоритм</span>
1) Действие <b>длилось</b> в определённый момент прошлого (at 5 p.m., all day, at that moment)? → <b>Past Continuous</b>.<br>
2) Действие <b>прервало</b> другое или произошло <b>однократно</b>? → <b>Past Simple</b>.<br>
3) Действия шли <b>одновременно</b>? → оба <b>Past Continuous</b>.<br>
4) Действия шли <b>по очереди</b>? → все <b>Past Simple</b>.<br>
5) Это <b>глагол состояния</b> (know, want, understand, like)? → только <b>Past Simple</b>.</div>` }
