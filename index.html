const CONTR = {
  "i'm":"i am","you're":"you are","we're":"we are","they're":"they are","he's":"he is","she's":"she is","it's":"it is","that's":"that is","there's":"there is","who's":"who is","what's":"what is","where's":"where is","here's":"here is",
  "don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","can't":"cannot","cannot":"can not","won't":"will not","wouldn't":"would not","shouldn't":"should not","couldn't":"could not","mustn't":"must not","haven't":"have not","hasn't":"has not","hadn't":"had not","mightn't":"might not","needn't":"need not","shan't":"shall not",
  "i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","that'll":"that will",
  "i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'd":"i would","you'd":"you would","he'd":"he would","she'd":"she would","we'd":"we would","they'd":"they would"
};
function expandContr(s){ return s.split(/\s+/).map(t => CONTR[t] || t).join(' '); }
function stripPunct(s){
  return String(s||'').toLowerCase()
    .replace(/[‘’`´]/g, "'")
    .replace(/["«»]/g, '')
    .replace(/[.,!?;:]/g, '')
    .replace(/\s+/g,' ')
    .trim();
}
function normAns(s){ return expandContr(stripPunct(s)); }
/* Канонизация ответа: все разделители ( , ; / – — - ) приводятся к единой форме,
   чтобы «from / to», «from, to», «from to» и «from-to» считались одним ответом. */
function canon(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/[\u2018\u2019`\u00b4]/g, "'")
    .replace(/["\u00ab\u00bb]/g, '')
    .replace(/[.!?]/g, '')
    .replace(/[,;\u2013\u2014\u2212\-\/]/g, '/')
    .replace(/\/{2,}/g, '/')
    .replace(/\s*\/\s*/g, '/')
    .replace(/\s+/g, ' ')
    .replace(/^\/|\/$/g, '')
    .trim();
}
/* «мягкая» форма: разделители → пробел (twenty-one == twenty one) */
function loose(s){ return canon(s).replace(/\//g, ' ').replace(/\s+/g, ' ').trim(); }
function noApos(s){ return loose(s).replace(/'/g, ''); }
function canonExp(s){ return expandContr(canon(s)); }
const ZERO_FORMS = ['-','—','–','/','0','none','no article','no preposition','без артикля','без предлога','not needed','nothing'];
function isZeroForm(s){ const t = String(s == null ? '' : s).trim().toLowerCase(); return ZERO_FORMS.includes(t); }
function answersOk(given, accepted){
  const gRaw = String(given == null ? '' : given);
  if (!gRaw.trim()) return false;
  const forms = new Set([
    stripPunct(gRaw), normAns(gRaw), canon(gRaw), loose(gRaw), noApos(gRaw),
    expandContr(loose(gRaw)), canonExp(gRaw)
  ]);
  let list = Array.isArray(accepted) ? accepted : [String(accepted)];
  list = list.reduce((acc, a) => acc.concat(String(a).split('|')), []);
  for (const a of list){
    if (!String(a).trim()) continue;
    if (isZeroForm(a)) { if (isZeroForm(gRaw) || !canon(gRaw)) return true; }
    if (isZeroForm(gRaw) && !canon(a)) return true;
    const cand = [
      stripPunct(a), normAns(a), canon(a), loose(a), noApos(a),
      expandContr(loose(a)), canonExp(a)
    ];
    for (const c of cand) if (c && forms.has(c)) return true;
  }
  return false;
}

/* мягкая проверка свободного текста: нужные слова + минимальная длина */
function textOk(given, kw, minLen){
  const g = stripPunct(given);
  if (g.length < (minLen || 60)) return { ok:false, why:'Слишком коротко — нужно минимум ' + (minLen||60) + ' символов (сейчас ' + g.length + ').' };
  const miss = (kw||[]).filter(k => !new RegExp('(^|[^a-z])' + k.toLowerCase().replace(/[^a-z\s']/g,'') + '([^a-z]|$)').test(' '+g+' '));
  if (miss.length) return { ok:false, why:'Не использованы обязательные слова: ' + miss.join(', ') + '.' };
  return { ok:true };
}

function toast(msg, kind){
  const t = el('<div class="toast '+(kind||'')+'">'+esc(msg)+'</div>');
  $('#toasts').appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='.3s'; setTimeout(()=>t.remove(), 320); }, 2200);
}
function modal(html, opts){
  const root = $('#modal-root');
  const bd = el('<div class="modal-bd"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>');
  root.appendChild(bd);
  const close = () => { bd.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  bd.addEventListener('click', e => { if (e.target === bd && !(opts && opts.sticky)) close(); });
  return { node: bd, close };
}
function confirmDialog(title, text, onYes, yesLabel){
  const m = modal('<h3>'+esc(title)+'</h3><p class="muted">'+text+'</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn" data-no>Отмена</button><button class="btn danger" data-yes>'+esc(yesLabel||'Да')+'</button></div>');
  m.node.querySelector('[data-no]').onclick = m.close;
  m.node.querySelector('[data-yes]').onclick = () => { m.close(); onYes(); };
}

const EX_TYPE_NAME = {
  mc:'Выбор варианта', fill:'Вставь форму', tr:'Перевод', wo:'Порядок слов',
  match:'Соответствие', tf:'Верно / Неверно', cloze:'Текст с пропусками', write:'Свободное письмо'
};

function itemFeedback(ok, correctText, why){
  let h = '<div class="fb '+(ok?'ok':'no')+'">'+(ok ? '<b>Верно!</b>' : '<b>Неверно.</b>');
  if (!ok && correctText) h += '<span class="corr">'+correctText+'</span>';
  if (ok && correctText) h += '<span class="corr">'+correctText+'</span>';
  if (why) h += '<span class="why">'+why+'</span>';
  return h + '</div>';
}

/* --- рендер одного задания --- */
function renderItem(ex, it, idx, api){
  const wrap = el('<div class="ex-item" data-idx="'+idx+'"></div>');
  const silent = !!(api && api.silent);
  let answered = false, ok = false, given = null;

  const finish = (isOk, correctShow, why) => {
    answered = true; ok = isOk;
    if (silent){
      wrap.classList.add('answered');
      wrap.appendChild(el('<div class="fb" style="background:var(--surface2);color:var(--text3)"><b>Ответ записан</b><span class="why">Результат увидишь после завершения теста.</span></div>'));
      $$('input,select,textarea,button', wrap).forEach(n => n.disabled = true);
      api.onAnswer(idx, isOk, given, it);
      return;
    }
    wrap.classList.add(isOk ? 'correct' : 'wrong');
    wrap.appendChild(el(itemFeedback(isOk, correctShow ? esc(correctShow) : '', why ? esc(why) : '')));
    $$('.btn[data-check]', wrap).forEach(b => b.disabled = true);
    $$('input,select,textarea,.opt,.tok', wrap).forEach(n => { if (n.tagName!=='BUTTON') n.disabled = true; });
    api.onAnswer(idx, isOk, given, it);
  };

  /* ---------- mc ---------- */
  if (ex.type === 'mc'){
    const opts = ex.noShuffle ? it.options.slice() : shuffle(it.options);
    wrap.innerHTML =
      '<div class="ex-q">'+it.q+((it.hint||ex.hint)?'<span class="ru-part">'+esc(it.hint||ex.hint)+'</span>':'')+'</div>'+
      '<div class="opts">'+opts.map((o,i) =>
        '<button type="button" class="opt" data-v="'+esc(o)+'"><span class="key">'+(i+1)+'</span><span class="otext">'+esc(o)+'</span></button>').join('')+'</div>';
    $$('.opt', wrap).forEach(b => b.onclick = () => {
      if (answered) return;
      const v = b.dataset.v; given = v;
      const right = v === it.answer;
      b.classList.add('sel');
      $$('.opt', wrap).forEach(x => { x.disabled = true; if (!silent && x.dataset.v === it.answer) x.classList.add('right'); });
      if (!right && !silent) b.classList.add('bad');
      finish(right, right ? null : it.answer, it.why);
    });
    return wrap;
  }

  /* ---------- tf ---------- */
  if (ex.type === 'tf'){
    wrap.innerHTML = '<div class="ex-q">'+it.q+((it.hint||ex.hint)?'<span class="ru-part">'+esc(it.hint||ex.hint)+'</span>':'')+'</div>'+
      '<div class="tf-row"><button type="button" class="btn" data-v="1">Верно</button><button type="button" class="btn" data-v="0">Неверно</button></div>';
    $$('button[data-v]', wrap).forEach(b => b.onclick = () => {
      if (answered) return;
      const v = b.dataset.v === '1'; given = v ? 'Верно' : 'Неверно';
      const right = v === !!it.answer;
      b.classList.add('primary');
      $$('button[data-v]', wrap).forEach(x => { x.disabled = true; if (!silent && (x.dataset.v==='1') === !!it.answer) x.classList.add('soft'); });
      finish(right, right ? null : (it.answer ? 'Верно' : 'Неверно'), it.why);
    });
    return wrap;
  }

  /* ---------- fill / tr ---------- */
  if (ex.type === 'fill' || ex.type === 'tr'){
    const accepted = ex.type === 'fill'
      ? (typeof it.a === 'string' ? it.a.split('|') : it.a)
      : (Array.isArray(it.a) ? it.a : String(it.a).split('|'));
    wrap.innerHTML =
      '<div class="ex-q">'+it.q+((it.hint||ex.hint)?'<span class="ru-part">'+esc(it.hint||ex.hint)+'</span>':'')+'</div>'+
      '<div class="ex-ans"><input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(ex.type==='fill'?'впиши ответ':'переведи на английский')+'" aria-label="Ответ">'+
      '<button type="button" class="btn primary" data-check>Проверить</button>'+
      '<button type="button" class="btn ghost" data-show title="Показать ответ">?</button></div>';
    const inp = $('input', wrap);
    const check = () => {
      if (answered) return;
      given = inp.value.trim();
      if (!given) { inp.focus(); return; }
      const right = answersOk(given, accepted);
      finish(right, accepted[0], it.why);
    };
    $('[data-check]', wrap).onclick = check;
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
    $('[data-show]', wrap).onclick = () => { if (answered) return; inp.value = accepted[0]; given = ''; finish(false, accepted[0], 'Ответ показан — задание не засчитано. ' + (it.why||'')); };
    setTimeout(()=>{}, 0);
    return wrap;
  }

  /* ---------- wo (порядок слов) ---------- */
  if (ex.type === 'wo'){
    const answer = Array.isArray(it.a) ? it.a.join(' ') : it.a;
    const tokens = ex.scrambled === false ? (Array.isArray(it.a)? it.a : answer.split(/\s+/)) : shuffle((Array.isArray(it.a)? it.a : answer.split(/\s+/)));
    const placed = [];
    wrap.innerHTML = '<div class="ex-q">'+it.q+((it.hint||ex.hint)?'<span class="ru-part">'+esc(it.hint||ex.hint)+'</span>':'')+'</div>'+
      '<div class="wo-line" data-line><span class="fc-hint" style="align-self:center;padding:4px">Собери предложение…</span></div>'+
      '<div class="wo-bank" data-bank>'+tokens.map((t,i)=>'<button type="button" class="tok" data-i="'+i+'">'+esc(t)+'</button>').join('')+'</div>'+
      '<div class="row"><button type="button" class="btn primary" data-check>Проверить</button><button type="button" class="btn ghost" data-reset>Сбросить</button></div>';
    const line = $('[data-line]', wrap), bank = $('[data-bank]', wrap);
    const draw = () => {
      line.innerHTML = placed.length ? placed.map((p,k)=>'<button type="button" class="tok placed" data-k="'+k+'">'+esc(tokens[p])+'</button>').join('') : '<span class="fc-hint" style="align-self:center;padding:4px">Собери предложение…</span>';
      $$('.tok', bank).forEach(b => b.classList.toggle('used', placed.includes(+b.dataset.i)));
    };
    bank.addEventListener('click', e => { const b = e.target.closest('.tok'); if(!b||answered) return; placed.push(+b.dataset.i); draw(); });
    line.addEventListener('click', e => { const b = e.target.closest('.tok'); if(!b||answered) return; placed.splice(+b.dataset.k,1); draw(); });
    $('[data-reset]', wrap).onclick = () => { if(answered) return; placed.length = 0; draw(); };
    $('[data-check]', wrap).onclick = () => {
      if (answered) return;
      given = placed.map(i => tokens[i]).join(' ');
      if (!placed.length) return;
      finish(answersOk(given, [answer]), answer, it.why);
    };
    draw();
    return wrap;
  }

  /* ---------- match ---------- */
  if (ex.type === 'match'){
    const pairs = it.pairs;
    const rights = shuffle(pairs.map(p => p[1]));
    wrap.innerHTML = '<div class="ex-q">'+(it.q||'Соедини пары:')+'</div>' +
      pairs.map((p,i) =>
        '<div class="match-row" data-r="'+i+'"><div class="match-l">'+esc(p[0])+'</div>'+
        '<select class="match-r" data-i="'+i+'"><option value="">— выбери —</option>'+
        rights.map(r => '<option value="'+esc(r)+'">'+esc(r)+'</option>').join('')+'</select></div>').join('') +
      '<div class="row"><button type="button" class="btn primary" data-check>Проверить всё</button></div>';
    $('[data-check]', wrap).onclick = () => {
      if (answered) return;
      let good = 0, wrongTxt = [];
      $$('.match-row', wrap).forEach(row => {
        const i = +row.dataset.r, sel = $('select', row), v = sel.value;
        const right = pairs[i][1];
        if (v === right) { good++; row.classList.add('ok'); }
        else { row.classList.add('no'); wrongTxt.push(pairs[i][0] + ' → ' + right); }
        sel.disabled = true;
      });
      given = good + '/' + pairs.length;
      const allOk = good === pairs.length;
      answered = true; ok = allOk;
      if (silent){ wrap.classList.add('answered'); $$('button', wrap).forEach(b=>b.disabled=true); api.onAnswer(idx, allOk, given, it, good, pairs.length); return; }
      wrap.classList.add(allOk ? 'correct' : 'wrong');
      wrap.appendChild(el('<div class="fb '+(allOk?'ok':'no')+'"><b>'+(allOk?'Все пары верны!':'Верно '+good+' из '+pairs.length)+'</b>'+
        (wrongTxt.length?'<span class="corr">'+esc(wrongTxt.join('   •   '))+'</span>':'')+'</div>'));
      $$('button', wrap).forEach(b => b.disabled = true);
      api.onAnswer(idx, allOk, given, it, good, pairs.length);
    };
    return wrap;
  }

  /* ---------- cloze ---------- */
  if (ex.type === 'cloze'){
    const bank = shuffle(it.bank.slice());
    let html = esc(it.text).replace(/\[(\d+)\]/g, (m, n) =>
      '<select data-n="'+n+'"><option value="">…</option>'+bank.map(w=>'<option value="'+esc(w)+'">'+esc(w)+'</option>').join('')+'</select>');
    wrap.innerHTML = '<div class="ex-q">'+(it.q||'Вставь слова из банка в текст:')+'</div><div class="cloze-text">'+html+'</div>'+
      '<div class="row"><button type="button" class="btn primary" data-check>Проверить</button></div>';
    $('[data-check]', wrap).onclick = () => {
      if (answered) return;
      let good = 0, total = it.answers.length;
      $$('select[data-n]', wrap).forEach(s => {
        const n = +s.dataset.n, right = it.answers[n];
        if (s.value === right) { good++; s.style.borderColor='var(--success)'; } else { s.style.borderColor='var(--danger)'; }
        s.disabled = true;
      });
      given = good + '/' + total;
      const allOk = good === total;
      answered = true; ok = allOk;
      if (silent){ wrap.classList.add('answered'); $$('button', wrap).forEach(b=>b.disabled=true); api.onAnswer(idx, allOk, given, it, good, total); return; }
      wrap.classList.add(allOk?'correct':'wrong');
      const corrText = it.text.replace(/\[(\d+)\]/g, (m,n) => '[' + it.answers[+n] + ']');
      wrap.appendChild(el('<div class="fb '+(allOk?'ok':'no')+'"><b>'+(allOk?'Отлично, весь текст собран!':'Верно '+good+' из '+total)+'</b><span class="corr">'+esc(corrText.replace(/[\[\]]/g,''))+'</span>'+(it.why?'<span class="why">'+esc(it.why)+'</span>':'')+'</div>'));
      $$('button', wrap).forEach(b => b.disabled = true);
      api.onAnswer(idx, allOk, given, it, good, total);
    };
    return wrap;
  }

  /* ---------- write ---------- */
  if (ex.type === 'write'){
    wrap.innerHTML = '<div class="ex-q">'+it.q+((it.hint||ex.hint)?'<span class="ru-part">'+esc(it.hint||ex.hint)+'</span>':'')+'</div>'+
      '<textarea placeholder="Пиши здесь…" spellcheck="false"></textarea>'+
      '<div class="row" style="margin-top:8px"><button type="button" class="btn primary" data-check>Проверить себя</button>'+
      '<button type="button" class="btn ghost" data-model>Показать образец</button><span class="chip" data-cnt>0 симв.</span></div>';
    const ta = $('textarea', wrap);
    ta.addEventListener('input', () => { $('[data-cnt]', wrap).textContent = ta.value.trim().length + ' симв.'; });
    $('[data-check]', wrap).onclick = () => {
      if (answered) return;
      given = ta.value.trim();
      const r = textOk(given, it.kw, it.min || 60);
      finish(r.ok, null, r.ok ? 'Хорошо: длина и обязательные конструкции на месте. Сверь свой текст с образцом ниже.' : r.why);
      if (r.ok && it.model) wrap.appendChild(el('<div class="fb ok"><span class="why"><b>Образец:</b> '+esc(it.model)+'</span></div>'));
    };
    $('[data-model]', wrap).onclick = () => {
      if (!it.model) return;
      const box = $('.fb.model', wrap) || el('<div class="fb ok model"><span class="why"></span></div>');
      box.querySelector('.why').innerHTML = '<b>Образец:</b> ' + esc(it.model);
      if (!box.parentNode) wrap.appendChild(box);
    };
    return wrap;
  }

  wrap.innerHTML = '<div class="muted">Неизвестный тип задания: '+esc(ex.type)+'</div>';
  return wrap;
}

/* --- карточка упражнения --- */
function renderExercise(l, ex, exIdx, opts){
  opts = opts || {};
  let _apiRef = null;
  const card = el('<section class="card pad theory" data-ex="'+exIdx+'"></section>');
  const items = ex.items || [];
  const st = S.lessons[l.id] && S.lessons[l.id].ex && S.lessons[l.id].ex[exIdx];
  const total = items.length;
  const done = st ? (st.done || 0) : 0;
  card.innerHTML =
    '<div class="th" data-toggle style="border:0;padding:0 0 12px;margin-bottom:12px;border-bottom:1px solid var(--border2);border-radius:0">'+
      '<span class="ex-type">'+esc(EX_TYPE_NAME[ex.type]||ex.type)+'</span>'+
      '<h3 style="flex:1">'+esc(ex.title)+'</h3>'+
      (st && st.passed ? '<span class="chip ok">'+ic('check')+' пройдено</span>' : (done? '<span class="chip warn">'+done+'/'+total+'</span>':'<span class="chip">'+total+' '+plural(total,'задание','задания','заданий')+'</span>'))+
      '<button class="btn ghost sm" data-reset title="Начать заново">'+ic('refresh')+'</button>'+
    '</div>'+
    '<div class="body"></div>';
  const body = $('.body', card);
  let correct = 0, answeredN = 0, wrongItems = [];

  function build(){
    body.innerHTML = '';
    correct = 0; answeredN = 0; wrongItems = [];
    const api = {
      onAnswer(idx, isOk, givenAns, it, partOk, partTotal){
        answeredN++;
        if (isOk) correct++; else wrongItems.push(idx);
        S.stats.answers += (partTotal || 1);
        S.stats.correct += (partOk != null ? partOk : (isOk ? 1 : 0));
        if (!opts.silent) bumpToday(partTotal || 1);
        const stx = lessonState(l.id);
        stx.ex[exIdx] = stx.ex[exIdx] || { done:0, best:0, total, passed:false };
        stx.ex[exIdx].done = answeredN;
        if (answeredN >= total){
          const best = Math.max(correct, stx.ex[exIdx].best||0);
          stx.ex[exIdx].best = best;
          stx.ex[exIdx].passed = best / total >= 0.8;
          if (stx.ex[exIdx].passed) stx.ts = Date.now();
        }
        stx.ts = Date.now();
        save();
        updateFoot();
        if (answeredN >= total) showResult();
      }
    };
    _apiRef = api;
    items.forEach((it, i) => body.appendChild(renderItem(ex, it, i, api)));
    const foot = el('<div class="ex-foot"></div>');
    body.appendChild(foot);
    card._foot = foot;
    updateFoot();
  }
  function updateFoot(){
    const foot = card._foot; if (!foot) return;
    const stx = (S.lessons[l.id]||{}).ex||{};
    const e = stx[exIdx] || {done:0,best:0,total,passed:false};
    foot.innerHTML =
      '<span class="ex-score">'+answeredN+' / '+total+'</span>'+
      '<span class="chip '+(e.passed?'ok':'')+'">лучший результат: '+(e.best||0)+'/'+total+(e.passed?' • зачтено':' • нужно '+Math.ceil(total*0.8)+'/'+total)+'</span>'+
      '<div class="spacer"></div>'+
      (wrongItems.length && answeredN>=total ? '<button class="btn sm" data-retry-wrong>Повторить ошибки ('+wrongItems.length+')</button>' : '')+
      '<button class="btn ghost sm" data-reset>Сбросить</button>';
    $('[data-reset]', foot).onclick = () => build();
    const rw = $('[data-retry-wrong]', foot);
    if (rw) rw.onclick = () => {
      wrongItems.forEach(i => { const n = body.querySelector('[data-idx="'+i+'"]'); if (n) { const fresh = renderItem(ex, items[i], i, _apiRef); n.replaceWith(fresh); } });
      wrongItems = [];
    };
  }
  function showResult(){
    if ($('.ex-result', body)) return;
    const passed = correct / total >= 0.8;
    body.appendChild(el(
      '<div class="ex-result '+(passed?'pass':'fail')+'">'+
      '<div class="big">'+correct+' / '+total+'</div>'+
      '<div style="font-weight:700;margin:4px 0 10px">'+(passed ? (correct===total?'Идеально! Упражнение засчитано.':'Упражнение засчитано (нужно 80%).') : 'Нужно '+Math.ceil(total*0.8)+' из '+total+' — попробуй ещё раз.')+'</div>'+
      '<div class="row" style="justify-content:center"><button class="btn '+(passed?'':'primary')+'" data-again>Пройти заново</button>'+
      (passed && opts.onNext ? '<button class="btn primary" data-next>Дальше '+ic('arrow')+'</button>' : '')+'</div></div>'));
    $('[data-again]', body).onclick = () => build();
    const nx = $('[data-next]', body); if (nx) nx.onclick = opts.onNext;
    if (passed && !opts.silent) { /* тихий режим для тестов */ }
  }
  $('[data-toggle]', card).onclick = e => {
    if (e.target.closest('button[data-reset]')) return;
    body.classList.toggle('hidden');
  };
  $('[data-reset]', card).onclick = e => { e.stopPropagation(); build(); };
  build();
  return card;
}

function collectTestPool(lessonIds, perLesson){
  const pool = [];
  lessonIds.forEach(id => {
    const l = lessonById(id); if (!l) return;
    (l.exercises||[]).forEach(ex => {
      if (ex.type === 'write' || ex.type === 'match' || ex.type === 'cloze') return;
      (ex.items||[]).forEach(it => pool.push({ l, ex, it }));
    });
  });
  return shuffle(pool);
}
function runTest(cfg){
  // cfg: {id,title,pool,limit,seconds,onDone}
  const pool = cfg.pool.slice(0, cfg.limit || cfg.pool.length);
  const root = $('#main');
  let cur = 0, answers = new Array(pool.length).fill(null), t0 = Date.now(), timer = null, gen = 0;
  const wrap = el('<div></div>');
  root.innerHTML = ''; root.appendChild(wrap);

  function render(){
    const myGen = ++gen;
    const stale = () => myGen !== gen;
    const q = pool[cur], ex = q.ex, it = q.it;
    const secsLeft = cfg.seconds ? Math.max(0, cfg.seconds - Math.floor((Date.now()-t0)/1000)) : null;
    wrap.innerHTML =
      '<div class="row between" style="margin-bottom:12px">'+
        '<div><div class="badge">'+esc(cfg.title)+'</div><h2 style="margin:2px 0 0">Вопрос '+(cur+1)+' из '+pool.length+'</h2></div>'+
        '<div class="row">'+(secsLeft!=null?'<span class="chip warn" data-timer>'+ic('clock')+' <span>'+Math.floor(secsLeft/60)+':'+pad2(secsLeft%60)+'</span></span>':'')+
        '<button class="btn ghost sm" data-quit>Выйти</button></div>'+
      '</div>'+
      '<div class="progress" style="margin-bottom:16px"><i style="width:'+pct(cur+1,pool.length)+'%"></i></div>'+
      '<div class="qnav">'+pool.map((p,i)=>'<button data-go="'+i+'" class="'+(i===cur?'cur':(answers[i]==null?'':(answers[i].ok?'ok':'no')))+'">'+(i+1)+'</button>').join('')+'</div>'+
      '<div class="card pad" id="qbox"></div>'+
      '<div class="row between" style="margin-top:14px"><button class="btn" data-prev '+(cur===0?'disabled':'')+'>Назад</button>'+
      (cur===pool.length-1 ? '<button class="btn primary" data-finish>Завершить тест</button>' : '<button class="btn primary" data-next>Дальше '+ic('arrow')+'</button>')+'</div>';
    const box = $('#qbox', wrap);
    box.appendChild(el('<div class="ex-item" style="background:transparent;border:0;padding:0"></div>'));
    const holder = box.firstChild;
    const api = { silent: true, onAnswer(i, isOk, given, item, partOk, partTotal){
      answers[cur] = { ok:isOk, given, item, ex, l:q.l };
      const fn = $('[data-finish]', wrap);
      if (fn) fn.classList.add('primary');
      setTimeout(() => { if (stale()) return; if (cur < pool.length-1){ cur++; render(); } }, 300);
    } };
    const node = renderItem(ex, it, 0, api);
    node.classList.remove('ex-item'); node.style.background='transparent'; node.style.border='0'; node.style.padding='0';
    holder.replaceWith(node);
    $$('[data-go]', wrap).forEach(b => b.onclick = () => { if (stale()) return; cur = +b.dataset.go; render(); });
    $('[data-prev]', wrap).onclick = () => { if (stale()) return; cur = Math.max(0, cur-1); render(); };
    const nx = $('[data-next]', wrap); if (nx) nx.onclick = () => { if (stale()) return; cur = Math.min(pool.length-1, cur+1); render(); };
    const fin = $('[data-finish]', wrap); if (fin) fin.onclick = () => { if (stale()) return; finish(false); };
    $('[data-quit]', wrap).onclick = () => { clearInterval(timer); confirmDialog('Выйти из теста?','Результат не будет сохранён.', () => route()); };
    wrap.scrollIntoView({block:'start'});
  }
  function finish(byTimer){
    clearInterval(timer);
    const answered = answers.filter(a => a).length;
    const correct = answers.filter(a => a && a.ok).length;
    const score = pct(correct, pool.length);
    const secs = Math.round((Date.now()-t0)/1000);
    if (cfg.onDone) cfg.onDone({ correct, total: pool.length, score, answers, secs, byTimer });
    renderResult({ correct, total: pool.length, score, answers, secs, byTimer });
  }
  function renderResult(r){
    const pass = r.score >= (cfg.pass || 70);
    const mistakes = [];
    r.answers.forEach((a,i) => { if (a && !a.ok) mistakes.push({ i, a }); });
    pool.forEach((q,i) => { if (!r.answers[i]) mistakes.push({ i, a:{ ok:false, given:'— нет ответа —', item:q.it, ex:q.ex, l:q.l } }); });
    const wrap2 = $('#main'); wrap2.innerHTML = '';
    const box = el('<div></div>'); wrap2.appendChild(box);
    box.innerHTML =
      '<div class="card pad test-hero">'+
        '<div class="badge">'+esc(cfg.title)+'</div>'+
        '<div class="score-ring">'+ring(r.score, pass?'var(--success)':'var(--warn)')+'</div>'+
        '<div class="big">'+r.score+'%</div>'+
        '<p class="muted" style="margin:6px 0 14px">Правильных ответов: <b>'+r.correct+' из '+r.total+'</b> • время: '+Math.floor(r.secs/60)+' мин '+pad2(r.secs%60)+' с'+(r.byTimer?' • <b>время вышло</b>':'')+'</p>'+
        '<div class="chip '+(pass?'ok':'warn')+'" style="font-size:.9rem;padding:6px 14px">'+(pass?'Тест пройден 🎉':'Нужно '+ (cfg.pass||70) +'% — повтори теорию и попробуй снова')+'</div>'+
        '<div class="row" style="justify-content:center;margin-top:16px"><a class="btn" href="#'+esc(cfg.back||'/')+'">К урокам</a><button class="btn primary" data-again>Пройти заново</button></div>'+
      '</div>'+
      (mistakes.length ? '<div class="sec-h"><h2>Разбор ошибок ('+mistakes.length+')</h2></div><div class="card pad" id="mist"></div>' : '<div class="empty"><div class="big">🏆</div>Ни одной ошибки!</div>');
    $('[data-again]', box).onclick = () => runTest(cfg);
    const mist = $('#mist', box);
    if (mist) mistakes.forEach(m => {
      const it = m.a.item, ex = m.a.ex;
      let correct = '';
      if (ex.type === 'mc') correct = it.answer;
      else if (ex.type === 'tf') correct = it.answer ? 'Верно' : 'Неверно';
      else if (ex.type === 'wo') correct = Array.isArray(it.a)? it.a.join(' ') : it.a;
      else correct = (Array.isArray(it.a)? it.a[0] : String(it.a).split('|')[0]);
      mist.appendChild(el('<div class="mistake"><div class="badge">Урок '+(m.a.l? m.a.l.id : '?')+' • '+esc(EX_TYPE_NAME[ex.type]||ex.type)+'</div>'+
        '<div class="q" style="margin:4px 0">'+it.q+'</div>'+
        '<div>Твой ответ: <span class="a">'+esc(String(m.a.given||'—'))+'</span></div>'+
        '<div>Правильно: <span class="c">'+esc(correct)+'</span></div>'+
        (it.why?'<div class="muted small" style="margin-top:4px">'+esc(it.why)+'</div>':'')+'</div>'));
    });
    window.scrollTo({top:0,behavior:'smooth'});
  }
  if (cfg.seconds){
    timer = setInterval(() => {
      const left = cfg.seconds - Math.floor((Date.now()-t0)/1000);
      const t = $('[data-timer]', wrap);
      if (t) t.querySelector('span').textContent = left>0 ? Math.floor(left/60)+':'+pad2(left%60) : '0:00';
      if (left <= 0) finish(true);
    }, 1000);
  }
  render();
}
function ring(p, color){
  const r = 54, c = 2*Math.PI*r;
  return '<svg viewBox="0 0 132 132" width="132" height="132"><circle cx="66" cy="66" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="11"/>'+
    '<circle cx="66" cy="66" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p/100))+'" transform="rotate(-90 66 66)"/></svg>';
}

/* ---------- Урок ---------- */
function viewLesson(id, tab){
  const l = lessonById(id);
  if (!l) { setHTML($('#main'), '<div class="empty"><div class="big">🤔</div>Урок не найден</div>'); return; }
  tab = tab || 'theory';
  S.lastLesson = l.id; S.lastTab = tab; save();
  const stt = lessonStatus(l), p = lessonProgress(l);
  const prev = LESSONS[Math.max(0, LESSONS.indexOf(l)-1)], next = LESSONS[LESSONS.indexOf(l)+1];
  const tabs = [
    ['theory','Теория',(l.theory||[]).length],
    ['vocab','Слова',(l.vocab||[]).length],
    ['practice','Практика',exCount(l)],
    ['test','Итоговый тест', S.lessons[l.id] && S.lessons[l.id].test ? S.lessons[l.id].test.score+'%' : null]
  ];
  setHTML($('#main'),
    '<div class="l-head">'+
      '<div class="num">'+l.id+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="crumbs">Модуль '+l.moduleIndex+' • '+esc(l.moduleTitle)+'</div>'+
        '<h1>'+esc(l.title)+'</h1>'+
        '<div class="row small muted">'+(stt==='done'?'<span class="chip ok">'+ic('check')+' урок пройден</span>':'<span class="chip">'+p+'% готово</span>')+
          '<span>'+(l.vocab||[]).length+' слов</span><span>'+exCount(l)+' упражнений</span>'+
          (l.minutes?'<span>≈ '+l.minutes+' мин</span>':'')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="tabs">'+tabs.map(t => '<a class="tab '+(t[0]===tab?'active':'')+'" href="#/lesson/'+l.id+'/'+t[0]+'">'+esc(t[1])+(t[2]!=null?'<span class="cnt">'+t[2]+'</span>':'')+'</a>').join('')+'</div>'+
    '<div id="tab-body"></div>'+
    '<div class="row between" style="margin-top:22px">'+
      (LESSONS.indexOf(l)>0 ? '<a class="btn" href="#/lesson/'+prev.id+'/'+tab+'">← Урок '+prev.id+'</a>' : '<a class="btn" href="#/">← Главная</a>')+
      (next ? '<a class="btn primary" href="#/lesson/'+next.id+'/'+tab+'">Урок '+next.id+' '+ic('arrow')+'</a>' : '<a class="btn primary" href="#/tests">К экзамену '+ic('arrow')+'</a>')+
    '</div>'
  );
  // мягкий «замок» модуля 5: предупреждение до сдачи экзамена по урокам 1–30
  if (l.moduleIndex >= 5) {
    const ex = (S.tests||{})['exam1_30'];
    const passed = ex && ex.score >= 70;
    if (!passed) {
      const b = el('<div class="banner">'+ic('lock')+' Модуль 5 рассчитан на уровень Intermediate+. Рекомендуемый порог — итоговый экзамен по урокам 1–30 (70% и выше). '+
        (ex ? 'Твой результат: <b>'+ex.score+'%</b>. ' : '')+
        '<a class="btn sm" href="#/tests">Сдать экзамен</a></div>');
      $('#main').insertBefore(b, $('#tab-body') ? $('#tab-body').previousSibling : null);
    }
  }
  const body = $('#tab-body');
  if (tab === 'theory') renderTheory(l, body);
  else if (tab === 'vocab') renderVocab(l, body);
  else if (tab === 'practice') renderPractice(l, body);
  else if (tab === 'test') renderLessonTest(l, body);
  window.scrollTo({top:0});
}

function renderTheory(l, box){
  const blocks = l.theory || [];
  box.innerHTML = '<div class="row between" style="margin-bottom:12px"><div class="muted small">Разверни блоки и читай по порядку. Примеры можно прослушать — нажми на динамик.</div>'+
    '<div class="row"><button class="btn ghost sm" data-all>Развернуть все</button><a class="btn soft sm" href="#/lesson/'+l.id+'/vocab">К словам '+ic('arrow')+'</a></div></div>';
  blocks.forEach((t, i) => {
    const node = el('<section class="card theory"><div class="th"><span class="k">'+(i+1)+'</span><h3 style="flex:1">'+esc(t.title)+'</h3>'+ic('chev','chev-i')+'</div><div class="tb">'+t.html+'</div></section>');
    if (i > 0) node.querySelector('.tb').classList.add('hidden');
    node.querySelector('.th').onclick = e => {
      if (e.target.closest('[data-say]')) return;
      node.querySelector('.tb').classList.toggle('hidden');
      node.querySelector('.chev-i').style.transform = node.querySelector('.tb').classList.contains('hidden') ? '' : 'rotate(90deg)';
    };
    node.querySelector('.chev-i').style.transform = node.querySelector('.tb').classList.contains('hidden') ? '' : 'rotate(90deg)';
    // озвучка примеров
    node.querySelectorAll('.eg .t, .formula').forEach(n => {
      const txt = n.textContent.replace(/\s+/g,' ').trim();
      if (txt.length > 4 && txt.length < 200 && /[a-zA-Z]/.test(txt)){
        const b = el(speakBtn(txt)); b.style.marginLeft='8px'; b.style.verticalAlign='middle';
        n.appendChild(b);
      }
    });
    box.appendChild(node);
  });
  box.querySelector('[data-all]').onclick = () => {
    const all = $$('.tb', box), anyHidden = all.some(n => n.classList.contains('hidden'));
    all.forEach(n => n.classList.toggle('hidden', !anyHidden));
    $$('.chev-i', box).forEach(c => c.style.transform = anyHidden ? 'rotate(90deg)' : '');
  };
}

function renderVocab(l, box){
  const words = l.vocab || [];
  let mode = 'list', filter = '';
  box.innerHTML =
    '<div class="v-tools">'+
      '<div class="seg" data-seg>'+
        '<button data-m="list" class="active">'+ic('list')+' Список</button>'+
        '<button data-m="cards">'+ic('cards')+' Карточки</button>'+
        '<button data-m="quiz">'+ic('target')+' Тест EN→RU</button>'+
        '<button data-m="type">'+ic('edit')+' Ввод RU→EN</button>'+
      '</div>'+
      '<div class="spacer"></div>'+
      '<input type="text" data-vf placeholder="Фильтр по словам…" style="max-width:190px;padding:7px 10px;font-size:.86rem">'+
      '<span class="chip" data-prog></span>'+
      '<button class="btn ghost sm" data-print title="Печать/сохранить список">'+ic('down')+'</button>'+
    '</div>'+
    '<div id="vbody"></div>';
  const vb = $('#vbody', box);
  function prog(){
    const learned = words.filter(w => srBoxOf(l.id, w[0]) >= 3).length;
    $('[data-prog]', box).innerHTML = ic('brain')+' выучено '+learned+' / '+words.length;
  }
  function drawList(){
    const f = filter.trim().toLowerCase();
    const rows = words.map((w,i) => {
      if (f && !(w[0].toLowerCase().includes(f) || w[1].toLowerCase().includes(f))) return '';
      const b = srBoxOf(l.id, w[0]);
      return '<tr><td class="small muted">'+(i+1)+'</td>'+
        '<td class="w"><span class="sr-badge" data-b="'+b+'" title="Уровень запоминания: '+b+'/6"></span> '+esc(w[0])+ (w[2]?' <span class="muted small">['+esc(w[2])+']</span>':'') +'</td>'+
        '<td class="tr">'+esc(w[1])+'</td>'+
        '<td class="ex c-ex">'+(w[3]?esc(w[3]):'')+'</td>'+
        '<td>'+(w[3]?speakBtn(w[3]):speakBtn(w[0]))+'</td></tr>';
    }).join('');
    vb.innerHTML = '<div class="card" style="overflow:auto"><table class="vocab"><thead><tr><th>#</th><th>Слово</th><th>Перевод</th><th class="c-ex">Пример</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="row" style="margin-top:10px"><span class="small muted">Уровни: </span>'+
      [1,2,3,4,5].map(b=>'<span class="chip"><span class="sr-badge" data-b="'+b+'"></span> '+b+'</span>').join('')+
      '<span class="small muted">— чем выше, тем реже повторяется слово.</span></div>';
  }
  function drawCards(){
    const deck = words.map(w => ({ w }));
    let i = 0, flipped = false;
    const draw = () => {
      const w = deck[i].w;
      vb.innerHTML = '<div class="fc-wrap">'+
        '<div class="fc-count">Карточка '+(i+1)+' из '+deck.length+' • уровень '+(srBoxOf(l.id,w[0])||0)+'/6</div>'+
        '<div class="fc" id="fc"><div class="fc-inner">'+
          '<div class="fc-face"><div class="fc-hint">Слово</div><div class="fc-word">'+esc(w[0])+'</div>'+
            '<button class="btn ghost sm" data-say="'+esc(w[3]||w[0])+'">'+ic('speaker')+' прослушать</button><div class="fc-hint">нажми на карточку</div></div>'+
          '<div class="fc-face fc-back"><div class="fc-hint">Перевод</div><div class="fc-tr">'+esc(w[1])+'</div>'+
            (w[3]?'<div class="fc-ex">'+esc(w[3])+'</div>':'')+'</div>'+
        '</div></div>'+
        '<div class="fc-rate">'+
          '<button class="btn danger" data-r="again">Не помню</button>'+
          '<button class="btn" data-r="hard">С трудом</button>'+
          '<button class="btn primary" data-r="good">Помню</button>'+
          '<button class="btn soft" data-r="easy">Легко</button>'+
        '</div>'+
        '<div class="row small muted">Клавиши: <kbd>Space</kbd> — перевернуть, <kbd>1…4</kbd> — оценка</div>'+
      '</div>';
      const fc = $('#fc', vb);
      fc.onclick = () => { fc.classList.toggle('flipped'); flipped = fc.classList.contains('flipped'); };
      $$('[data-r]', vb).forEach(b => b.onclick = () => rate(b.dataset.r));
      const onKey = e => {
        if (routeState.view !== 'lesson' || routeState.tab !== 'vocab') { document.removeEventListener('keydown', onKey); return; }
        if (e.code === 'Space'){ e.preventDefault(); fc.classList.toggle('flipped'); flipped = true; }
        if (flipped && ['1','2','3','4'].includes(e.key)) rate(['again','hard','good','easy'][+e.key-1]);
      };
      document.addEventListener('keydown', onKey);
    };
    function rate(g){
      const w = deck[i].w;
      srRate(l.id, w[0], g);
      prog();
      i++;
      if (i >= deck.length){
        vb.innerHTML = '<div class="card pad center"><div style="font-size:2.4rem">✅</div><h3>Колода пройдена</h3><p class="muted">Слова распределены по коробкам повторения. Следующий повтор придёт автоматически.</p>'+
          '<div class="row" style="justify-content:center"><button class="btn" data-again>Ещё раз</button><a class="btn primary" href="#/lesson/'+l.id+'/practice">К практике '+ic('arrow')+'</a></div></div>';
        $('[data-again]', vb).onclick = () => { i = 0; draw(); };
      } else draw();
    }
    draw();
  }
  function drawQuiz(){
    let i = 0, right = 0;
    const deck = shuffle(words.slice());
    const draw = () => {
      if (i >= deck.length){
        vb.innerHTML = '<div class="card pad center"><div style="font-size:2.4rem">'+(right===deck.length?'🏆':'🎯')+'</div><h3>'+right+' из '+deck.length+'</h3><p class="muted">'+(pct(right,deck.length)>=80?'Отличный результат!':'Повтори карточки и попробуй снова.')+'</p><button class="btn primary" data-again>Ещё раз</button></div>';
        $('[data-again]', vb).onclick = () => { i=0; right=0; draw(); };
        return;
      }
      const w = deck[i];
      const others = shuffle(words.filter(x => x[0] !== w[0])).slice(0,3).map(x => x[1]);
      const opts = shuffle([w[1]].concat(others));
      vb.innerHTML = '<div class="card pad center">'+
        '<div class="fc-count">Вопрос '+(i+1)+' из '+deck.length+' • верно '+right+'</div>'+
        '<div class="vq-word">'+esc(w[0])+'</div>'+
        '<button class="btn ghost sm" data-say="'+esc(w[3]||w[0])+'">'+ic('speaker')+' прослушать</button>'+
        '<div class="grid g2" style="margin-top:16px">'+opts.map(o=>'<button class="vq-opt" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>';
      $$('.vq-opt', vb).forEach(b => b.onclick = () => {
        const ok = b.dataset.v === w[1];
        $$('.vq-opt', vb).forEach(x => { x.disabled = true; if (x.dataset.v === w[1]) x.classList.add('right'); });
        if (!ok) b.classList.add('bad');
        if (ok) { right++; S.stats.correct++; } S.stats.answers++; bumpToday();
        srRate(l.id, w[0], ok ? 'good' : 'again');
        save(); prog();
        setTimeout(() => { i++; draw(); }, ok ? 550 : 1500);
      });
    };
    draw();
  }
  function drawType(){
    let i = 0, right = 0;
    const deck = shuffle(words.slice());
    const draw = () => {
      if (i >= deck.length){
        vb.innerHTML = '<div class="card pad center"><div style="font-size:2.4rem">✍️</div><h3>'+right+' из '+deck.length+'</h3><p class="muted">Ввод с клавиатуры — самая строгая проверка spelling.</p><button class="btn primary" data-again>Ещё раз</button></div>';
        $('[data-again]', vb).onclick = () => { i=0; right=0; draw(); };
        return;
      }
      const w = deck[i];
      vb.innerHTML = '<div class="card pad center">'+
        '<div class="fc-count">Слово '+(i+1)+' из '+deck.length+' • верно '+right+'</div>'+
        '<div class="fc-tr" style="margin:14px 0 4px">'+esc(w[1])+'</div>'+
        (w[2]?'<div class="small muted">['+esc(w[2])+']</div>':'')+
        '<div class="row" style="justify-content:center;margin-top:14px"><input type="text" id="ty" style="max-width:340px;text-align:center;font-family:var(--eng);font-size:1.2rem" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="напиши по-английски"><button class="btn primary" data-ok>Проверить</button></div>'+
        '<div id="tfb"></div></div>';
      const inp = $('#ty', vb); inp.focus();
      const check = () => {
        const v = inp.value.trim(); if (!v) return;
        const ok = answersOk(v, [w[0]]);
        S.stats.answers++; bumpToday(); if (ok){ S.stats.correct++; right++; }
        srRate(l.id, w[0], ok ? 'good' : 'again');
        save(); prog();
        inp.disabled = true; $('[data-ok]', vb).disabled = true;
        $('#tfb', vb).innerHTML = '<div class="fb '+(ok?'ok':'no')+'"><b>'+(ok?'Верно!':'Правильный ответ:')+'</b><span class="corr">'+esc(w[0])+'</span>'+(w[3]?'<span class="why">'+esc(w[3])+'</span>':'')+'</div>';
        setTimeout(() => { i++; draw(); }, ok ? 700 : 2000);
      };
      $('[data-ok]', vb).onclick = check;
      inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); check(); } });
    };
    draw();
  }
  function draw(){
    prog();
    if (mode === 'list') drawList();
    else if (mode === 'cards') drawCards();
    else if (mode === 'quiz') drawQuiz();
    else drawType();
  }
  $$('[data-seg] button', box).forEach(b => b.onclick = () => {
    $$('[data-seg] button', box).forEach(x => x.classList.remove('active'));
    b.classList.add('active'); mode = b.dataset.m; draw();
  });
  $('[data-print]', box).onclick = () => window.print();
  $('[data-vf]', box).oninput = e => { filter = e.target.value; if (mode!=='list'){ mode='list'; $$('[data-seg] button', box).forEach(x=>x.classList.toggle('active', x.dataset.m==='list')); } drawList(); prog(); };
  draw();
}

      '<div class="badge">Итоговая проверка урока '+l.id+'</div>'+

      (st ? '<div class="row" style="justify-content:center;margin-bottom:14px"><span class="chip '+(st.score>=70?'ok':'warn')+'">лучший результат: '+st.score+'% ('+st.correct+'/'+st.total+')</span><span class="chip">'+fmtDate(st.ts)+'</span></div>' : '')+

  $('[data-start]', box).onclick = () => {
    const pool = collectTestPool([l.id]);
    if (pool.length < 5) return toast('В этом уроке пока мало заданий для теста','no');
    runTest({
      id:'lesson'+l.id, title:'Урок '+l.id+'. '+l.title, pool: shuffle(pool), limit: Math.min(12, pool.length),
      seconds: 12*60, pass: 70, back:'/lesson/'+l.id+'/test',
      onDone: r => {
        const ls = lessonState(l.id);
        if (!ls.test || r.score > ls.test.score) ls.test = { score:r.score, correct:r.correct, total:r.total, ts:Date.now() };
        save();
      }
    });
  };
}

function startVocabSession(kind){
  let cards = [];
  if (kind === 'due') { cards = dueCards().slice(0, 40); if (!cards.length) cards = newCards(null, 20); }
  else if (kind === 'new') cards = newCards(null, 20);
  else { // blitz
    const all = [];
    LESSONS.forEach(l => (l.vocab||[]).forEach(w => { if (srBoxOf(l.id,w[0])>0 || Math.random()<0.3) all.push({l,w}); }));
    return runBlitz(shuffle(all).slice(0,30));
  }
  if (!cards.length) return toast('Нет слов для повторения — сначала пройди уроки','no');
  runFlashSession(cards.map(c => ({ l:c.l, w:c.w })));
}
function runFlashSession(cards){
  let i = 0, flipped = false;
  const root = $('#main');
  const draw = () => {
    if (i >= cards.length){
      root.innerHTML = '<div class="card pad center" style="padding:34px"><div style="font-size:3rem">🎉</div><h2>Сессия завершена</h2><p class="muted">Повторено карточек: '+cards.length+'. Следующие повторы придут автоматически.</p>'+
        '<div class="row" style="justify-content:center"><a class="btn primary" href="#/vocab">К тренажёру</a><a class="btn" href="#/">На главную</a></div></div>';
      return;
    }
    const c = cards[i], w = c.w;
    root.innerHTML = '<div class="fc-wrap" style="padding-top:20px">'+
      '<div class="row between" style="width:100%;max-width:560px"><a class="btn ghost sm" href="#/vocab">← Выйти</a><span class="fc-count">'+(i+1)+' / '+cards.length+'</span></div>'+
      '<div class="progress" style="width:100%;max-width:560px"><i style="width:'+pct(i,cards.length)+'%"></i></div>'+
      '<div class="fc" id="fc"><div class="fc-inner">'+
        '<div class="fc-face"><div class="chip info">Урок '+c.l.id+'</div><div class="fc-word">'+esc(w[0])+'</div>'+
          '<button class="btn ghost sm" data-say="'+esc(w[3]||w[0])+'">'+ic('speaker')+' прослушать</button><div class="fc-hint">нажми, чтобы перевернуть</div></div>'+
        '<div class="fc-face fc-back"><div class="fc-tr">'+esc(w[1])+'</div>'+(w[3]?'<div class="fc-ex">'+esc(w[3])+'</div>':'')+'</div>'+
      '</div></div>'+
      '<div class="fc-rate"><button class="btn danger" data-r="again">Не помню</button><button class="btn" data-r="hard">С трудом</button><button class="btn primary" data-r="good">Помню</button><button class="btn soft" data-r="easy">Легко</button></div>'+
      '<div class="small muted"><kbd>Space</kbd> — перевернуть • <kbd>1</kbd>…<kbd>4</kbd> — оценка</div></div>';
    const fc = $('#fc');
    const onKey = e => {
      if (!$('#fc')) { document.removeEventListener('keydown', onKey); return; }
      if (e.code === 'Space'){ e.preventDefault(); fc.classList.toggle('flipped'); flipped = fc.classList.contains('flipped'); }
      else if (flipped && '1234'.includes(e.key)){ rate(['again','hard','good','easy'][+e.key-1]); }
    };
    document.addEventListener('keydown', onKey);
    fc.onclick = () => { fc.classList.toggle('flipped'); flipped = fc.classList.contains('flipped'); };
    $$('[data-r]').forEach(b => b.onclick = () => rate(b.dataset.r));
  };
  function rate(g){
    const c = cards[i];
    srRate(c.l.id, c.w[0], g);
    if (g === 'again' && cards.length < 80) cards.push({ l:c.l, w:c.w }); // ошибся — в конец колоды
    i++; flipped = false; draw();
  }
  draw();
}
function runBlitz(cards){
  if (!cards.length) return toast('Нет слов','no');
  let i = 0, right = 0;
  const allWords = []; LESSONS.forEach(l => (l.vocab||[]).forEach(w => allWords.push({l,w})));
  const root = $('#main');
  const draw = () => {
    if (i >= cards.length){
      root.innerHTML = '<div class="card pad center" style="padding:34px"><div style="font-size:3rem">'+(pct(right,cards.length)>=80?'🏆':'💪')+'</div><h2>'+right+' из '+cards.length+'</h2>'+
        '<p class="muted">Точность '+pct(right,cards.length)+'%</p><div class="row" style="justify-content:center"><button class="btn primary" data-again>Ещё раз</button><a class="btn" href="#/vocab">К тренажёру</a></div></div>';
      $('[data-again]', root).onclick = () => startVocabSession('blitz');
      return;
    }
    const c = cards[i], w = c.w;
    const opts = shuffle([w[1]].concat(shuffle(allWords.filter(x=>x.w[1]!==w[1])).slice(0,3).map(x=>x.w[1])));
    root.innerHTML = '<div class="card pad center" style="max-width:640px;margin:20px auto">'+
      '<div class="row between"><a class="btn ghost sm" href="#/vocab">← Выйти</a><span class="fc-count">'+(i+1)+' / '+cards.length+' • верно '+right+'</span></div>'+
      '<div class="progress" style="margin:10px 0 18px"><i style="width:'+pct(i,cards.length)+'%"></i></div>'+
      '<div class="vq-word">'+esc(w[0])+'</div>'+
      '<button class="btn ghost sm" data-say="'+esc(w[3]||w[0])+'">'+ic('speaker')+'</button>'+
      '<div class="grid g2" style="margin-top:16px">'+opts.map(o=>'<button class="vq-opt" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div></div>';
    $$('.vq-opt').forEach(b => b.onclick = () => {
      const ok = b.dataset.v === w[1];
      $$('.vq-opt').forEach(x=>{x.disabled=true; if(x.dataset.v===w[1])x.classList.add('right');});
      if(!ok) b.classList.add('bad');
      if(ok) right++;
      srRate(c.l.id, w[0], ok?'good':'again');
      S.stats.answers++; bumpToday(); if(ok)S.stats.correct++; save();
      setTimeout(()=>{i++;draw();}, ok?500:1400);
    });
  };
  draw();
}

    '<div class="card" id="gb">'+
      (shown.length ? shown.map((r,i)=>'<div class="gb-item" data-i="'+i+'"><span class="chip info nowrap">Урок '+r.l.id+'</span><span style="flex:1">'+hl(r.t.title, filt)+'</span>'+ic('chev')+'</div>').join('') : '<div class="empty">Ничего не найдено</div>')+
    '</div>'+
    '<div id="gprev" style="margin-top:14px"></div>'
  );
  const inp = $('#gq');
  inp.oninput = () => { const v = inp.value; history.replaceState(null,'','#/grammar'+(v?'?q='+encodeURIComponent(v):'')); clearTimeout(inp._t); inp._t = setTimeout(()=>{ const p = inp.selectionStart; viewGrammar(v); const n=$('#gq'); if(n){n.focus(); n.setSelectionRange(p,p);} }, 400); };
  $$('#gb [data-i]').forEach(n => n.onclick = () => {
    const r = shown[+n.dataset.i];
    $('#gprev').innerHTML = '';
    const node = el('<section class="card theory"><div class="th"><span class="k">'+r.l.id+'</span><h3 style="flex:1">'+esc(r.t.title)+'</h3><a class="btn ghost sm" href="#/lesson/'+r.l.id+'/theory">Открыть урок</a></div><div class="tb">'+r.t.html+'</div></section>');
    $('#gprev').appendChild(node);
    node.scrollIntoView({behavior:'smooth', block:'start'});
  });
}
function hl(text, q){
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i, i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}

      '<li style="margin:.4em 0"><b>Практика.</b> Вкладка «Практика»: пройди все упражнения. Каждое засчитывается при ≥ 80%.</li>'+
      '<li style="margin:.4em 0"><b>Итоговый тест.</b> 12 вопросов без подсказок, проходной 70%. Ошибки разбираются построчно.</li>'+
      '<li style="margin:.4em 0"><b>Каждый день.</b> Заходи в «Слова» — там ждут карточки, у которых подошёл срок. Это главный секрет запоминания.</li>'+
      '<li style="margin:.4em 0"><b>Контрольные точки.</b> После урока 16 — промежуточный тест, после урока 30 — итоговый экзамен, который открывает модуль 5.</li>'+
      '</ol>'+
      '<p class="small muted" style="margin-top:12px">Горячие клавиши: <kbd>Space</kbd> — перевернуть карточку, <kbd>1…4</kbd> — оценка или вариант ответа, <kbd>Enter</kbd> — проверить, <kbd>Esc</kbd> — закрыть окно.</p>'+
    '</div>'
  );
  $('#nm').oninput = e => { S.name = e.target.value.trim(); save(); };
  $$('#goal button').forEach(b => b.onclick = () => { S.goal = +b.dataset.g; save(); $$('#goal button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  $$('#acc button').forEach(b => b.onclick = () => { S.accent = b.dataset.a; save(); $$('#acc button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); Speech.say('Hello! Let\'s practise English together.'); });
  $('#th').onchange = e => { S.theme = e.target.checked ? 'dark' : 'light'; applyTheme(); save(); };
  $('#sp').onchange = e => { S.speech = e.target.checked; save(); if (S.speech) Speech.say('Sound is on.'); };
  $('#exp').onclick = () => {
    const blob = new Blob([JSON.stringify(S, null, 1)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'english-progress-'+dstr(Date.now())+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast('Файл с прогрессом сохранён','ok');
  };
  $('#imp').onclick = () => $('#file').click();
  $('#file').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const o = JSON.parse(r.result); if (!o.lessons) throw 0; S = Object.assign(DEFAULT_STATE(), o); applyTheme(); saveNow(); toast('Прогресс загружен','ok'); route(); } catch(err){ toast('Файл не похож на сохранённый прогресс','no'); } };
    r.readAsText(f);
  };
  $('#rst').onclick = () => confirmDialog('Сбросить весь прогресс?','Будут удалены отметки об уроках, уровни слов, серии и результаты тестов. Действие необратимо.', () => {
    Store.clear(); S = DEFAULT_STATE(); applyTheme(); saveNow(); toast('Прогресс сброшен'); route();
  }, 'Сбросить');
}

/* ---------- Поиск ---------- */
function viewSearch(q){
  q = (q||'').trim();
  const low = q.toLowerCase();
  const lres = q ? LESSONS.filter(l => (l.title+' '+(l.subtitle||'')).toLowerCase().includes(low)) : [];
  const wres = [];
  if (q) LESSONS.forEach(l => (l.vocab||[]).forEach(w => {
    if (w[0].toLowerCase().includes(low) || w[1].toLowerCase().includes(low)) wres.push({l,w});
  }));
  setHTML($('#main'),
    '<div class="badge">Поиск</div><h1 style="margin:2px 0 12px">Поиск по курсу</h1>'+
    '<input type="text" id="sq" placeholder="слово, перевод или тема урока…" value="'+esc(q)+'" autofocus style="max-width:520px">'+
    (q ? '<p class="muted small" style="margin-top:10px">Найдено уроков: '+lres.length+' • слов: '+wres.length+'</p>' : '')+
    (lres.length?'<div class="sec-h"><h2>Уроки</h2></div><div class="card">'+lres.map(l=>'<div class="lesson-row" data-lesson="'+l.id+'"><div class="n">'+l.id+'</div><div style="flex:1"><div class="lt">'+hl(l.title,low)+'</div><div class="ls">'+esc(l.moduleTitle)+'</div></div></div>').join('')+'</div>':'')+
    (wres.length?'<div class="sec-h"><h2>Слова</h2></div><div class="card" style="overflow:auto"><table class="vocab"><thead><tr><th>Слово</th><th>Перевод</th><th class="c-ex">Пример</th><th>Урок</th><th></th></tr></thead><tbody>'+
      wres.slice(0,120).map(r=>'<tr><td class="w">'+hl(r.w[0],low)+'</td><td class="tr">'+hl(r.w[1],low)+'</td><td class="ex c-ex">'+esc(r.w[3]||'')+'</td><td><a class="chip" href="#/lesson/'+r.l.id+'/vocab">'+r.l.id+'</a></td><td>'+(r.w[3]?speakBtn(r.w[3]):'')+'</td></tr>').join('')+'</tbody></table></div>':'')+
    (!q ? '<div class="empty"><div class="big">'+ic('search')+'</div>Введи слово или тему — например, <b>Present Perfect</b>, <b>invoice</b> или <b>артикли</b>.</div>' : '')
  );
  const inp = $('#sq');
  inp.oninput = () => { clearTimeout(inp._t); const v = inp.value; inp._t = setTimeout(()=>{ const p=v.length; history.replaceState(null,'','#/search?q='+encodeURIComponent(v)); viewSearch(v); const n=$('#sq'); if(n){n.focus(); n.setSelectionRange(p,p);} }, 350); };
  $$('[data-lesson]').forEach(n => n.onclick = () => { location.hash = '#/lesson/'+n.dataset.lesson+'/vocab'; });
}

/* ------------------------------------------------------------------ */
/* 10. Сайдбар + роутер                                                */
/* ------------------------------------------------------------------ */
const routeState = { view:'home', tab:'theory' };
let openMods = {};
function renderSidebar(){
  const cur = routeState;
  let h = '<div class="sb-head"><div class="logo">EN</div><div style="flex:1;min-width:0"><div class="sb-title">English Zero → Finance</div><div class="sb-sub">'+TOTAL_LESSONS+' уроков • '+(VOCAB_TOTAL)+' слов</div></div>'+
    '<button class="btn icon ghost" id="thm" title="Тема">'+ic(S.theme==='dark'?'sun':'moon')+'</button></div>';
  h += '<div class="sb-nav">';
  h += navItem('/', 'home', 'Главная', '', cur.view==='home');
  h += navItem('/vocab', 'cards', 'Слова', vocabDue()||'', cur.view==='vocab');
  h += navItem('/grammar', 'book', 'Грамматика', '', cur.view==='grammar');
  h += navItem('/tests', 'test', 'Тесты', '', cur.view==='tests');
  h += '<div style="margin:8px 10px"><input type="text" id="sbs" placeholder="Поиск…  (/)" style="padding:7px 10px;font-size:.86rem"></div>';
  MODULES.forEach(m => {
    let open = openMods[m.id];
    if (open === undefined) open = !!((cur.view==='lesson' && cur.lesson && cur.lesson.moduleId === m.id) || (cur.view==='module' && cur.mid===m.id) || m.index===1);
    openMods[m.id] = open;
    const p = moduleProgress(m);
    h += '<div class="nav-mod '+(open?'open':'')+'" data-mod="'+m.id+'"><span class="chev">'+ic('chev')+'</span><span class="num">'+m.index+'</span><span class="grow" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.short||m.title)+'</span><span class="pill">'+p+'%</span></div>';
    if (open){
      h += '<div class="nav-lessons">'+m.lessons.map(l => {
        const stt = lessonStatus(l);
        return '<button class="nav-lesson '+stt+' '+(cur.view==='lesson'&&cur.lesson&&cur.lesson.id===l.id?'active':'')+'" data-l="'+l.id+'"><span class="st">'+(stt==='done'?'✓':'')+'</span><span class="lb">'+l.id+'. '+esc(l.short||l.title)+'</span></button>';
      }).join('')+'</div>';
    }
  });
  h += '</div>';
  h += '<div class="sb-foot">'+
    '<div class="sb-streak"><span style="font-size:1.2rem">🔥</span><div style="flex:1"><div class="row between"><b>'+(S.streak.cur||0)+'</b><span class="small muted">'+courseProgress()+'% курса</span></div><div class="mini-bar"><i style="width:'+courseProgress()+'%"></i></div></div></div>'+
    '<div class="row">'+navItem('/settings','gear','Настройки','',cur.view==='settings')+'</div>'+
  '</div>';
  const sb = $('#sidebar'); sb.innerHTML = h;
  $('#thm').onclick = () => { S.theme = S.theme==='dark'?'light':'dark'; applyTheme(); save(); renderSidebar(); };
  $('#sbs').onkeydown = e => { if (e.key==='Enter'){ location.hash = '#/search?q='+encodeURIComponent(e.target.value); closeSidebar(); } };
  $$('.nav-mod', sb).forEach(n => n.onclick = () => {
    const id = n.dataset.mod;
    openMods[id] = !openMods[id];
    renderSidebar();
  });
  $$('.nav-lesson', sb).forEach(n => n.onclick = () => { location.hash = '#/lesson/'+n.dataset.l+'/'+(S.lastTab||'theory'); closeSidebar(); });
}
function navItem(href, icon, label, pill, active){
  return '<a class="nav-item '+(active?'active':'')+'" href="#'+href+'">'+ic(icon)+'<span class="grow">'+esc(label)+'</span>'+(pill?'<span class="pill">'+pill+'</span>':'')+'</a>';
}
function toggleSidebar(){ const open = !$('#sidebar').classList.contains('open'); $('#sidebar').classList.toggle('open', open); $('#scrim').hidden = !open; document.body.classList.toggle('sb-open', open); }
function closeSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').hidden = true; document.body.classList.remove('sb-open'); }

function applyTheme(){ document.documentElement.setAttribute('data-theme', S.theme||'light'); }

function parseHash(){
  const h = (location.hash || '#/').replace(/^#/,'');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  (qs||'').split('&').filter(Boolean).forEach(kv => { const [k,v] = kv.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { parts, params };
}
function route(){
  const { parts, params } = parseHash();
  const main = $('#main');
  Speech.stop();
  if (!parts.length) { routeState.view='home'; viewHome(); }
  else if (parts[0] === 'lesson') {
    const l = lessonById(+parts[1]);
    routeState.view='lesson'; routeState.lesson=l; routeState.tab=parts[2]||'theory';
    if (l) { const st = lessonState(l.id); st.opened = st.opened || Date.now(); save(); }
    viewLesson(+parts[1], parts[2] || 'theory');
  }
  else if (parts[0] === 'module') { routeState.view='module'; routeState.mid=parts[1]; viewModule(parts[1]); }
  else if (parts[0] === 'vocab') { routeState.view='vocab'; viewVocab(); }
  else if (parts[0] === 'grammar') { routeState.view='grammar'; viewGrammar(params.q||''); }
  else if (parts[0] === 'tests') { routeState.view='tests'; viewTests(); }
  else if (parts[0] === 'settings') { routeState.view='settings'; viewSettings(); }
  else if (parts[0] === 'search') { routeState.view='search'; viewSearch(params.q||''); }
  else { routeState.view='home'; viewHome(); }
  renderSidebar();
  closeSidebar();
}

/* ------------------------------------------------------------------ */
/* 11. Инициализация                                                   */
/* ------------------------------------------------------------------ */
window.addEventListener('hashchange', route);
/* клик по ссылке на ТЕКУЩИЙ хэш не вызывает hashchange — перерисовываем вручную */
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#"]');
  if (!a) return;
  const href = a.getAttribute('href');
  if (!href || href === '#') return;
  if (href === location.hash || href === '#' + location.hash.replace(/^#/,'')) {
    e.preventDefault();
    route();
  }
});
window.addEventListener('beforeunload', saveNow);
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    e.preventDefault();
    const s = $('#sbs'); if (s) { if (window.innerWidth < 860) { $('#sidebar').classList.add('open'); $('#scrim').hidden=false; } s.focus(); }
  }
  if (e.key === 'Escape') closeSidebar();
  if (/^[1-4]$/.test(e.key) && !/input|textarea|select/i.test(document.activeElement.tagName)) {
    // быстрый выбор варианта ответа цифрой в первом неотвеченном задании
    const first = $$('.ex-item').find(n => !n.classList.contains('correct') && !n.classList.contains('wrong') && !n.classList.contains('answered'));
    if (first) { const o = first.querySelectorAll('.opt')[+e.key-1]; if (o && !o.disabled) o.click(); }
  }
});
$('#scrim').onclick = closeSidebar;

/* учёт времени занятий */
setInterval(() => {
  if (document.visibilityState !== 'visible') return;
  const t = dstr(Date.now());
  if (todayAnswers() > 0) { S.stats.minutes = (S.stats.minutes||0) + 0.5; save(); }
}, 30000);

const _fab = el('<button id="menu-fab" class="btn primary" aria-label="Открыть меню">'+ic('menu')+'</button>');
document.body.appendChild(_fab);
_fab.onclick = toggleSidebar;

applyTheme();
if (!location.hash) location.hash = '#/';
route();
try { Store.save(S); } catch(e){}
console.log('%cEnglish Zero → International Finance','font:700 14px sans-serif;color:#3358d4',
  '\nУроков: '+TOTAL_LESSONS+' | Слов: '+VOCAB_TOTAL+' | Упражнений: '+LESSONS.reduce((a,l)=>a+exCount(l),0));
</script>
</body>
